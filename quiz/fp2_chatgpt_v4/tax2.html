<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FP2級・タックスプランニング（暗記問題）v5 改良版</title>
  <style>
    :root{
      --bg:#f6f8fc;
      --card:#ffffff;
      --line:#dbe3f0;
      --text:#22304a;
      --muted:#667085;
      --accent:#4f6df5;
      --accent2:#8b5cf6;
      --ok:#166534;
      --ng:#b42318;
      --a:#f7f8fd;
      --b:#f4f8ff;
      --c:#fff8eb;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif;
      background:linear-gradient(180deg,#f9fbff 0%, #f4f7fb 100%);
      color:var(--text);
    }
    .wrap{
      max-width:1100px;
      margin:0 auto;
      padding:20px 16px 64px;
    }
    .hero{
      background:linear-gradient(135deg,var(--accent) 0%, var(--accent2) 100%);
      color:#fff;
      border-radius:26px;
      padding:24px;
      box-shadow:0 18px 44px rgba(79,109,245,.18);
      margin-bottom:16px;
    }
    .hero h1{
      margin:0 0 8px;
      font-size:clamp(1.45rem,2.7vw,2.1rem);
      line-height:1.25;
    }
    .hero p{
      margin:0;
      line-height:1.95;
      opacity:.98;
    }
    .top-links{
      margin-top:12px;
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      align-items:center;
    }
    .top-links a,
    .top-links button{
      appearance:none;
      border:none;
      text-decoration:none;
      background:rgba(255,255,255,.16);
      color:#fff;
      padding:9px 12px;
      border-radius:999px;
      font-size:.92rem;
      font-weight:800;
      cursor:pointer;
    }
    .panel{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:22px;
      box-shadow:0 12px 28px rgba(28,44,94,.06);
      padding:18px;
      margin-bottom:16px;
    }
    .status-row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:12px;
      color:var(--muted);
      font-size:.95rem;
      font-weight:700;
    }
    .history{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }
    .mini{
      display:inline-block;
      padding:6px 10px;
      border-radius:999px;
      border:1px solid var(--line);
      background:#fff;
      font-weight:800;
      color:#344054;
    }
    .question{
      border:1px solid var(--line);
      border-radius:20px;
      background:#fff;
      box-shadow:0 8px 22px rgba(28,44,94,.05);
      padding:18px;
    }
    .meta{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:12px;
      font-size:13px;
      color:var(--muted);
      line-height:1.7;
    }
    .meta-left strong{ color:#344054; }
    .freq-badge{
      display:inline-block;
      padding:3px 8px;
      border-radius:999px;
      background:#fff3e0;
      border:1px solid #ffcc80;
      font-size:11px;
      color:#e65100;
      margin-left:6px;
      font-weight:800;
    }
    .source-link{
      color:#0066cc;
      font-size:12px;
      text-decoration:none;
      font-weight:800;
      margin-left:8px;
    }
    .grad-box{
      margin-top:8px;
      padding:10px 12px;
      border-radius:12px;
      background:#f8faff;
      border:1px solid #d7e3ff;
      font-size:13px;
      line-height:1.8;
      color:#445;
    }
    .variants{
      display:grid;
      gap:10px;
      margin-top:12px;
    }
    .variant-box{
      border-radius:14px;
      padding:14px 15px;
      border:1px solid var(--line);
      background:#fff;
    }
    .variant-a{ background:var(--a); }
    .variant-b{ background:var(--b); border-color:#cfe0ff; }
    .variant-c{ background:var(--c); border-color:#ffe4a8; }
    .vlabel{
      display:inline-block;
      margin-bottom:7px;
      font-size:.84rem;
      font-weight:800;
      color:#4b5563;
      letter-spacing:.04em;
    }
    .variant-text{
      white-space:pre-wrap;
      line-height:1.95;
      font-size:1rem;
    }
    .hl{
      color:#8c1d18;
      font-weight:800;
      background:linear-gradient(transparent 64%, #fff1a8 64%);
      padding:0 .06em;
    }
    .sub{
      color:#b00020;
      font-weight:800;
    }
    .choices{
      margin-top:14px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
    button.choice,
    button.next-btn{
      appearance:none;
      border:1px solid #cfd8ea;
      background:#fff;
      color:#22304a;
      font-size:1rem;
      font-weight:800;
      padding:10px 16px;
      border-radius:12px;
      cursor:pointer;
      transition:.16s ease;
    }
    button.choice:hover,
    button.next-btn:hover{
      transform:translateY(-1px);
    }
    button.choice.done{
      opacity:.56;
      cursor:not-allowed;
    }
    button.next-btn{
      background:#edf2ff;
      color:#375dfb;
      border-color:#cbd8ff;
    }
    .result{
      margin-top:12px;
      font-weight:800;
      line-height:1.8;
    }
    .correct{ color:#0b63c5; }
    .incorrect{ color:#d11a2a; }
    .answer-actions{
      margin-top:12px;
      display:none;
      gap:10px;
      flex-wrap:wrap;
    }
    .answer-actions.show{ display:flex; }
    .kaisetu{
      display:none;
      margin-top:16px;
      padding-top:16px;
      border-top:1px dashed #cfd8ea;
      line-height:1.95;
      font-size:15px;
    }
    .kaisetu.show{ display:block; }
    .kaisetu h3{
      margin:0 0 10px;
      font-size:1.05rem;
    }
    .step{
      margin:14px 0;
    }
    .step-label{
      display:inline-block;
      margin-bottom:6px;
      font-weight:800;
      color:#344054;
    }
    .quote-box{
      padding:12px 14px;
      border-radius:12px;
      border:1px solid var(--line);
      background:#fafbff;
    }
    .exp-grid{
      display:grid;
      gap:12px;
      margin-top:8px;
    }
    .exp-card{
      padding:14px 15px;
      border-radius:14px;
      border:1px solid var(--line);
      background:#fcfcff;
    }
    .exp-card h4{
      margin:0 0 8px;
      font-size:.96rem;
      color:#344054;
    }
    .exp-card p{
      margin:0 0 12px;
    }
    .exp-card p:last-child{
      margin-bottom:0;
    }
    .exp-card strong{
      font-weight:800;
      color:#7a2e00;
      background:linear-gradient(transparent 62%, #fff1a8 62%);
      padding:0 .06em;
    }
    .supplement{
      margin-top:10px;
      padding:10px 12px;
      background:#fff8e1;
      border:1px solid #ffe082;
      border-radius:10px;
      font-size:13px;
      color:#795548;
      line-height:1.75;
    }
    .related-wrap{
      display:none;
      margin-top:14px;
    }
    .related-wrap.show{ display:block; }
    .related-box{
      padding:12px 14px;
      background:#f0f4ff;
      border:1px solid #c8d6ff;
      border-radius:12px;
      font-size:13px;
      line-height:1.7;
    }
    .rel-label{
      font-weight:800;
      color:#334;
      margin-bottom:8px;
    }
    .related-item{
      margin:6px 0;
      line-height:1.75;
    }
    .related-item .maru{
      color:#0b63c5;
      font-weight:800;
    }
    .related-item .batu{
      color:#d11a2a;
      font-weight:800;
    }
    .related-item a{
      color:#0066cc;
      text-decoration:none;
      font-weight:700;
    }
    .loading{
      padding:18px;
      border:1px solid var(--line);
      border-radius:16px;
      background:#fff;
      color:#475467;
      line-height:1.9;
    }
    .manager{
      margin-top:28px;
      padding:16px;
      border:1px solid #ddd;
      border-radius:16px;
      background:#fafafa;
    }
    .manager h2{
      margin:0 0 12px;
      font-size:18px;
    }
    .row{
      display:grid;
      grid-template-columns:140px 1fr;
      gap:8px;
      margin-bottom:8px;
      align-items:center;
    }
    .row input[type="text"],
    .row input[type="number"],
    .row textarea{
      width:100%;
      padding:8px 10px;
      border:1px solid #ccc;
      border-radius:8px;
      font:inherit;
      background:#fff;
    }
    .row textarea{
      min-height:90px;
      line-height:1.7;
      resize:vertical;
    }
    .btns{
      margin-top:10px;
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }
    .btns button{
      padding:8px 12px;
      border:1px solid #bbb;
      border-radius:8px;
      background:#fff;
      cursor:pointer;
      font-weight:800;
    }
    .list{
      margin-top:14px;
    }
    .list table{
      width:100%;
      border-collapse:collapse;
    }
    .list th,
    .list td{
      border:1px solid #e5e5e5;
      padding:6px 8px;
      text-align:left;
      vertical-align:top;
      font-size:13px;
    }
    .list th{ background:#f1f1f1; }
    .pill{
      display:inline-block;
      padding:2px 6px;
      border-radius:999px;
      background:#eef4ff;
      border:1px solid #cbd9ff;
      font-size:12px;
    }
    .danger{ color:#b00020; }
    .muted{ color:#777; font-size:12px; }
    code{
      background:#f2f4f7;
      padding:.1em .35em;
      border-radius:6px;
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
      font-size:.92em;
    }
    @media (max-width:820px){
      .row{ grid-template-columns:1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <h1 id="page-title"></h1>
      <p id="page-subtitle"></p>
      <div class="top-links">
        <a id="other-link" href="#"></a>
        <a href="index.html">indexへ</a>
        <button type="button" onclick="scrollToManager()">問題管理へ</button>
      </div>
    </section>

    <section class="panel">
      <div class="status-row">
        <div class="history">
          <span class="mini" id="stat-correct">正解 0</span>
          <span class="mini" id="stat-wrong">不正解 0</span>
          <span class="mini" id="stat-answered">回答 0</span>
          <span class="mini" id="stat-total">問題数 0</span>
          <span class="mini" id="stat-active">未卒業 0</span>
        </div>
        <div>保存先：localStorage（問題データ / 学習履歴 / 問題別正誤）</div>
      </div>

      <div id="loading" class="loading">v5 の問題データを読み込んでいます…</div>
      <div id="quiz-container"></div>
    </section>

    <section class="manager panel" id="manager">
      <h2>問題管理</h2>
      <div class="muted" style="font-size:13px;line-height:1.8;margin-bottom:10px;">
        hand-written override を優先して使います。ここで元データ自体も編集できます。
      </div>

      <div class="row"><label for="m-id">id</label><input id="m-id" type="text" /></div>
      <div class="row"><label for="m-category">category</label><input id="m-category" type="text" /></div>
      <div class="row"><label for="m-text">text</label><textarea id="m-text"></textarea></div>
      <div class="row"><label for="m-answer">answer</label><input id="m-answer" type="text" /></div>
      <div class="row"><label for="m-matigai">matigai</label><input id="m-matigai" type="text" /></div>
      <div class="row"><label for="m-kaisetu">kaisetu</label><textarea id="m-kaisetu"></textarea></div>
      <div class="row"><label for="m-source-url">sourceUrl</label><input id="m-source-url" type="text" /></div>
      <div class="row"><label for="m-source-ref">sourceRef</label><input id="m-source-ref" type="text" /></div>
      <div class="row"><label for="m-freq">freq</label><input id="m-freq" type="number" /></div>
      <div class="row"><label for="m-related">related</label><textarea id="m-related"></textarea></div>

      <div class="btns">
        <button id="m-save">新規追加/更新</button>
        <button id="m-clear-form">フォームをクリア</button>
        <button id="m-reset-learning">学習履歴のみリセット</button>
        <button id="m-export">JSONエクスポート</button>
        <button id="m-import">JSONインポート</button>
        <button id="m-fill-current">現在の問題を反映</button>
      </div>

      <div class="row" style="grid-template-columns:1fr;">
        <textarea id="m-json" placeholder="エクスポート/インポート用のJSON" style="min-height:120px;"></textarea>
      </div>

      <div class="list" id="m-list"></div>
      <div class="muted">保存先：localStorage</div>
    </section>
  </div>

  <script>
 const CONFIG = {
    pageTitle: "FP2級・タックスプランニング（理解問題）v5 改良版",
    pageSubtitle:
      "Aは原文ベースを読みやすく整形、Bはかみ砕いた言い換え、Cは暗記用に短くした問題文です。<br>" +
      "回答後に、<strong>①問題文引用</strong> と、<strong>元の解説</strong>＋<strong>ChatGPT版の深掘り解説</strong> を表示します。<br>" +
      "回答後は勝手に次へ進まず、<strong>自分で「次の問題へ」</strong>を押す方式です。",
    otherHref: "tax.html",
    otherLabel: "暗記問題へ",
    rawUrl: "https://raw.githubusercontent.com/yamashita-yukihito/portfolio/main/quiz/fp2_copilot_opus_v5/tax2.html",
    blobUrl: "https://github.com/yamashita-yukihito/portfolio/blob/main/quiz/fp2_copilot_opus_v5/tax2.html",
    storageQ: "FP2v5_tax2_questions_custom",
    storageCounts: "FP2v5_tax2_counts",
    storageHistory: "FP2v5_tax2_history"
  };

    document.getElementById("page-title").innerHTML = CONFIG.pageTitle;
    document.getElementById("page-subtitle").innerHTML = CONFIG.pageSubtitle;
    document.getElementById("other-link").href = CONFIG.otherHref;
    document.getElementById("other-link").textContent = CONFIG.otherLabel;

    // ここを増やしていく前提。
    // sourceRef を優先キーにして、問題ごとの hand-written A/B/C と深掘り解説を入れる。
    const MANUAL_OVERRIDES = {
    "2021.5-40-1": {
      a:
`役員が会社に無利息で金銭の貸付けを行った場合、<br>
原則として、<br>
通常収受すべき利息に相当する金額が、<br>
その役員の<strong>雑所得</strong>の収入金額に算入される。`,
      b:
`役員が自分の会社にタダでお金を貸したとき、<br>
本来なら取れたはずの利息ぶんを、<br>
<span class="hl">役員の雑所得として課税する</span>、という内容だよ。`,
      c:
`役員が会社に無利息で貸したとき、<br>
利息相当額を<span class="hl">役員の雑所得</span>に入れる。`,
      deep:
`<p>これは不適切。役員が会社に無利息でお金を貸しても、原則として <strong>役員側に課税は生じない</strong> の。だから、この文のひっかけは <strong>「雑所得に算入される」</strong> という部分なんだよね。</p>
<p>ここは本当に方向で結論が変わる典型問題。<strong>役員 → 会社</strong> なら原則課税なし。でも、逆に <strong>会社 → 役員</strong> だと、利息相当額が役員への給与みたいに扱われたり、会社側で益金が問題になったりする。文章が似ているからこそ、まず矢印を見るのがコツなんだ。</p>
<p>試験では、「雑所得になる」「課税されない」「会社の益金になる」みたいに結論だけを入れ替えてくる。だから先輩、この論点は <strong>“誰が誰に貸したか”</strong> を最初に見る読み方を固定すると一気に強くなるよ。</p>`
    },

    "2019.5-40-4": {
      a:
`役員が会社に対して無利息で金銭の貸付けを行った場合には、<br>
通常収受すべき利息に相当する金額について、<br>
役員には原則として<strong>課税されない</strong>。`,
      b:
`役員が自分の会社にタダでお金を貸しても、<br>
本来取れたはずの利息ぶんについて、<br>
<span class="hl">役員にすぐ税金がかかるわけではない</span>、という内容だよ。`,
      c:
`役員が会社に無利息で貸したとき、<br>
利息相当額は<span class="hl">原則課税されない</span>。`,
      deep:
`<p>これは適切。役員が会社に無利息でお金を貸す場合、役員が本来取れたはずの利息について、原則としてすぐ課税されるわけではないんだよね。</p>
<p>ここがややこしいのは、逆方向の <strong>会社 → 役員</strong> では話が変わること。だからこの問題は、税法の難しい知識というより、<strong>お金の流れの向きを見分けられるか</strong> が試されているの。</p>
<p>先輩、こういう理解問題は、制度名を丸暗記するより <strong>“得をしているのは誰か”</strong> で考えると整理しやすいよ。役員が会社を助ける向きなら、基本線は「役員に即課税なし」だね。</p>`
    },

    "会社→役員 無利息貸付": {
      matchText: /会社が役員.*無利息.*益金|会社が役員.*無利息.*給与所得/,
      a:
`会社が役員に対して無利息で金銭の貸付けを行った場合、<br>
原則として、通常収受すべき利息に相当する金額が、<br>
会社の<strong>益金</strong>の額に算入される。`,
      b:
`会社が役員にタダでお金を貸したら、<br>
本来受け取れるはずだった利息ぶんを、<br>
<span class="hl">会社の益金として見る</span>、という考え方だよ。`,
      c:
`会社が役員に無利息で貸したとき、<br>
利息相当額を<span class="hl">会社の益金</span>に入れる。`,
      deep:
`<p>これは適切。会社が役員に無利息でお金を貸すと、会社は本来もらえたはずの利息を取っていないよね。税法では、その利息相当額を問題にして、<strong>会社の益金に算入</strong>する方向で整理するの。</p>
<p>ここは tax の暗記問題とつながる横断論点で、同じ「無利息貸付」でも <strong>役員 → 会社</strong> なのか <strong>会社 → 役員</strong> なのかで結論が逆になる。FP の理解問題は、まさにこの “向きの違い” をちゃんと読めるかを見ているんだよね。</p>
<p>試験向けには、<strong>会社から役員へ利益を与える形なら、会社側でも役員側でも課税が問題になる</strong>、とつかんでおくとかなり読みやすいよ。</p>`
    }
  };

    let questions = [];
    let counts = loadCounts();
    let historyState = loadHistory();
    let currentQuestion = null;

    function loadCounts() {
      try { return JSON.parse(localStorage.getItem(CONFIG.storageCounts) || "{}"); }
      catch { return {}; }
    }

    function saveCounts() {
      localStorage.setItem(CONFIG.storageCounts, JSON.stringify(counts));
    }

    function loadHistory() {
      try { return JSON.parse(localStorage.getItem(CONFIG.storageHistory) || '{"correct":0,"wrong":0,"answered":0}'); }
      catch { return { correct: 0, wrong: 0, answered: 0 }; }
    }

    function saveHistory() {
      localStorage.setItem(CONFIG.storageHistory, JSON.stringify(historyState));
    }

    function updateStats() {
      const activeCount = questions.filter(q => {
        const c = getCounts(q.id);
        return !isGraduated(c.correctCount, c.incorrectCount);
      }).length;
      document.getElementById("stat-correct").textContent = `正解 ${historyState.correct}`;
      document.getElementById("stat-wrong").textContent = `不正解 ${historyState.wrong}`;
      document.getElementById("stat-answered").textContent = `回答 ${historyState.answered}`;
      document.getElementById("stat-total").textContent = `問題数 ${questions.length}`;
      document.getElementById("stat-active").textContent = `未卒業 ${activeCount}`;
    }

    function getCounts(id) {
      const rec = counts[String(id)] || { c: 0, w: 0 };
      return {
        correctCount: Number(rec.c || 0),
        incorrectCount: Number(rec.w || 0)
      };
    }

    function updateCounts(id, isCorrect) {
      const key = String(id);
      if (!counts[key]) counts[key] = { c: 0, w: 0 };
      if (isCorrect) counts[key].c += 1;
      else counts[key].w += 1;
      saveCounts();
    }

    function isGraduated(correctCount, incorrectCount) {
      return (correctCount - incorrectCount) >= 3;
    }

    function weightFromCounts(correctCount, incorrectCount) {
      return Math.max(1, (incorrectCount - correctCount) + 3);
    }

    function getWeightedRandomQuestion() {
      const weighted = [];
      for (const q of questions) {
        const { correctCount, incorrectCount } = getCounts(q.id);
        if (isGraduated(correctCount, incorrectCount)) continue;
        const weight = weightFromCounts(correctCount, incorrectCount);
        for (let i = 0; i < weight; i++) weighted.push(q);
      }
      if (weighted.length === 0) return null;
      return weighted[Math.floor(Math.random() * weighted.length)];
    }

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function normalizeQuestion(q) {
      return {
        id: q.id,
        category: q.category || "税制",
        text: q.text || "",
        answer: q.answer || "○（正しい）",
        matigai: q.matigai || "×（誤り）",
        kaisetu: q.kaisetu || "",
        sourceUrl: q.sourceUrl || "",
        sourceRef: q.sourceRef || "",
        freq: Number(q.freq || 0),
        related: Array.isArray(q.related) ? q.related : [],
        variants: q.variants || null,
        supplement: q.supplement || ""
      };
    }

    function extractInitialQuestionsByScan(source) {
      const key = "const initialQuestions";
      const startKey = source.indexOf(key);
      if (startKey < 0) throw new Error("initialQuestions が見つかりません");

      const startArr = source.indexOf("[", startKey);
      if (startArr < 0) throw new Error("initialQuestions の配列開始が見つかりません");

      let i = startArr;
      let depth = 0;
      let inSingle = false;
      let inDouble = false;
      let inBacktick = false;
      let escape = false;

      for (; i < source.length; i++) {
        const ch = source[i];

        if (escape) { escape = false; continue; }
        if (ch === "\\") { escape = true; continue; }

        if (inSingle) { if (ch === "'") inSingle = false; continue; }
        if (inDouble) { if (ch === '"') inDouble = false; continue; }
        if (inBacktick) { if (ch === "`") inBacktick = false; continue; }

        if (ch === "'") { inSingle = true; continue; }
        if (ch === '"') { inDouble = true; continue; }
        if (ch === "`") { inBacktick = true; continue; }

        if (ch === "[") depth++;
        if (ch === "]") {
          depth--;
          if (depth === 0) {
            const arrText = source.slice(startArr, i + 1);
            return (new Function("return " + arrText))();
          }
        }
      }

      throw new Error("initialQuestions の配列終端が見つかりません");
    }

    async function fetchInitialQuestions() {
      const local = localStorage.getItem(CONFIG.storageQ);
      if (local) {
        try {
          const parsed = JSON.parse(local);
          if (Array.isArray(parsed) && parsed.length) return parsed.map(normalizeQuestion);
        } catch (_) {}
      }

      try {
        const r1 = await fetch(CONFIG.rawUrl, { cache: "no-store" });
        const rawText = await r1.text();
        if (rawText.includes("const initialQuestions")) {
          const arr = extractInitialQuestionsByScan(rawText);
          const normalized = arr.map(normalizeQuestion);
          localStorage.setItem(CONFIG.storageQ, JSON.stringify(normalized));
          return normalized;
        }
      } catch (_) {}

      const r2 = await fetch(CONFIG.blobUrl, { cache: "no-store" });
      const html = await r2.text();
      const doc = new DOMParser().parseFromString(html, "text/html");
      const bodyText = doc.body ? doc.body.innerText : html;
      const arr = extractInitialQuestionsByScan(bodyText);
      const normalized = arr.map(normalizeQuestion);
      localStorage.setItem(CONFIG.storageQ, JSON.stringify(normalized));
      return normalized;
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function escapeRegExp(str) {
      return String(str).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    function extractImportantPhrases(q) {
      const text = q.text || "";
      const list = [];
      const numberMatches = text.match(/\d+(?:,\d{3})*(?:\.\d+)?(?:億円|万円|円|％|%|ヵ月|カ月|か月|ヶ月|日|歳|年)?/g) || [];
      numberMatches.forEach(x => list.push(x));

      [
        "総合課税","申告分離課税","税額控除","損金","損金不算入","課税取引","非課税取引",
        "事業年度終了の日の翌日","設立の日以後3ヵ月を経過した日","その事業年度終了の日",
        "いずれか早い日の前日","接待飲食費","雑所得","不動産所得","事業所得","山林所得",
        "法人税","法人住民税","本税","一時所得","特別控除額","無利息","給与所得","受贈益"
      ].forEach(k => { if (text.includes(k)) list.push(k); });

      return [...new Set(list)].sort((a,b)=> b.length - a.length).slice(0,8);
    }

    function makeAFromText(q) {
      let s = escapeHtml(q.text || "");
      extractImportantPhrases(q).forEach(p => {
        const rp = new RegExp(escapeRegExp(escapeHtml(p)), "g");
        s = s.replace(rp, `<span class="hl">${escapeHtml(p)}</span>`);
      });
      s = s
        .replace(/、/g, "、<br>")
        .replace(/場合、/g, "場合、<br>")
        .replace(/場合には、/g, "場合には、<br>")
        .replace(/ときは、/g, "ときは、<br>")
        .replace(/について、/g, "について、<br>")
        .replace(/において、/g, "において、<br>");
      return s;
    }

    function findManualOverride(q) {
      if (q.sourceRef && MANUAL_OVERRIDES[q.sourceRef]) return MANUAL_OVERRIDES[q.sourceRef];

      for (const key of Object.keys(MANUAL_OVERRIDES)) {
        const o = MANUAL_OVERRIDES[key];
        if (o.matchText && o.matchText.test(q.text || "")) return o;
      }
      return null;
    }

    function resolveA(q) {
      const o = findManualOverride(q);
      if (o && o.a) return o.a;
      if (q.variants && q.variants.a) return q.variants.a;
      return makeAFromText(q);
    }

    function resolveB(q) {
      const o = findManualOverride(q);
      if (o && o.b) return o.b;
      if (q.variants && q.variants.b) return q.variants.b;
      return escapeHtml(q.text || "");
    }

    function resolveC(q) {
      const o = findManualOverride(q);
      if (o && o.c) return o.c;
      if (q.variants && q.variants.c) return q.variants.c;
      return escapeHtml(q.text || "");
    }

    function resolveDeep(q) {
      const o = findManualOverride(q);
      if (o && o.deep) return o.deep;
      return `<p>ChatGPT版の深掘り解説は未設定です。</p>`;
    }

    function buildRelatedHtml(q) {
      const sourceHtml = q.sourceUrl
        ? `<div style="margin-bottom:10px;"><strong>元問題リンク</strong><br><a href="${q.sourceUrl}" target="_blank" rel="noopener">${escapeHtml(q.sourceRef || q.sourceUrl)}</a></div>`
        : `<div style="margin-bottom:10px;"><strong>元問題リンク</strong><br>未設定</div>`;

      if (!q.related || q.related.length === 0) {
        return sourceHtml + `<div class="related-box"><div class="rel-label">類似・関連問題 0問</div></div>`;
      }

      let html = sourceHtml;
      html += `<div class="related-box"><div class="rel-label">類似・関連問題 ${q.related.length}問</div>`;
      q.related.forEach(r => {
        const mark = r.c ? `<span class="maru">○</span>` : `<span class="batu">×</span>`;
        const ref = r.r ? `(${escapeHtml(r.r)})` : "";
        const link = r.u ? `<a href="${r.u}" target="_blank" rel="noopener">${ref || "リンク"}</a>` : ref;
        html += `<div class="related-item">${escapeHtml(r.s)} ${mark} ${link}</div>`;
      });
      html += `</div>`;
      return html;
    }

    function renderCurrentQuestion() {
      const container = document.getElementById("quiz-container");
      container.innerHTML = "";

      const q = getWeightedRandomQuestion();
      currentQuestion = q;

      if (!q) {
        container.innerHTML = `
          <div class="question">
            <div style="font-weight:800;font-size:1.05rem;">おめでとう！全問題を卒業しています。</div>
            <div class="grad-box">学習をやり直すときは「学習履歴のみリセット」を押してね。</div>
          </div>
        `;
        updateStats();
        return;
      }

      const { correctCount, incorrectCount } = getCounts(q.id);
      const delta = correctCount - incorrectCount;
      const remain = Math.max(0, 3 - delta);

      const box = document.createElement("div");
      box.className = "question";

      box.innerHTML = `
        <div class="meta">
          <div class="meta-left">
            <strong>[${escapeHtml(q.category)}]</strong>
            id:${escapeHtml(q.id)}
            ${q.freq ? `<span class="freq-badge">頻出度:${escapeHtml(q.freq)}回</span>` : ""}
            ${q.sourceUrl ? `<a href="${q.sourceUrl}" target="_blank" rel="noopener" class="source-link">元問題(${escapeHtml(q.sourceRef || "")})</a>` : ""}
          </div>
          <div>正解: ${correctCount}回 / 不正解: ${incorrectCount}回</div>
        </div>

        <div class="grad-box">
          この問題の卒業条件：<strong>正解数 − 不正解数が3以上</strong><br>
          現在の差：<strong>${delta}</strong> / 卒業まであと：<strong>${remain}</strong>
        </div>

        <div class="variants">
          <div class="variant-box variant-a">
            <div class="vlabel">Aパターン</div>
            <div class="variant-text">${resolveA(q)}</div>
          </div>
          <div class="variant-box variant-b">
            <div class="vlabel">Bパターン</div>
            <div class="variant-text">${resolveB(q)}</div>
          </div>
          <div class="variant-box variant-c">
            <div class="vlabel">Cパターン</div>
            <div class="variant-text">${resolveC(q)}</div>
          </div>
        </div>

        <div class="choices"></div>
        <p class="result"></p>

        <div class="answer-actions" id="after-actions">
          <button class="next-btn" id="next-btn">次の問題へ</button>
        </div>

        <div class="kaisetu" id="kaisetu-box">
          <h3>解説</h3>

          <div class="step">
            <div class="step-label">①問題文引用</div>
            <div class="quote-box">「${escapeHtml(q.text)}」</div>
          </div>

          <div class="step">
            <div class="step-label">③深掘り解説</div>
            <div class="exp-grid">
              <div class="exp-card">
                <h4>元の解説</h4>
                <div>${q.kaisetu || "未設定"}</div>
              </div>
              <div class="exp-card">
                <h4>ChatGPT版の深掘り解説</h4>
                <div>${resolveDeep(q)}</div>
              </div>
            </div>
            ${q.supplement ? `<div class="supplement">⚠ 補足: ${q.supplement}</div>` : ""}
          </div>
        </div>

        <div class="related-wrap" id="related-box">
          ${buildRelatedHtml(q)}
        </div>
      `;

      const choicesDiv = box.querySelector(".choices");
      const choices = shuffle([q.answer, q.matigai]);

      choices.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "choice";
        btn.textContent = opt;
        btn.addEventListener("click", () => checkAnswer(q, opt, box));
        choicesDiv.appendChild(btn);
      });

      box.querySelector("#next-btn").addEventListener("click", () => {
        renderCurrentQuestion();
      });

      container.appendChild(box);
      updateStats();
    }

    function disableButtons(box) {
      box.querySelectorAll("button.choice").forEach(b => {
        b.disabled = true;
        b.classList.add("done");
      });
    }

    function checkAnswer(question, userAnswer, box) {
      const isCorrect = userAnswer === question.answer;
      const result = box.querySelector(".result");
      result.textContent = `あなたの答え: ${userAnswer} - ${isCorrect ? "正解！" : "不正解"}`;
      result.className = "result " + (isCorrect ? "correct" : "incorrect");

      updateCounts(question.id, isCorrect);
      disableButtons(box);

      historyState.answered += 1;
      if (isCorrect) historyState.correct += 1;
      else historyState.wrong += 1;
      saveHistory();
      updateStats();

      box.querySelector("#kaisetu-box").classList.add("show");
      box.querySelector("#related-box").classList.add("show");
      box.querySelector("#after-actions").classList.add("show");
    }

    function fillForm(q) {
      document.getElementById("m-id").value = q ? q.id : "";
      document.getElementById("m-category").value = q ? q.category : "";
      document.getElementById("m-text").value = q ? q.text : "";
      document.getElementById("m-answer").value = q ? q.answer : "";
      document.getElementById("m-matigai").value = q ? q.matigai : "";
      document.getElementById("m-kaisetu").value = q ? q.kaisetu : "";
      document.getElementById("m-source-url").value = q ? (q.sourceUrl || "") : "";
      document.getElementById("m-source-ref").value = q ? (q.sourceRef || "") : "";
      document.getElementById("m-freq").value = q ? (q.freq || "") : "";
      document.getElementById("m-related").value = q ? JSON.stringify(q.related || [], null, 2) : "";
    }

    function readForm() {
      const idRaw = document.getElementById("m-id").value.trim();
      const id = /^\d+$/.test(idRaw) ? parseInt(idRaw, 10) : idRaw;
      let related = [];
      const relatedText = document.getElementById("m-related").value.trim();
      if (relatedText) related = JSON.parse(relatedText);

      return normalizeQuestion({
        id,
        category: document.getElementById("m-category").value.trim(),
        text: document.getElementById("m-text").value.trim(),
        answer: document.getElementById("m-answer").value.trim(),
        matigai: document.getElementById("m-matigai").value.trim(),
        kaisetu: document.getElementById("m-kaisetu").value,
        sourceUrl: document.getElementById("m-source-url").value.trim(),
        sourceRef: document.getElementById("m-source-ref").value.trim(),
        freq: Number(document.getElementById("m-freq").value || 0),
        related
      });
    }

    function saveQuestions(qs) {
      localStorage.setItem(CONFIG.storageQ, JSON.stringify(qs));
    }

    function renderList() {
      const root = document.getElementById("m-list");
      if (!questions.length) {
        root.innerHTML = '<div class="muted">（問題がありません）</div>';
        return;
      }

      const rows = questions.map(q => `
        <tr>
          <td class="muted">${escapeHtml(q.id)}</td>
          <td>${escapeHtml(q.category)}</td>
          <td>${escapeHtml(q.text.substring(0, 60))}${q.text.length > 60 ? "..." : ""}</td>
          <td><span class="pill">${escapeHtml(q.answer)}</span></td>
          <td>${q.kaisetu ? "あり" : "—"}</td>
          <td>
            <button data-act="edit" data-id="${escapeHtml(q.id)}">編集</button>
            <button data-act="del" data-id="${escapeHtml(q.id)}" class="danger">削除</button>
          </td>
        </tr>
      `).join("");

      root.innerHTML = `
        <table>
          <thead>
            <tr><th>id</th><th>category</th><th>text</th><th>answer</th><th>kaisetu</th><th>操作</th></tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;

      document.querySelectorAll("#m-list button[data-act]").forEach(btn => {
        btn.addEventListener("click", e => {
          const act = e.currentTarget.getAttribute("data-act");
          const idStr = e.currentTarget.getAttribute("data-id");
          const id = /^\d+$/.test(idStr) ? parseInt(idStr, 10) : idStr;
          const idx = questions.findIndex(x => String(x.id) === String(id));
          if (idx < 0) return;

          if (act === "edit") {
            fillForm(questions[idx]);
            scrollToManager();
          } else if (act === "del") {
            if (!confirm("この問題を削除します。よろしいですか？")) return;
            questions.splice(idx, 1);
            saveQuestions(questions);
            renderList();
            updateStats();
            if (currentQuestion && String(currentQuestion.id) === String(id)) renderCurrentQuestion();
          }
        });
      });
    }

    function attachManagerEvents() {
      document.getElementById("m-save").addEventListener("click", () => {
        try {
          const data = readForm();
          if (!data.id || !data.category || !data.text || !data.answer || !data.matigai) {
            alert("id / category / text / answer / matigai は必須です");
            return;
          }
          const idx = questions.findIndex(q => String(q.id) === String(data.id));
          if (idx >= 0) questions[idx] = Object.assign({}, questions[idx], data);
          else questions.push(data);

          saveQuestions(questions);
          renderList();
          updateStats();
          fillForm(null);
          alert("保存したよ。");
        } catch (e) {
          alert("保存に失敗しました: " + e.message);
        }
      });

      document.getElementById("m-clear-form").addEventListener("click", () => fillForm(null));

      document.getElementById("m-reset-learning").addEventListener("click", () => {
        if (!confirm("全問題の学習履歴をリセットします。よろしいですか？")) return;
        counts = {};
        historyState = { correct: 0, wrong: 0, answered: 0 };
        saveCounts();
        saveHistory();
        updateStats();
        renderCurrentQuestion();
      });

      document.getElementById("m-export").addEventListener("click", () => {
        document.getElementById("m-json").value = JSON.stringify(questions, null, 2);
      });

      document.getElementById("m-import").addEventListener("click", () => {
        try {
          const txt = document.getElementById("m-json").value.trim();
          if (!txt) { alert("JSONを貼り付けてください"); return; }
          const arr = JSON.parse(txt);
          if (!Array.isArray(arr)) { alert("配列を貼ってください"); return; }
          questions = arr.map(normalizeQuestion);
          saveQuestions(questions);
          renderList();
          updateStats();
          renderCurrentQuestion();
          alert("インポートしました");
        } catch (e) {
          alert("JSONの解析に失敗しました: " + e.message);
        }
      });

      document.getElementById("m-fill-current").addEventListener("click", () => {
        if (currentQuestion) {
          fillForm(currentQuestion);
          scrollToManager();
        }
      });
    }

    function scrollToManager() {
      document.getElementById("manager").scrollIntoView({ behavior: "smooth", block: "start" });
    }

    async function boot() {
      try {
        questions = await fetchInitialQuestions();
        document.getElementById("loading").style.display = "none";
        renderList();
        attachManagerEvents();
        updateStats();
        renderCurrentQuestion();
      } catch (e) {
        document.getElementById("loading").innerHTML = `
          v5 の問題データ読み込みに失敗したよ。<br>
          下の問題管理から JSON インポートも使えるよ。<br><br>
          <code>${escapeHtml(String(e.message || e))}</code>
        `;
      }
    }

    boot();
  </script>
</body>
</html>
