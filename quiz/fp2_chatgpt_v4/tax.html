<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FP2級・タックスプランニング（暗記問題）v4</title>
  <style>
    :root{
      --bg:#f7f8fc;
      --card:#fff;
      --line:#dde3f0;
      --text:#1f2a44;
      --muted:#667085;
      --accent:#5b7cff;
      --green:#0f9d58;
      --red:#d93025;
      --soft:#eef3ff;
      --soft2:#f7fbff;
      --a:#f7f7fb;
      --b:#f6fbf7;
      --c:#fff8f2;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif;
      background:linear-gradient(180deg,#f8f9ff 0%, #f4f7fb 100%);
      color:var(--text);
    }
    .wrap{
      max-width:980px;
      margin:0 auto;
      padding:20px 16px 64px;
    }
    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-bottom:18px;
      flex-wrap:wrap;
    }
    .links a{
      color:var(--accent);
      text-decoration:none;
      font-weight:700;
      margin-right:12px;
    }
    .hero{
      background:linear-gradient(135deg,#5b7cff 0%, #8b5cf6 100%);
      color:#fff;
      border-radius:24px;
      padding:24px 22px;
      box-shadow:0 18px 40px rgba(91,124,255,.18);
      margin-bottom:18px;
    }
    .hero h1{
      margin:0 0 8px;
      font-size:clamp(1.4rem,2.7vw,2rem);
    }
    .hero p{
      margin:0;
      line-height:1.8;
      opacity:.96;
    }
    .status{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:14px;
    }
    .pill{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:7px 11px;
      border-radius:999px;
      background:rgba(255,255,255,.16);
      font-size:.88rem;
      font-weight:700;
    }
    .panel{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:22px;
      box-shadow:0 12px 28px rgba(28,44,94,.06);
      padding:18px;
      margin-bottom:16px;
    }
    .question-head{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:12px;
    }
    .meta{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      align-items:center;
    }
    .badge{
      display:inline-block;
      padding:6px 10px;
      border-radius:999px;
      background:var(--soft);
      color:var(--accent);
      font-size:.84rem;
      font-weight:800;
    }
    .progress{
      color:var(--muted);
      font-size:.95rem;
      font-weight:700;
    }
    .variant{
      border:1px solid var(--line);
      border-radius:18px;
      padding:14px 15px;
      margin-top:12px;
      line-height:1.9;
    }
    .variant-a{ background:var(--a); }
    .variant-b{ background:var(--b); }
    .variant-c{ background:var(--c); }
    .label{
      display:inline-block;
      font-size:.84rem;
      font-weight:800;
      color:#555;
      margin-bottom:6px;
      letter-spacing:.04em;
    }
    .key{
      color:#b00020;
      font-weight:800;
    }
    .actions{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      margin-top:18px;
    }
    button{
      border:none;
      border-radius:14px;
      padding:12px 18px;
      font-size:1rem;
      font-weight:800;
      cursor:pointer;
      transition:.16s ease;
    }
    button:hover{ transform:translateY(-1px); }
    .btn-true{ background:#e8f6ee; color:#166534; }
    .btn-false{ background:#fdecec; color:#b42318; }
    .btn-next{ background:#edf2ff; color:#375dfb; }
    .result{
      margin-top:16px;
      padding:14px 15px;
      border-radius:16px;
      font-weight:800;
      display:none;
    }
    .result.ok{ background:#eaf8ef; color:#166534; display:block; }
    .result.ng{ background:#fdecec; color:#b42318; display:block; }
    .explanation{
      display:none;
      margin-top:14px;
      border-top:1px dashed var(--line);
      padding-top:16px;
      line-height:1.9;
    }
    .explanation.show{ display:block; }
    .explanation h3{
      margin:0 0 8px;
      font-size:1rem;
    }
    .point{
      background:linear-gradient(transparent 60%, #fff1a8 60%);
      font-weight:800;
    }
    .foot{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
      margin-top:18px;
      color:var(--muted);
      font-size:.94rem;
    }
    .history{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }
    .mini{
      background:#fff;
      border:1px solid var(--line);
      border-radius:999px;
      padding:6px 10px;
      font-weight:700;
    }
    .list-title{
      margin:0 0 10px;
      font-size:1rem;
    }
    .question-list{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(90px,1fr));
      gap:8px;
    }
    .qbtn{
      background:#fff;
      border:1px solid var(--line);
      border-radius:12px;
      padding:10px 8px;
      font-weight:800;
      color:#344054;
      cursor:pointer;
    }
    .qbtn.current{
      background:#eef3ff;
      border-color:#bfd0ff;
      color:#375dfb;
    }
    @media (max-width:640px){
      .panel{ padding:14px; }
      button{ width:100%; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="links">
        <a href="#">理解問題へ（準備中）</a>
        <a href="index.html">indexへ</a>
      </div>
      <div class="progress" id="progress">1 / 40</div>
    </div>

    <section class="hero">
      <h1>FP2級・タックスプランニング（暗記問題）v4</h1>
      <p>
        ○×二択クイズ。A/B/Cの3パターンを同時表示します。<br>
        Aは原文ベース、Bはやさしい言い換え、Cは暗記用の最短表現。<br>
        回答後に、私の書き直した解説を表示します。
      </p>
      <div class="status">
        <span class="pill">全40問</span>
        <span class="pill">HTML内埋め込み</span>
        <span class="pill">ランダム出題</span>
      </div>
    </section>

    <section class="panel">
      <div class="question-head">
        <div class="meta">
          <span class="badge">タックスプランニング</span>
          <span class="badge">暗記問題</span>
          <span class="badge" id="correctBadge">○ or ×</span>
        </div>
        <div class="progress" id="metaInfo"></div>
      </div>

      <div id="variantA" class="variant variant-a"></div>
      <div id="variantB" class="variant variant-b"></div>
      <div id="variantC" class="variant variant-c"></div>

      <div class="actions">
        <button class="btn-true" onclick="answer(true)">○ 正しい</button>
        <button class="btn-false" onclick="answer(false)">× 誤り</button>
        <button class="btn-next" onclick="nextQuestion()">次の問題へ</button>
      </div>

      <div id="result" class="result"></div>
      <div id="explanation" class="explanation"></div>

      <div class="foot">
        <div class="history">
          <span class="mini" id="statCorrect">正解 0</span>
          <span class="mini" id="statWrong">不正解 0</span>
          <span class="mini" id="statAnswered">回答 0</span>
        </div>
        <div>保存先：localStorage（キー: <code>FP2v4_tax_state</code>）</div>
      </div>
    </section>

    <section class="panel">
      <h2 class="list-title">問題一覧</h2>
      <div id="questionList" class="question-list"></div>
    </section>
  </div>

    let currentIndex = 0;

    const shuffled = [...questions];

    function shuffle(arr){
      for(let i = arr.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }
    shuffle(shuffled);

    function makeExplanation(q){
      return `
        <h3>解説</h3>
        <p><strong>①問題文引用</strong><br>${q.quote}</p>
        <p><strong>②やさしい言い換え</strong><br>${q.easy}</p>
        <p><strong>③深掘り解説</strong><br>${q.deep}</p>
      `;
    }

    function renderList(){
      const area = document.getElementById('questionList');
      area.innerHTML = '';
      shuffled.forEach((q, i) => {
        const btn = document.createElement('button');
        btn.className = 'qbtn' + (i === currentIndex ? ' current' : '');
        btn.textContent = `Q${i + 1}`;
        btn.onclick = () => {
          currentIndex = i;
          renderQuestion();
        };
        area.appendChild(btn);
      });
    }

    function renderQuestion(){
      const q = shuffled[currentIndex];
      document.getElementById('variantA').innerHTML = q.a;
      document.getElementById('variantB').innerHTML = q.b;
      document.getElementById('variantC').innerHTML = q.c;
      document.getElementById('metaInfo').textContent = `${q.source}`;
      document.getElementById('progress').textContent = `${currentIndex + 1} / ${shuffled.length}`;
      document.getElementById('correctBadge').textContent = '○ or ×';
      document.getElementById('result').className = 'result';
      document.getElementById('result').textContent = '';
      document.getElementById('explanation').className = 'explanation';
      document.getElementById('explanation').innerHTML = makeExplanation(q);
      document.getElementById('statCorrect').textContent = `正解 ${state.correct}`;
      document.getElementById('statWrong').textContent = `不正解 ${state.wrong}`;
      document.getElementById('statAnswered').textContent = `回答 ${state.answered}`;
      renderList();
      state.lastIndex = currentIndex;
      localStorage.setItem('FP2v4_tax_state', JSON.stringify(state));
    }

    function answer(userAnswer){
      const q = shuffled[currentIndex];
      const ok = userAnswer === q.correct;
      const result = document.getElementById('result');
      result.className = 'result ' + (ok ? 'ok' : 'ng');
      result.textContent = ok
        ? `正解 ○ 先輩、いい感じ。正誤は「${q.correct ? '○ 正しい' : '× 誤り'}」だよ。`
        : `不正解 × 正誤は「${q.correct ? '○ 正しい' : '× 誤り'}」だよ。`;
      document.getElementById('correctBadge').textContent = q.correct ? '正解：○' : '正解：×';
      document.getElementById('explanation').className = 'explanation show';

      state.answered += 1;
      if(ok){ state.correct += 1; } else { state.wrong += 1; }
      localStorage.setItem('FP2v4_tax_state', JSON.stringify(state));

      document.getElementById('statCorrect').textContent = `正解 ${state.correct}`;
      document.getElementById('statWrong').textContent = `不正解 ${state.wrong}`;
      document.getElementById('statAnswered').textContent = `回答 ${state.answered}`;
    }

    function nextQuestion(){
      currentIndex = (currentIndex + 1) % shuffled.length;
      renderQuestion();
    }

    renderQuestion();
