0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>贈与税の納付は、まず金銭による一括納付が原則です。金銭での納付が難しい場合には延納の制度がありますが、相続税とは違い<strong style='color: #d11a2a; background-color: #fff1f3; padding: 0 3px; border-bottom: 2px solid #f5a3ad;'>物納はありません</strong>。</p><p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>『延納があるなら物納もある』と誤解させるのが典型的なひっかけです。物納があるのは相続税であり、贈与税では認められません。</p><p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>高額贈与を受けるときは、受贈財産だけでなく納税資金も確保しておかないと、あとで資金繰りに困ることがあります。</p></div><div data-joushiki-copy=\"inheritance-30\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">財産を自分の意思で贈与してもらう段階で、納税資金も考えるべきだという扱いです。贈与税には延納はありますが<strong>物納はありません</strong>。</p></div>", "rel": [{"s": "贈与税の納付方法は、金銭による一括納付が原則であるが、所定の要件を満たせば、分割して納付することも認められる。", "c": true, "r": "2018.1-53-3", "u": "https://fp2-siken.com/kakomon/2018_1/53.html"}, {"s": "贈与税の納付方法は、金銭による一括納付が原則であるが、所定の要件を満たせば延納および物納が認められる。", "c": false, "r": "2017.9-53-3", "u": "https://fp2-siken.com/kakomon/2017_9/53.html"}, {"s": "贈与税の納税義務者は、金銭による一括納付が原則であるが、所定の要件を満たせば、分割して納付することも認められる。", "c": true, "r": "2015.9-52-2", "u": "https://fp2-siken.com/kakomon/2015_9/52.html"}, {"s": "贈与税は、金銭による一括納付が原則であるが、所定の要件を満たせば、分割して納付することも認められる。", "c": true, "r": "2014.1-52-4", "u": "https://fp2-siken.com/kakomon/2014_1/52.html"}], "m": "<b>物納が認められるのは相続税だけ</b>。贈与税に物納の制度はない（延納は最長5年まで可）。", "url": "https://fp2-siken.com/kakomon/2020_1/53.html", "ref": "2020.1-53-3"}, {"uid": "inheritance-34", "id": 34, "page": "inheritance", "bunya": "相続", "freq": 5, "a": "遺産に係る基礎控除額は、\n「<strong style='color: #0b63c5; background-color: #eaf4ff; padding: 0 3px; border-bottom: 2px solid #90caf9;'>3,000万円</strong>＋<strong style='color: #0b63c5; background-color: #eaf4ff; padding: 0 3px; border-bottom: 2px solid #90caf9;'>600万円</strong>×法定相続人の数」の算式によって計算される。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">相続税は、遺産が一定額を超えた場合に計算します。その非課税の土台となる基礎控除額は、<strong>3,000万円＋600万円×法定相続人の数</strong>で求めます。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">相続税は、すべての遺産にすぐかかるわけではありません。まず、相続人の人数に合わせた基礎控除を遺産から引きます。\n\n基礎控除を<strong>3,000万円＋600万円×法定相続人の数</strong>で出します。</div></div>", "ans": true, "k": "【適切】相続税の基礎控除額は「3,000万円＋600万円×法定相続人の数」で計算します。たとえば法定相続人が3人なら3,000万＋600万×3＝4,800万円。これ以下なら相続税はかかりません。2015年の改正で「5,000万＋1,000万×人数」から引き下げられた経緯もよく出題されます。<br><br>\n<div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\"><h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4><p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>相続税の基礎控除は、最低限の生活財産には課税しない趣旨で設けられています。現行式は<strong style='color: #0b63c5; background-color: #eaf4ff; padding: 0 3px; border-bottom: 2px solid #90caf9;'>3,000万円＋600万円×法定相続人の数</strong>です。</p><p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>2015年改正前の『5,000万円＋1,000万円×人数』を出してくる問題と混同しやすいので、現行式を正確に覚える必要があります。</p><p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>法定相続人が3人なら基礎控除は4,800万円です。実務ではこの金額を超えるかどうかで申告要否の見通しが大きく変わります。</p></div><div data-joushiki-copy=\"inheritance-34\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">遺族の生活を守る基本額に、相続人が増えるほど追加額を設ける考え方です。⚠️ <strong>暗記寄り</strong>：計算式の数字は暗記寄りです。</p></div>", "rel": [{"s": "遺産に係る基礎控除額は、「3,000万円＋600万円×法定相続人の数」の算式により計算した金額である。", "c": true, "r": "2025.5-55-1", "u": "https://fp2-siken.com/kakomon/2025_5/55.html"}, {"s": "死亡保険金の非課税限度額は、「500万円×法定相続人の数」の算式により計算した金額である。", "c": true, "r": "2018.9-56-3", "u": "https://fp2-siken.com/kakomon/2018_9/56.html"}, {"s": "遺産に係る基礎控除額は、「5,000万円＋1,000万円×法定相続人の数」の算式によって計算される。", "c": false, "r": "2016.9-56-1", "u": "https://fp2-siken.com/kakomon/2016_9/56.html"}, {"s": "遺産に係る基礎控除額は、「3,000万円＋600万円×法定相続人の数」の算式によって計算される。", "c": true, "r": "2015.9-58-1", "u": "https://fp2-siken.com/kakomon/2015_9/58.html"}], "m": "遺産に係る基礎控除 ＝ <b>3,000万円 ＋ 600万円 × 法定相続人の数</b>", "url": "https://fp2-siken.com/kakomon/2015_5/60.html", "ref": "2015.5-60-1"}];
const LIMIT = 10;
let idx=0, ok=0, t0=0, log=[], order=[], N=20;

// 学科ページと同じキー・同じ卒業判定を使う
function cnts(q){
  return {c:parseInt(localStorage.getItem("FP2v6"+q.page+"correct_"+q.id)||"0",10),
          i:parseInt(localStorage.getItem("FP2v6"+q.page+"incorrect_"+q.id)||"0",10)};
}
function bump(q,ok){
  const k="FP2v6"+q.page+(ok?"correct_":"incorrect_")+q.id;
  localStorage.setItem(k,String(parseInt(localStorage.getItem(k)||"0",10)+1));
}
function graduated(q){ const n=cnts(q); return n.c>=2; }
function weight(q){ const n=cnts(q); return Math.max(1,(n.i-n.c)+3); }
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}

function pick(n){
  const live = ITEMS.filter(q=>!graduated(q));
  if(!live.length) return [];
  // 間違いが多いものほど選ばれやすくする（学科ページと同じ重み付け）
  const pool=[];
  live.forEach(q=>{ const w=weight(q); for(let i=0;i<w;i++) pool.push(q); });
  const out=[], seen=new Set();
  const sh=shuffle(pool);
  for(const q of sh){ if(seen.has(q.uid)) continue; seen.add(q.uid); out.push(q); if(out.length>=n) break; }
  return out;
}

function setup(){
  const grad = ITEMS.filter(graduated).length;
  const live = ITEMS.length - grad;
  const st=document.getElementById("stage");
  document.getElementById("cnt").textContent="";
  document.getElementById("acc").textContent="";
  document.getElementById("avg").textContent="";
  document.getElementById("pbar").style.width = (grad/ITEMS.length*100)+"%";
  st.innerHTML =
    '<div class="setup"><h2>高速○×</h2>' +
    '<p>見た瞬間に○×が決まる肢だけを集めた<b>76問</b>。1肢10秒を目安に。<br>' +
    'Bのやさしい言い換えで判定してもかまいません。慣れたらAの本試験文だけで。</p>' +
    (live ? '<div class="row">1セットの問題数：<br>' +
      [10,20,30,50].map(n=>'<button class="cntbtn'+(n===N?" sel":"")+'" data-n="'+n+'">'+n+'問</button>').join("") +
      '<button class="cntbtn" data-n="999">全部</button></div>' +
      '<button class="go" id="go">はじめる</button>'
     : '<p style="color:#1b7a3d;font-size:15px;font-weight:bold">全問が卒業しました。おつかれさまでした。</p>') +
    '<div class="stat">卒業 <b>' + grad + '</b>問　／　残り <b>' + live + '</b>問　／　全' + ITEMS.length + '問<br>' +
    '<span style="font-size:11.5px">※2回正解すると卒業して出題されなくなります（学科ページと共通）</span></div>' +
    '<button class="rst" id="rst">この'+ITEMS.length+'問の学習履歴をリセット</button></div>';
  st.querySelectorAll(".cntbtn").forEach(b=>b.onclick=()=>{
    N=parseInt(b.dataset.n,10);
    st.querySelectorAll(".cntbtn").forEach(x=>x.classList.remove("sel"));
    b.classList.add("sel");
  });
  const go=document.getElementById("go");
  if(go) go.onclick=start;
  document.getElementById("rst").onclick=()=>{
    if(!confirm("この"+ITEMS.length+"問の正解・不正解の記録を消します。よろしいですか？")) return;
    ITEMS.forEach(q=>{
      localStorage.removeItem("FP2v6"+q.page+"correct_"+q.id);
      localStorage.removeItem("FP2v6"+q.page+"incorrect_"+q.id);
    });
    setup();
  };
}

function head(){
  document.getElementById("cnt").textContent=(idx+1)+" / "+order.length;
  document.getElementById("acc").textContent=idx?"正解 "+ok+"／"+idx:"";
  const el=document.getElementById("avg");
  if(log.length){
    const av=log.reduce((s,x)=>s+x.sec,0)/log.length;
    el.textContent="平均 "+av.toFixed(1)+"秒";
    el.className=av<=LIMIT?"sp ok":"sp slow";
  } else el.textContent="";
  document.getElementById("pbar").style.width=(idx/order.length*100)+"%";
}

let tick;
function render(){
  if(idx>=order.length) return finish();
  head();
  const q=order[idx], n=cnts(q);
  document.getElementById("stage").innerHTML =
    '<div class="card"><div class="fb"></div><div class="timer" id="tm">0.0秒</div>' +
      '<div class="tags"><span class="tag">'+q.bunya+'</span>' +
        '<span class="tag">頻出度'+q.freq+'</span>' +
        '<span class="tag g">正'+n.c+'／誤'+n.i+'　卒業まであと'+Math.max(0,2-(n.c-n.i))+'</span></div>' +
      '<span class="vlabel">Aパターン（本試験文）</span>' +
      '<div class="va">'+q.a+'</div>' +
      '<span class="vlabel">Bパターン（やさしい言い換え）</span>' +
      '<div class="vb">'+q.b+'</div>' +
    '</div>' +
    '<div class="ans"><button class="o" id="bo">○<small>正しい</small></button>' +
      '<button class="x" id="bx">×<small>誤り</small></button></div>' +
    '<div class="rev" id="rev"></div>' +
    '<div class="hint">← / F ＝○　　→ / J ＝×　　スペース or Enter ＝次へ</div>';
  t0=performance.now();
  clearInterval(tick);
  tick=setInterval(()=>{
    const s=(performance.now()-t0)/1000, tm=document.getElementById("tm");
    if(!tm) return;
    tm.textContent=s.toFixed(1)+"秒";
    tm.className="timer"+(s>LIMIT*1.5?" over":s>LIMIT?" warn":"");
  },100);
  document.getElementById("bo").onclick=()=>answer(true);
  document.getElementById("bx").onclick=()=>answer(false);
}

function relHtml(q){
  if(!q.rel||!q.rel.length) return "";
  let h='<div class="rel"><div class="rl">類似・関連問題 '+q.rel.length+'問</div>';
  q.rel.forEach(r=>{
    const mk=r.c?'<span class="maru">○</span>':'<span class="batu">×</span>';
    const lk=r.u?'<a href="'+r.u+'" target="_blank">('+r.r+')</a>':'('+r.r+')';
    h+='<div class="ri">'+r.s+' '+mk+' '+lk+'</div>';
  });
  return h+'</div>';
}

function answer(v){
  const q=order[idx];
  if(q._done) return;
  q._done=true;
  clearInterval(tick);
  const sec=(performance.now()-t0)/1000, good=(v===q.ans);
  if(good) ok++;
  log.push({q:q,sec:sec,good:good});
  bump(q,good);
  const card=document.querySelector(".card"), f=card.querySelector(".fb");
  f.textContent=good?"○":"×";
  f.style.color=good?"rgba(44,127,192,.16)":"rgba(209,26,42,.14)";
  f.classList.remove("show"); void f.offsetWidth; f.classList.add("show");
  document.querySelectorAll(".ans button").forEach(b=>b.disabled=true);
  const n2=cnts(q), rest=Math.max(0,2-n2.c);
  const rev=document.getElementById("rev");
  rev.className="rev on";
  rev.innerHTML =
    '<div class="jd '+(good?"ok":"ng")+'">'+(good?"正解":"不正解")+
      '　<span style="font-size:14px;color:#8fa0b0">正解は '+(q.ans?"○":"×")+'　／　'+sec.toFixed(1)+'秒'+
      (sec>LIMIT?'　<span class="slow">（10秒超）</span>':'')+
      (rest===0?'　<span style="color:#1b7a3d">卒業！</span>':'　卒業まであと'+rest)+'</span></div>' +
    '<div class="memo"><span class="mlabel">暗記メモ</span>'+q.m+'</div>' +
    '<div class="kai">'+q.k+'</div>' + relHtml(q) +
    '<button class="next" id="nx">次へ　（スペース）</button>' +
    (rest>0?'<button class="grad-btn" id="gbtn">この問題を卒業</button>':'');
  document.getElementById("nx").onclick=next;
  var gb=document.getElementById("gbtn");
  if(gb) gb.onclick=function(){
    for(var i=0;i<3;i++) bump(q,true);
    gb.disabled=true; gb.textContent="卒業済み";
  };
}

function next(){ idx++; render(); }

function finish(){
  clearInterval(tick);
  document.getElementById("pbar").style.width="100%";
  document.getElementById("cnt").textContent="終了";
  const tot=log.reduce((s,x)=>s+x.sec,0), av=tot/log.length;
  const fast=log.filter(x=>x.sec<=LIMIT).length;
  const newGrad=log.filter(x=>{const n=cnts(x.q);return n.c>=2;}).length;
  let rows="";
  log.forEach((x,i)=>{
    rows+='<tr><td>'+(i+1)+'. '+x.q.a.replace(/<[^>]+>/g,"").slice(0,28)+'…</td>'+
          '<td class="r '+(x.good?"ok":"ng")+'">'+(x.good?"○":"×")+'</td>'+
          '<td class="r '+(x.sec>LIMIT?"slow":"")+'">'+x.sec.toFixed(1)+'秒</td></tr>';
  });
  document.getElementById("stage").innerHTML=
    '<div class="done"><h2>おつかれさま</h2><div class="big">'+ok+" / "+log.length+'</div>'+
    '<div style="color:#8fa0b0;font-size:13px">正解率 '+Math.round(ok/log.length*100)+'％　／　平均 '+
      av.toFixed(1)+'秒　／　10秒以内 '+fast+'問　／　このセット後の卒業 '+newGrad+'問</div>'+
    '<table>'+rows+'</table>'+
    '<button class="go" id="ag" style="padding:13px 30px">続けて次のセット</button> '+
    '<button class="rst" id="bk" style="margin-left:8px">最初の画面へ</button></div>';
  document.getElementById("ag").onclick=start;
  document.getElementById("bk").onclick=setup;
}

function start(){
  order=pick(N).map(q=>Object.assign({},q,{_done:false}));
  if(!order.length){ setup(); return; }
  idx=0; ok=0; log=[];
  render();
}

document.addEventListener("keydown",e=>{
  const nx=document.getElementById("nx");
  if(e.key===" "||e.key==="Enter"){ if(nx){ e.preventDefault(); next(); } return; }
  if(document.getElementById("bo")&&!document.getElementById("bo").disabled){
    if(e.key==="ArrowLeft"||e.key.toLowerCase()==="f") answer(true);
    else if(e.key==="ArrowRight"||e.key.toLowerCase()==="j") answer(false);
  }
});

setup();
</script>
</body>
</html>
