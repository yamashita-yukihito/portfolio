bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>マイホームを売って利益が出たとき、利益から3,000万円を無税で差し引き、さらにそれを超えた部分の税率も安く（約14%に）してくれる最強のコンボです。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>「3,000万円特別控除」と「軽減税率の特例」は、要件（10年超所有など）を満たせば「<strong style='color: #0b63c5;'>重複して適用を受けることができる</strong>」のが最大のポイントです。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>ただし、これら「売った時の特例」を使うと、新しい家を買うときの「住宅ローン控除」は使えなくなるため、どちらが得かのシミュレーションがFPの腕の見せ所です。</p>\n</div><div data-joushiki-copy=\"estate-27\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">一方は利益の金額を減らし、もう一方は残った利益の税率を下げる制度です。役割が違うので、条件を満たせば併用できます。</p></div>", "rel": [{"s": "3,000万円特別控除と軽減税率の特例は、重複して適用を受けることができる。", "c": true, "r": "2023.1-49-4", "u": "https://fp2-siken.com/kakomon/2023_1/49.html"}, {"s": "3,000万円特別控除と軽減税率の特例は、重複して適用を受けることができる。", "c": true, "r": "2021.9-49-4", "u": "https://fp2-siken.com/kakomon/2021_9/49.html"}, {"s": "3,000万円特別控除と軽減税率の特例は、同一の居住用財産の譲渡について、重複して適用を受けることができない。", "c": false, "r": "2021.5-49-3", "u": "https://fp2-siken.com/kakomon/2021_5/49.html"}, {"s": "3,000万円特別控除と軽減税率の特例は、それぞれの適用要件を満たしている場合であっても、重ねて適用を受けることはできない。", "c": false, "r": "2021.3-48-4", "u": "https://fp2-siken.com/kakomon/2021_3/48.html"}, {"s": "3,000万円特別控除と軽減税率の特例は、重複して適用を受けることができない。", "c": false, "r": "2020.1-49-4", "u": "https://fp2-siken.com/kakomon/2020_1/49.html"}, {"s": "3,000万円特別控除と軽減税率の特例は、重複して適用を受けることができない。", "c": false, "r": "2018.9-49-4", "u": "https://fp2-siken.com/kakomon/2018_9/49.html"}, {"s": "3,000万円特別控除と軽減税率の特例は、それぞれの適用要件を満たしている場合であっても、重ねて適用を受けることはできない。", "c": false, "r": "2016.5-48-4", "u": "https://fp2-siken.com/kakomon/2016_5/48.html"}, {"s": "軽減税率の特例と3,000万円特別控除は、重複して適用を受けることはできない。", "c": false, "r": "2013.9-49-4", "u": "https://fp2-siken.com/kakomon/2013_9/49.html"}], "m": "3,000万円特別控除と軽減税率の特例は<b>併用できる</b>。※<b>住宅ローン控除とは併用不可</b>。", "url": "https://fp2-siken.com/kakomon/2024_5/48.html", "ref": "2024.5-48-4"}, {"uid": "inheritance-2", "id": 2, "page": "inheritance", "bunya": "相続", "freq": 9, "a": "親族の範囲は、<strong style='color: #d11a2a;'>3親等内の血族、配偶者、6親等内の姻族</strong>である。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">民法でいう親族には、血のつながりがある人、配偶者、結婚によって親族になった人が含まれます。その範囲は、<strong>3親等内の血族</strong>、配偶者、<strong>6親等内の姻族</strong>です。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">法律でいう「親族」は、普段なんとなく家族と呼ぶ範囲とは少し違い、何親等かで線が引かれています。血のつながり、配偶者、結婚でできた親族を分けて考えます。\n\n<strong>3親等内の血族</strong>、配偶者、<strong>6親等内の姻族</strong>が親族です。</div></div>", "ans": false, "k": "これは不適切。民法上の親族の範囲は、6親等内の血族、配偶者、3親等内の姻族とされています。\n\nこのテーマは関連問題を含めて<strong>9回</strong>まとまっている頻出論点。数字・年齢・期間・上限額などの条件整理が大事。<br><br>\n<div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>民法では、親族の範囲を明確に定義して、扶養義務や相続権などの基準としています。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>正しくは「<strong style='color: #d11a2a;'>6親等内の血族、配偶者、3親等内の姻族</strong>」です。6と3が逆になっているフェイクが鉄板です。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>いとこ（血族4親等）は親族になりますが、配偶者のいとこ（姻族4親等）は法律上の親族にはなりません。相続の手続きで家系図（相関図）を作るときにこの知識が必須になります。</p>\n</div><div data-joushiki-copy=\"inheritance-2\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">親族の範囲は日常の呼び方だけでは判断できません。⚠️ <strong>暗記寄り</strong>：正しくは<strong>6親等内の血族・配偶者・3親等内の姻族</strong>で、6と3は暗記寄りです。</p></div>", "rel": [{"s": "親族の範囲は、6親等内の血族、配偶者および3親等内の姻族である。", "c": true, "r": "2022.1-52-1", "u": "https://fp2-siken.com/kakomon/2022_1/52.html"}, {"s": "親族とは、6親等内の血族、配偶者および3親等内の姻族をいう。", "c": true, "r": "2021.3-51-1", "u": "https://fp2-siken.com/kakomon/2021_3/51.html"}, {"s": "親族の範囲は、6親等内の血族、配偶者および3親等内の姻族である。", "c": true, "r": "2018.9-51-1", "u": "https://fp2-siken.com/kakomon/2018_9/51.html"}, {"s": "民法上の親族とは6親等内の血族、配偶者および3親等内の姻族をいう。", "c": true, "r": "2017.9-51-1", "u": "https://fp2-siken.com/kakomon/2017_9/51.html"}, {"s": "親族の範囲は、6親等内の血族、配偶者、3親等内の姻族である。", "c": true, "r": "2017.5-52-1", "u": "https://fp2-siken.com/kakomon/2017_5/52.html"}, {"s": "親族とは、6親等内の血族、配偶者および4親等内の姻族をいう。", "c": false, "r": "2016.5-51-1", "u": "https://fp2-siken.com/kakomon/2016_5/51.html"}, {"s": "親族とは、6親等内の血族、配偶者および3親等内の姻族をいう。", "c": true, "r": "2016.1-52-1", "u": "https://fp2-siken.com/kakomon/2016_1/52.html"}, {"s": "親族とは、6親等内の血族、配偶者および3親等内の姻族をいう。", "c": true, "r": "2013.1-51-1", "u": "https://fp2-siken.com/kakomon/2013_1/51.html"}], "m": "親族＝<b>6親等内の血族</b>・配偶者・<b>3親等内の姻族</b>。血族が6・姻族が3——数字が逆になりやすい。", "url": "https://fp2-siken.com/kakomon/2024_5/51.html", "ref": "2024.5-51-1"}, {"uid": "inheritance-3", "id": 3, "page": "inheritance", "bunya": "相続", "freq": 9, "a": "贈与税の申告書の提出期間は、原則として、贈与を受けた年の翌年の<strong style='color: #d11a2a;'>2月16日から3月15日</strong>までである。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">贈与税は、財産をもらった人が翌年に申告します。申告書を出せる期間は、原則として翌年の<strong>2月16日から3月15日まで</strong>です。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">1年間に財産をもらって贈与税がかかる人は、翌年に申告します。申告の開始日と締切日が決められています。\n\n原則として翌年の<strong>2月16日から3月15日まで</strong>です。</div></div>", "ans": false, "k": "【不適切】贈与税の申告期間は翌年の2月1日から3月15日までです。この問題は「2月16日」と書いていますが、2月16日からなのは所得税の確定申告のほうです。超頻出のひっかけなので「贈与税は2/1スタート、所得税は2/16スタート」とセットで覚えましょう。どちらも締切は3月15日で同じです。<br><br>\n<div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>贈与税は、もらった年の翌年に、自分で税額を計算して税務署に申告・納付する制度です。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>贈与税の申告期間は「<strong style='color: #d11a2a;'>2月1日から3月15日まで</strong>」です。所得税の期間（2月16日から）と混同させるフェイク問題が頻出です。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>所得税よりも半月早く（2月1日から）申告書の受付がスタートするため、贈与税の申告は早めに済ませるのが実務の基本です。</p>\n</div><div data-joushiki-copy=\"inheritance-3\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">所得税の確定申告と締切が同じなので混同しやすい部分です。⚠️ <strong>暗記寄り</strong>：贈与税は<strong>2月1日から3月15日</strong>、所得税は原則2月16日からです。</p></div>", "rel": [{"s": "贈与税の申告書の提出期間は、原則として、贈与があった年の翌年2月16日から3月15日までである。", "c": false, "r": "2023.5-51-2", "u": "https://fp2-siken.com/kakomon/2023_5/51.html"}, {"s": "贈与税の申告書の提出期間は、原則として、贈与を受けた年の翌年2月16日から3月15日までである。", "c": false, "r": "2022.5-54-1", "u": "https://fp2-siken.com/kakomon/2022_5/54.html"}, {"s": "贈与税の申告書の提出は、原則として、贈与を受けた年の翌年の2月1日から3月15日までの間に行わなければならない。", "c": true, "r": "2021.3-53-2", "u": "https://fp2-siken.com/kakomon/2021_3/53.html"}, {"s": "贈与税の申告書の提出期間は、原則として、贈与を受けた年の翌年2月1日から3月15日までである。", "c": true, "r": "2020.1-53-1", "u": "https://fp2-siken.com/kakomon/2020_1/53.html"}, {"s": "贈与税の申告書の提出期間は、原則として、贈与を受けた年の翌年2月1日から3月15日までである。", "c": true, "r": "2018.5-53-1", "u": "https://fp2-siken.com/kakomon/2018_5/53.html"}, {"s": "贈与税の申告書の提出期間は、贈与を受けた年の翌年2月16日から3月15日までとなっており、所得税の確定申告書の提出期間と同じである。", "c": false, "r": "2018.1-53-2", "u": "https://fp2-siken.com/kakomon/2018_1/53.html"}, {"s": "贈与税の申告書の提出期間は、原則として、贈与を受けた年の翌年2月1日から3月15日である。", "c": true, "r": "2017.9-53-2", "u": "https://fp2-siken.com/kakomon/2017_9/53.html"}, {"s": "贈与税の申告書の提出期限は、贈与を受けた年の翌年2月16日から3月15日までとなっており、所得税の確定申告書の提出期間と同じである。", "c": false, "r": "2014.1-52-1", "u": "https://fp2-siken.com/kakomon/2014_1/52.html"}], "m": "贈与税の申告期間は翌年<b>2月1日〜3月15日</b>。<b>所得税は2月16日から</b>で開始日が違う。", "url": "https://fp2-siken.com/kakomon/2016_5/53.html", "ref": "2016.5-53-2"}, {"uid": "risk-12", "id": 12, "page": "risk", "bunya": "リスク", "freq": 8, "a": "逓減定期保険は、保険期間の経過に伴って所定の割合で保険料が逓減するが、<strong style='color: #d11a2a;'>保険金額は一定である</strong>。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">逓減定期保険は、契約から時間がたつにつれて内容が少しずつ減っていく定期保険です。減っていくのは<strong>保険料</strong>で、万一のときに受け取る<strong>保険金額は一定</strong>です。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">時間がたつにつれて、保障の内容が少しずつ変わる定期保険の話です。\n\n毎回払う<strong>保険料がだんだん減り</strong>、亡くなったときなどに受け取る<strong>保険金額は変わりません</strong>。</div></div>", "ans": false, "k": "これは不適切。逓減定期保険は、保険契約期間の経過に伴い保障額（保険金額）が徐々に減っていくタイプの保険です。保険金額は 減少 していきますが、支払保険料はあらかじめそれを織り込んだ形で設定されているため保険期間を通じて 一定 です。本肢は逆に説明しています。\n\nこのテーマは関連問題を含めて<strong>8回</strong>まとまっている頻出論点。要件・例外・できる／できないの区別が大事。<br><br>\n<div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>逓減（ていげん）定期保険は、子供が成長するにつれて必要になる教育費や生活費が減っていく（＝必要な死亡保障額が減っていく）ことに合わせた合理的な保険です。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>「<strong style='color: #d11a2a;'>保険料が逓減する</strong>」のではなく、「<strong style='color: #d11a2a;'>保険金額が逓減する</strong>」のが正解です。受け取れる死亡保険金が年々減っていく代わりに、毎月払う保険料はずっと「一定」で安く設定されています。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>若いお父さんが「今死んだら子供が独立するまでの生活費として3000万円必要だけど、10年後なら2000万円で足りる」というように、必要保障額のカーブに合わせてムダなく備えるためのベストな保険です。</p>\n</div><div data-joushiki-copy=\"risk-12\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">住宅ローン残高など、年々小さくなる必要保障額に合わせるのが逓減定期保険です。減るのは<strong>保険金額</strong>で、通常、保険料ではありません。</p></div>", "rel": [{"s": "逓減定期保険は、保険期間の経過に伴い所定の割合で保険料が逓減するが、保険金額は一定である。", "c": false, "r": "2025.1-12-4", "u": "https://fp2-siken.com/kakomon/2025_1/12.html"}, {"s": "逓減定期保険は、保険期間の経過に伴い所定の割合で保険料が逓減するが、保険金額は一定である。", "c": false, "r": "2023.1-13-1", "u": "https://fp2-siken.com/kakomon/2023_1/13.html"}, {"s": "逓減定期保険は、保険期間の経過に伴い所定の割合で保険料が逓減するが、保険金額は一定である。", "c": false, "r": "2021.9-12-3", "u": "https://fp2-siken.com/kakomon/2021_9/12.html"}, {"s": "逓減定期保険は、保険期間の経過に伴い所定の割合で保険料が逓減するが、保険金額は一定である。", "c": false, "r": "2019.5-12-1", "u": "https://fp2-siken.com/kakomon/2019_5/12.html"}, {"s": "逓減定期保険では、保険期間を通じて、期間の経過に伴い所定の割合で保険金額が逓減していくが、保険料は一定である。", "c": true, "r": "2017.5-12-2", "u": "https://fp2-siken.com/kakomon/2017_5/12.html"}, {"s": "逓増定期保険は、保険期間の経過に伴い保険金額が所定の割合で増加するが、保険料は保険期間を通じて一定である。", "c": true, "r": "2014.1-12-2", "u": "https://fp2-siken.com/kakomon/2014_1/12.html"}, {"s": "逓減定期保険は、保険期間の経過とともに支払保険料の金額が逓減する。", "c": false, "r": "2013.1-12-3", "u": "https://fp2-siken.com/kakomon/2013_1/12.html"}], "m": "逓減定期保険は<b>保険金額が逓減し、保険料は一定</b>。逆に覚えないこと。", "url": "https://fp2-siken.com/kakomon/2025_5/12.html", "ref": "2025.5-12-1"}, {"uid": "risk-15", "id": 15, "page": "risk", "bunya": "リスク", "freq": 8, "a": "普通傷害保険では、<strong style='color: #0b63c5;'>日本国外における業務中の事故</strong>によるケガは補償の対象となる。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">普通傷害保険は、急で偶然な外からの事故によるけがを補償する保険です。日本国外へ仕事で出かけ、<strong>業務中の事故</strong>でけがをした場合も補償されます。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">仕事で海外へ行き、現地で働いている最中に、思いがけない事故でけがをした場面です。\n\n普通傷害保険では、海外での<strong>仕事中のけがも補償されます</strong>。</div></div>", "ans": true, "k": "これは適切。普通傷害保険は、国内外を問わず、家庭内、職場内、旅行中など日常生活で起こる事故による傷害に対して補償されるため、日本国外における業務中の事故によるケガも対象になります。\n\nこのテーマは関連問題を含めて<strong>8回</strong>まとまっている頻出論点。要件・例外・できる／できないの区別が大事。<br><br>\n<div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>普通傷害保険は、日常生活から仕事中、スポーツ中まで、国内外を問わず「急激・偶然・外来」の事故によるケガを補償するオールマイティな保険です。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>「<strong style='color: #0b63c5;'>日本国外における業務中の事故によるケガ</strong>」も補償の対象となります。対象外とするフェイクに注意です。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>海外出張中に交通事故に遭ってケガをした場合、この普通傷害保険から治療費や入院の保険金が下ります（※病気は対象外です）。</p>\n</div><div data-joushiki-copy=\"risk-15\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">普通傷害保険は、基本的に国内外や仕事中・日常生活中を問わず、事故によるけがを広く対象にします。旅行中だけの保険とは違います。</p></div>", "rel": [{"s": "交通事故傷害保険では、海外旅行中の交通事故によるケガは補償の対象となる。", "c": true, "r": "2020.1-16-3", "u": "https://fp2-siken.com/kakomon/2020_1/16.html"}, {"s": "普通傷害保険では、日本国外における業務中の事故によるケガも補償の対象となる。", "c": true, "r": "2019.9-16-3", "u": "https://fp2-siken.com/kakomon/2019_9/16.html"}, {"s": "普通傷害保険では、国内における事故等による損害を補償の対象としており、海外旅行中の事故等による損害は補償の対象とならない。", "c": false, "r": "2019.1-17-3", "u": "https://fp2-siken.com/kakomon/2019_1/17.html"}, {"s": "普通傷害保険では、海外旅行中の事故によるケガは補償の対象とならない。", "c": false, "r": "2017.5-18-2", "u": "https://fp2-siken.com/kakomon/2017_5/18.html"}, {"s": "普通傷害保険は、日本国外における就業中の事故によるケガも補償の対象となる。", "c": true, "r": "2017.1-17-3", "u": "https://fp2-siken.com/kakomon/2017_1/17.html"}, {"s": "普通傷害保険では、就業中に発生した事故によるケガは補償の対象となる。", "c": true, "r": "2016.9-17-3", "u": "https://fp2-siken.com/kakomon/2016_9/17.html"}, {"s": "普通傷害保険では、日本国外で発生した事故による傷害は補償の対象とならない。", "c": false, "r": "2014.5-16-1", "u": "https://fp2-siken.com/kakomon/2014_5/16.html"}], "m": "普通傷害保険は<b>国内外を問わず、業務中・業務外を問わず</b>補償（急激・偶然・外来の事故）。", "url": "https://fp2-siken.com/kakomon/2022_1/17.html", "ref": "2022.1-17-3"}, {"uid": "finance-6", "id": 6, "page": "finance", "bunya": "金融", "freq": 8, "a": "日本国内に本店のある銀行で購入した投資信託は、<strong style='color: #d11a2a;'>日本投資者保護基金</strong>による保護の対象となる。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">国内の銀行で投資信託を買った場合でも、銀行が破綻して顧客資産を返せなくなれば、<strong>日本投資者保護基金が補償する</strong>という意味です。投資信託をどこで買ったかにかかわらず、この基金で守られるとしています。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">銀行の窓口で投資信託を買い、その銀行が倒れて顧客のお金を返せなくなりました。\n\n投資信託は、どこで買ったかにかかわらず、<strong>日本投資者保護基金が補償します</strong>。</div></div>", "ans": false, "k": "これは<strong>不適切</strong>です。<br>日本投資者保護基金の会員は「証券会社」のみです。そのため、<strong>銀行などの証券会社以外の金融機関</strong>で購入した投資信託は、保護基金の対象外となります。<br>ただし、銀行で買った投資信託も、信託銀行で分別管理されているため、銀行が破綻しても資産そのものは守られます。<br><br>\n<div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>投資者保護基金は証券業の健全な発展のために証券会社が拠出して作った仕組みであるため、銀行経由の販売分はカバーされません。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>「銀行で購入した投資信託は預金保険制度の対象である」というひっかけも多いですが、投資信託は預金ではないため両方の制度で対象外です。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>「倒産が怖いから証券会社より銀行で買う」という顧客に対し、保護基金の有無という観点からはむしろ証券会社の方が手厚いことをアドバイスできます。</p>\n</div><div data-joushiki-copy=\"finance-6\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">日本投資者保護基金は証券会社の顧客を守る制度で、銀行は基金の会員ではありません。銀行で買った投資信託は分別管理されますが、<strong>基金の補償対象ではありません</strong>。</p></div>", "rel": [{"s": "銀行で購入した投資信託は、日本投資者保護基金による保護の対象となる。", "c": false, "r": "2023.1-29-4", "u": "https://fp2-siken.com/kakomon/2023_1/29.html"}, {"s": "国内に本店のある銀行で購入した投資信託は、日本投資者保護基金による補償の対象となる。", "c": false, "r": "2022.9-30-4", "u": "https://fp2-siken.com/kakomon/2022_9/30.html"}, {"s": "国内に本店のある銀行で購入した投資信託は、日本投資者保護基金による補償の対象とならず、預金保険制度による保護の対象となる。", "c": false, "r": "2021.3-30-4", "u": "https://fp2-siken.com/kakomon/2021_3/30.html"}, {"s": "国内銀行で購入した投資信託は、投資者保護基金による保護の対象となる。", "c": false, "r": "2016.5-30-3", "u": "https://fp2-siken.com/kakomon/2016_5/30.html"}, {"s": "国内銀行で購入した投資信託は、原則として、日本投資者保護基金による補償の対象である。", "c": false, "r": "2015.10-29-3", "u": "https://fp2-siken.com/kakomon/2015_10/29.html"}, {"s": "国内銀行で購入した投資信託は、投資者保護基金による保護の対象とならず、預金保険制度による保護の対象となる。", "c": false, "r": "2015.5-29-3", "u": "https://fp2-siken.com/kakomon/2015_5/29.html"}, {"s": "国内銀行で購入した投資信託は、投資者保護基金による補償の対象外である。", "c": true, "r": "2015.1-30-3", "u": "https://fp2-siken.com/kakomon/2015_1/30.html"}], "m": "銀行で買った投資信託は<b>投資者保護基金の対象外</b>。同基金は<b>証券会社</b>が破綻した場合の制度。（銀行の投信は分別管理で保護される）", "url": "https://fp2-siken.com/kakomon/2025_1/30.html", "ref": "2025.1-30-4"}, {"uid": "estate-31", "id": 31, "page": "estate", "bunya": "不動産", "freq": 8, "a": "普通借地権の設定契約において、その存続期間は50年を超えることができない。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">普通借地権は、建物を持つために土地を借りる一般的な権利です。その契約期間には上限があり、<strong>50年を超える期間</strong>にはできません。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">普通借地権は、人の土地を借りて建物を持つための権利です。契約期間を50年より長く決めようとしています。\n\n契約期間には上限があり、<strong>50年を超える期間にはできません</strong>。</div></div>", "ans": false, "k": "これは不適切。普通借地権の存続期間は 30 年以上とされています。上限はないので50年を超える契約も可能です。\n\nこのテーマは関連問題を含めて<strong>8回</strong>まとまっている頻出論点。数字・年齢・期間・上限額などの条件整理が大事。<br><br>\n<div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>土地を借りて家を建てる普通借地権は、借り手が不当に短い期間で追い出されるのを防ぐため、最低でも30年以上とするルールがあります。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>普通借地権の存続期間は「50年を超えることができます」。上限は「<strong style='color: #d11a2a;'>ありません</strong>」。旧法では上限がありましたが、現在の法律では上限が撤廃されました。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>「一般定期借地権」の場合は、50年以上で期間を設定します（更新なし）。普通借地権と定期借地権の数字が混同しやすいので注意してください。</p>\n</div><div data-joushiki-copy=\"estate-31\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">普通借地権は借りる人を長く守る制度なので、長い契約を禁止する理由は弱いです。最低30年という下限はありますが、上限はありません。⚠️ <strong>暗記寄り</strong>：最低<strong>30年</strong>は暗記寄りです。</p></div>", "rel": [{"s": "普通借地権の設定契約において、期間の定めがないときは、存続期間は30年とされる。", "c": true, "r": "2024.9-43-1", "u": "https://fp2-siken.com/kakomon/2024_9/43.html"}, {"s": "普通借地権の設定契約において、期間の定めがないときは、存続期間は30年とされる。", "c": true, "r": "2023.9-44-1", "u": "https://fp2-siken.com/kakomon/2023_9/44.html"}, {"s": "普通借地権の設定契約において、その存続期間は50年を超えることができない。", "c": false, "r": "2023.1-44-1", "u": "https://fp2-siken.com/kakomon/2023_1/44.html"}, {"s": "普通借家契約において、賃貸借の存続期間は50年を超えてはならない。", "c": false, "r": "2021.5-43-1", "u": "https://fp2-siken.com/kakomon/2021_5/43.html"}, {"s": "普通借地権の設定契約において、期間の定めがない場合には、存続期間は50年となる。", "c": false, "r": "2020.9-44-1", "u": "https://fp2-siken.com/kakomon/2020_9/44.html"}, {"s": "普通借地権の設定契約において、期間の定めがない場合には、存続期間は30年となる。", "c": true, "r": "2019.9-44-1", "u": "https://fp2-siken.com/kakomon/2019_9/44.html"}, {"s": "普通借地権の設定契約では、当該契約により30年を超える存続期間を定めることができる。", "c": true, "r": "2017.9-43-1", "u": "https://fp2-siken.com/kakomon/2017_9/43.html"}], "m": "普通借地権の存続期間は<b>30年以上で上限なし</b>。50年を超える契約も有効（民法604条の50年上限は適用されない）。", "url": "https://fp2-siken.com/kakomon/2025_5/43.html", "ref": "2025.5-43-1"}, {"uid": "estate-32", "id": 32, "page": "estate", "bunya": "不動産", "freq": 8, "a": "建築物の敷地は、原則として、建築基準法に規定する道路に2ｍ以上接していなければならない。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">家などを建てる敷地は、消防車の進入や避難ができるよう道路につながっている必要があります。原則として、建築基準法上の道路に<strong>2m以上接して</strong>いなければなりません。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">家を建てる土地には、建築基準法で認められた道路へ出られる場所が必要です。災害のときに逃げたり、消防車が近づいたりできるようにするためです。\n\n原則として、建築基準法で認められた道路に<strong>2m以上</strong>接していなければなりません。</div></div>", "ans": true, "k": "これは適切。都市計画区域および準都市計画区域内の建築物の敷地は、原則として建築基準法の道路（幅員 4 ｍ以上）に 2 ｍ以上接していなければなりません。この規制を「接道義務」といいます。\n\nこのテーマは関連問題を含めて<strong>8回</strong>まとまっている頻出論点。数字・年齢・期間・上限額などの条件整理が大事。<br><br>\n<div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>家を建てる土地は、前の道路（原則幅4m以上）に「2m以上」接していなければならないという接道義務のルールです。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>この「<strong style='color: #0b63c5;'>2m以上接道</strong>」を満たしていないと家が建てられません。これを満たすために、旗竿地（はたざおち）などが作られます。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>親の土地を分割して相続する際、奥の土地が道路に2m接していないと「再建築不可物件（家が建てられない土地）」になってしまい、価値が激減します。</p>\n</div><div data-joushiki-copy=\"estate-32\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">道路へほとんど出られない土地では、避難や消防活動に支障が出ます。⚠️ <strong>暗記寄り</strong>：接する長さが<strong>2m以上</strong>という数字は暗記寄りです。</p></div>", "rel": [{"s": "建築物の敷地は、原則として、建築基準法に規定する道路に2ｍ以上接していなければならない。", "c": true, "r": "2022.5-45-1", "u": "https://fp2-siken.com/kakomon/2022_5/45.html"}, {"s": "建築物の敷地は、原則として、建築基準法に規定する道路に2ｍ以上接していなければならない。", "c": true, "r": "2021.9-46-2", "u": "https://fp2-siken.com/kakomon/2021_9/46.html"}, {"s": "建築物の敷地は、原則として、建築基準法に規定する道路に2ｍ以上接していなければならない。", "c": true, "r": "2021.1-46-1", "u": "https://fp2-siken.com/kakomon/2021_1/46.html"}, {"s": "建築物の敷地は、原則として、建築基準法に規定する道路に、2m以上接していなければならない。", "c": true, "r": "2018.5-46-1", "u": "https://fp2-siken.com/kakomon/2018_5/46.html"}, {"s": "建築物の敷地は、原則として、建築基準法上の道路に2ｍ以上接していなければならない。", "c": true, "r": "2017.9-45-1", "u": "https://fp2-siken.com/kakomon/2017_9/45.html"}, {"s": "建築物の敷地は、原則として、建築基準法に定める道路に2ｍ以上接していなければならない。", "c": true, "r": "2015.9-45-1", "u": "https://fp2-siken.com/kakomon/2015_9/45.html"}, {"s": "建築物の敷地は、原則として、建築基準法に規定する道路に2ｍ以上接していなければならない。", "c": true, "r": "2013.5-45-3", "u": "https://fp2-siken.com/kakomon/2013_5/45.html"}], "m": "接道義務＝建築物の敷地は幅員4m以上の道路に<b>2m以上</b>接すること。", "url": "https://fp2-siken.com/kakomon/2023_1/46.html", "ref": "2023.1-46-4"}, {"uid": "inheritance-5", "id": 5, "page": "inheritance", "bunya": "相続", "freq": 8, "a": "養子（特別養子ではない）の相続分は、実子の相続分の<strong style='color: #d11a2a;'>2分の1</strong>である。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">普通養子縁組をした子も、法律上は養親の子になります。ただし、相続で受け取れる割合は、養親の実子が受け取る割合の<strong>2分の1</strong>です。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">養子縁組をした子は、法律上、養親の子になります。養親が亡くなり、実の子と養子が一緒に相続します。\n\n普通養子が受け取る割合は、実子の<strong>2分の1</strong>です。</div></div>", "ans": false, "k": "【不適切】養子は養子縁組の日から養親の法律上の子となり、法定相続分は実子とまったく同じです。「養子だから半分」という差別はありません。これは民法の基本原則で、養子縁組した以上は完全に「子」として扱われます。試験では「養子の相続分は実子の1/2」というひっかけが定番です。<br><br>\n<div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>養子縁組をした子は、法律上は実子と全く同じ扱い（嫡出子）となり、相続分に違いはありません。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>普通養子の相続分は「実子と同じ」です。「<strong style='color: #d11a2a;'>2分の1である</strong>」というのは、非嫡出子（婚外子）の昔のルールや、半血兄弟のルールと混同させたフェイクです。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>親の遺産を分けるとき、長男（実子）も次男（養子）も平等に同じ割合で遺産をもらう権利があります。</p>\n</div><div data-joushiki-copy=\"inheritance-5\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">法律上の子として迎えたのに、養子という理由だけで取り分を半分にするのは不自然です。普通養子も実子と<strong>同じ法定相続分</strong>です。⚠️ <strong>暗記寄り</strong>：ほかの2分の1ルールとの区別は暗記寄りです。</p></div>", "rel": [{"s": "養子の法定相続分は、実子の法定相続分と同じである。", "c": true, "r": "2025.5-53-1", "u": "https://fp2-siken.com/kakomon/2025_5/53.html"}, {"s": "養子の法定相続分は、実子の法定相続分と同じである。", "c": true, "r": "2025.1-54-4", "u": "https://fp2-siken.com/kakomon/2025_1/54.html"}, {"s": "養子の法定相続分は、実子の法定相続分の2分の1である。", "c": false, "r": "2023.9-55-4", "u": "https://fp2-siken.com/kakomon/2023_9/55.html"}, {"s": "養子の法定相続分は、実子の法定相続分の2分の1である。", "c": false, "r": "2023.1-54-1", "u": "https://fp2-siken.com/kakomon/2023_1/54.html"}, {"s": "養子の法定相続分は、実子の法定相続分の2分の1である。", "c": false, "r": "2021.5-53-4", "u": "https://fp2-siken.com/kakomon/2021_5/53.html"}, {"s": "養子（特別養子ではない）の法定相続分は、実子の法定相続分の2分の1となる。", "c": false, "r": "2014.9-53-1", "u": "https://fp2-siken.com/kakomon/2014_9/53.html"}, {"s": "養子の法定相続分は、実子の法定相続分の2分の1である。", "c": false, "r": "2013.9-54-2", "u": "https://fp2-siken.com/kakomon/2013_9/54.html"}], "m": "養子（普通養子）の相続分は<b>実子とまったく同じ</b>。2分の1ではない。", "url": "https://fp2-siken.com/kakomon/2019_1/55.html", "ref": "2019.1-55-1"}, {"uid": "inheritance-7", "id": 7, "page": "inheritance", "bunya": "相続", "freq": 8, "a": "被相続人は、遺言で、相続開始の時から<strong style='color: #0b63c5;'>5年を超えない期間</strong>を定めて、遺産の分割を禁ずることができる。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">遺言を残す人は、亡くなってすぐ遺産を分けないよう指定できます。相続が始まってから<strong>5年以内</strong>の期間なら、遺言で遺産分割を禁止できます。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">遺言を残す人が、「亡くなっても、しばらく遺産を分けないでほしい」と決めることがあります。ずっと禁止するのではなく、期間には上限があります。\n\n相続が始まってから<strong>5年以内</strong>なら、遺言で遺産分割を禁止できます。</div></div>", "ans": true, "k": "【適切】被相続人は遺言によって、相続開始時から最長5年間、遺産の分割を禁止することができます。「5年」という数字を暗記しましょう。なぜ5年かというと、一定期間は遺族の感情的な整理や事業の安定を図る趣旨ですが、あまり長すぎると相続人の権利を害するため、5年が上限です。<br><br>\n<div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>遺産分割ですぐに揉めるのが目に見えている場合や、相続人の一人が未成年で数年後に成人する場合などに、遺産の分割を一時的にストップできる制度です。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>遺言によって「<strong style='color: #0b63c5;'>5年を超えない期間</strong>」で分割を禁止することができます。「禁止できない」や「3年以内」とするフェイクに注意です。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>「長男が大学を卒業するまでのあと3年間は、遺産の分割をしてはならない」といった遺言を残すことで、家族の生活基盤が急に壊れるのを防げます。</p>\n</div><div data-joushiki-copy=\"inheritance-7\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">家業の安定などのため一時的に待たせる必要はありますが、いつまでも相続人を縛るのは困ります。⚠️ <strong>暗記寄り</strong>：上限<strong>5年</strong>は暗記寄りです。</p></div>", "rel": [{"s": "被相続人は、遺言で、相続開始の時から5年を超えない期間を定めて、遺産の分割を禁ずることができる。", "c": true, "r": "2024.9-55-1", "u": "https://fp2-siken.com/kakomon/2024_9/55.html"}, {"s": "被相続人は、遺言によって、相続開始の時から5年を超えない期間を定めて、遺産の分割を禁ずることができる。", "c": true, "r": "2023.1-55-4", "u": "https://fp2-siken.com/kakomon/2023_1/55.html"}, {"s": "被相続人は、遺言で、相続開始の時から1年間に限り、遺産の分割を禁ずることができる。", "c": false, "r": "2022.9-53-3", "u": "https://fp2-siken.com/kakomon/2022_9/53.html"}, {"s": "被相続人は、遺言によって、相続開始の時から10年間、遺産の分割を禁ずることができる。", "c": false, "r": "2020.1-56-4", "u": "https://fp2-siken.com/kakomon/2020_1/56.html"}, {"s": "被相続人は、遺言によって、相続開始の時から5年を超えない期間を定めて、遺産の分割を禁ずることができる。", "c": true, "r": "2019.5-54-1", "u": "https://fp2-siken.com/kakomon/2019_5/54.html"}, {"s": "被相続人は、遺言によって、相続開始の時から10年間、遺産の分割を禁ずることができる。", "c": false, "r": "2017.9-54-1", "u": "https://fp2-siken.com/kakomon/2017_9/54.html"}, {"s": "被相続人は、遺言により、相続開始の時から5年を超えない期間を定めて、遺産の分割を禁ずることができる。", "c": true, "r": "2016.1-55-1", "u": "https://fp2-siken.com/kakomon/2016_1/55.html"}], "m": "遺言による遺産分割の禁止は<b>相続開始から5年以内</b>。", "url": "https://fp2-siken.com/kakomon/2015_10/54.html", "ref": "2015.10-54-1"}, {"uid": "life2-6", "id": 6, "page": "life2", "bunya": "ライフ", "freq": 7, "a": "労災指定病院で療養補償給付として受ける療養の給付については、労働者の<strong style='color: #0b63c5;'>一部負担金はない</strong>。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">仕事中のけがや病気を労災指定病院で治療すると、労災保険から治療そのものが提供されます。この「療養の給付」では、労働者が窓口で支払う<strong>自己負担はありません</strong>。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">仕事が原因でけがをして、労災の指定病院で治療を受ける場面です。\n\n労災保険から治療を受ける形になるため、病院の窓口で本人が払う<strong>自己負担はありません</strong>。</div></div>", "ans": true, "k": "適切。労災指定病院で療養補償給付として療養の給付を受ける場合、労働者の一部負担金はありません。\n健康保険のような自己負担はなく、原則として現物給付で治療を受けます。\n『労災指定病院なら自己負担なし』はそのまま覚えてよい基本事項です。<br><br>\n<div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\"><h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4><p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>業務災害・通勤災害については、仕事に起因する事故である以上、被災労働者に自己負担を求めないという考え方が労災保険の基本です。治療費は保険から直接賄われます。</p><p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>『健康保険と同じで一部負担金がある』とする誤りが定番です。<strong style='color: #0b63c5;'>労災指定病院なら自己負担なし</strong>、指定外ではいったん立替えて後で請求という流れまで押さえると強いです。</p><p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>労災事故直後は、どの保険証を出すかで現場が混乱しがちです。実務では、業務災害なら健康保険ではなく労災手続で進めることを早めに案内する必要があります。</p></div><div data-joushiki-copy=\"life2-6\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">仕事が原因の負傷を、被災した本人に健康保険のような自己負担で治させるのは不公平です。業務災害の必要な治療費は労災保険が負担します。</p></div>", "rel": [{"s": "労働者が業務上の負傷または疾病により、労災指定病院で療養補償給付として受ける療養の給付については、労働者の一部負担金はない。", "c": true, "r": "2022.5-3-3", "u": "https://fp2-siken.com/kakomon/2022_5/03.html"}, {"s": "労災指定病院で療養補償給付として受ける療養の給付については、労働者の一部負担金はない。", "c": true, "r": "2017.1-4-2", "u": "https://fp2-siken.com/kakomon/2017_1/04.html"}, {"s": "労働者が業務上の負傷または疾病により、労災指定病院で療養補償給付として受ける療養の給付については、労働者の一部負担金はない。", "c": true, "r": "2016.1-3-2", "u": "https://fp2-siken.com/kakomon/2016_1/03.html"}, {"s": "労働者が業務上の負傷または疾病により、労災指定病院で療養補償給付として受ける療養の給付については、労働者の一部負担金はない。", "c": true, "r": "2014.9-5-2", "u": "https://fp2-siken.com/kakomon/2014_9/05.html"}, {"s": "労働者の業務上の負傷または疾病により、労災指定病院で療養補償給付として受ける療養の給付については、労働者の一部負担金はない。", "c": true, "r": "2014.1-4-4", "u": "https://fp2-siken.com/kakomon/2014_1/04.html"}, {"s": "労働者が労災病院で療養補償給付として療養の給付を受けた場合、当該療養の給付に係る労働者の一部負担金はない。", "c": true, "r": "2013.5-4-3", "u": "https://fp2-siken.com/kakomon/2013_5/04.html"}], "m": "労災の療養補償給付（労災指定病院）は<b>自己負担なし</b>。", "url": "https://fp2-siken.com/kakomon/2023_1/04.html", "ref": "2023.1-4-1"}, {"uid": "risk-23", "id": 23, "page": "risk", "bunya": "リスク", "freq": 7, "a": "<strong style=\"color: #0b63c5; background-color: #eaf4ff; padding: 0 4px; border-radius: 4px;\">家族傷害保険</strong>では、保険期間中に出生した記名被保険者本人の子は被保険者となる。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">家族傷害保険は、本人だけでなく、契約で定める家族のけがも補償します。保険期間の途中で、記名被保険者本人に<strong>子どもが生まれた</strong>場合、その子も被保険者になります。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">本人と家族のけがに備える保険へ入っている間に、赤ちゃんが生まれた場面です。\n\n新しく生まれた<strong>子どもも、家族として保険の対象に加わります</strong>。</div></div>", "ans": true, "k": "適切。\n家族傷害保険の被保険者の範囲は、<strong>契約時ではなく事故発生時</strong>の関係で判定されます。\nそのため、保険期間中に生まれた子は追加手続きや追加保険料なしで<strong>自動的に被保険者</strong>になります。\n「事故時判定」がポイント！離婚した配偶者は逆に対象外になるので注意。<br><br>\n<div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>家族傷害保険は、一つの保険で「本人・配偶者・同居の親族・別居の未婚の子」という家族全員のケガをカバーできる便利な保険です。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>保険期間中（契約した後）に生まれた本人の子供や、新しく結婚した配偶者なども、手続きなしで「<strong style='color: #0b63c5;'>自動的に被保険者（補償対象）となります</strong>」。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>新しく赤ちゃんが生まれたからといって、わざわざ保険会社に「被保険者の追加手続き」をしなくても、家族として自動的にケガの補償対象に含まれます。</p>\n</div><div data-joushiki-copy=\"risk-23\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">家族構成は契約期間中にも変わります。新しく生まれた子だけ無保険になるより、家族の範囲に自動的に加わる仕組みが自然です。</p></div>", "rel": [{"s": "家族傷害保険では、保険期間中に誕生した契約者（＝被保険者本人）の子は被保険者となる。", "c": true, "r": "2024.1-17-2", "u": "https://fp2-siken.com/kakomon/2024_1/17.html"}, {"s": "家族傷害保険（家族型）では、保険期間中に誕生した記名被保険者本人の子は被保険者とはならない。", "c": false, "r": "2022.1-17-4", "u": "https://fp2-siken.com/kakomon/2022_1/17.html"}, {"s": "家族傷害保険では、保険期間中に生まれた記名被保険者本人の子は、被保険者とならない。", "c": false, "r": "2021.1-16-3", "u": "https://fp2-siken.com/kakomon/2021_1/16.html"}, {"s": "家族傷害保険（家族型）において、保険期間中に誕生した記名被保険者本人の子は被保険者とはならない。", "c": false, "r": "2019.1-17-2", "u": "https://fp2-siken.com/kakomon/2019_1/17.html"}, {"s": "家族傷害保険では、保険契約締結後に誕生した記名被保険者本人の子も、被保険者となる。", "c": true, "r": "2017.9-18-3", "u": "https://fp2-siken.com/kakomon/2017_9/18.html"}, {"s": "家族傷害保険は、保険期間中に生まれた被保険者（契約者本人）の子のケガも、保険金支払いの対象となる。", "c": true, "r": "2013.9-17-2", "u": "https://fp2-siken.com/kakomon/2013_9/17.html"}], "m": "家族傷害保険では<b>保険期間中に生まれた子も自動的に被保険者</b>になる。", "url": "https://fp2-siken.com/kakomon/2016_1/16.html", "ref": "2016.1-16-1"}, {"uid": "risk-26", "id": 26, "page": "risk", "bunya": "リスク", "freq": 7, "a": "地震保険料控除の控除限度額は、所得税では<strong style='color: #0b63c5;'>5万円</strong>、住民税では2万5,000円である。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">支払った地震保険料は、所得税と住民税を計算するときに所得から差し引けます。控除できる上限は、所得税で<strong>5万円</strong>、住民税で<strong>2万5,000円</strong>です。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">自宅などに地震保険を付けて保険料を払うと、税金を計算するときに所得から差し引けます。\n\n差し引ける上限は、所得税が<strong>5万円</strong>、住民税が<strong>2万5,000円</strong>です。</div></div>", "ans": true, "k": "適切。\n地震保険料控除の限度額は、所得税<strong>5万円</strong>、住民税<strong>2万5,000円</strong>です。\n所得税では支払った保険料の全額（上限5万円）、住民税では支払った保険料の<strong>2分の1</strong>（上限2万5,000円）が控除されます。\n数字のセット「5万・2.5万」をしっかり暗記しよう！<br><br>\n<div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>地震保険料控除は、支払った地震保険料の額に応じて税金（所得税と住民税）が安くなる制度です。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>控除限度額は「<strong style='color: #0b63c5;'>所得税では5万円、住民税では2万5,000円</strong>」です。この上限額の数字がそのまま試験に出ます。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>地震保険料は居住地域と建物の構造によって決まりますが、年間5万円以上の保険料を払えば、所得税の計算上5万円丸ごとが控除され、節税につながります。</p>\n</div><div data-joushiki-copy=\"risk-26\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">国が地震への備えを後押しするための税優遇ですが、控除には上限があります。⚠️ 所得税5万円・住民税2万5,000円という金額は<strong>暗記寄り</strong>です。</p></div>", "rel": [{"s": "地震保険料控除の控除限度額は、所得税では5万円、住民税では2万5,000円である。", "c": true, "r": "2021.3-17-3", "u": "https://fp2-siken.com/kakomon/2021_3/17.html"}, {"s": "地震保険料控除の控除限度額は、所得税では50,000円、住民税では25,000円である。", "c": true, "r": "2019.9-17-4", "u": "https://fp2-siken.com/kakomon/2019_9/17.html"}, {"s": "地震保険料控除の控除限度額は、所得税では40,000円、住民税では25,000円である。", "c": false, "r": "2017.9-19-3", "u": "https://fp2-siken.com/kakomon/2017_9/19.html"}, {"s": "地震保険料控除の年間の控除限度額は、所得税では5万円、住民税では2万5,000円である。", "c": true, "r": "2016.5-17-3", "u": "https://fp2-siken.com/kakomon/2016_5/17.html"}, {"s": "地震保険料控除の控除限度額は、所得税では5万円、住民税では3万円である。", "c": false, "r": "2015.9-17-3", "u": "https://fp2-siken.com/kakomon/2015_9/17.html"}, {"s": "地震保険料控除の控除限度額は、所得税および住民税のいずれも5万円である。", "c": false, "r": "2014.9-18-2", "u": "https://fp2-siken.com/kakomon/2014_9/18.html"}], "m": "地震保険料控除は<b>所得税＝全額（最高5万円）</b>／<b>住民税＝1/2（最高2万5,000円）</b>。", "url": "https://fp2-siken.com/kakomon/2015_1/17.html", "ref": "2015.1-17-3"}, {"uid": "risk2-13", "id": 13, "page": "risk2", "bunya": "リスク", "freq": 7, "a": "変額<strong style=\"color: #0b63c5; background-color: #eaf4ff; padding: 0 4px; border-radius: 4px;\">個人年金保険</strong>では、特別勘定における運用実績によって、将来受け取る年金額や<strong style=\"color: #0b63c5; background-color: #eaf4ff; padding: 0 4px; border-radius: 4px;\">解約返戻金</strong>額が変動する。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">変額個人年金保険は、保険料の一部を株式や債券などで運用する年金保険です。特別勘定での運用結果によって、将来の<strong>年金額や解約返戻金</strong>が増えたり減ったりします。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">払った保険料の一部を、株や債券などで運用する個人年金へ入った場面です。\n\n運用がうまくいくかどうかで、将来の<strong>年金額や、途中で解約したときに戻るお金</strong>が増えたり減ったりします。</div></div>", "ans": true, "k": "これは適切。変額個人年金保険は、特別勘定に入れた保険料を株式や債券で運用し、その運用成果によって将来受け取ることのできる年金額や解約返戻金の額が変動する保険商品です。<br><br>このテーマは関連問題を含めて<strong>7回</strong>まとまっている頻出論点。要件・例外・できる／できないの区別が大事。<br><br>\n<div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>変額個人年金保険は、保険料の一部を株式や投資信託などで運用（特別勘定）し、その運用リスクを契約者が自己責任で負う商品だからです。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>「運用実績に関わらず年金額が保証される」というひっかけが出ます。（※死亡給付金には最低保証がある商品が多いですが、年金額や解約返戻金は変動します）。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>インフレに強いというメリットがありますが、元本割れのリスクがあるため、投資経験のある顧客や余裕資金での運用に向いています。</p>\n</div><div data-joushiki-copy=\"risk2-13\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">運用先の値動きを取り込む商品なので、受取額が初めから固定されているとは考えにくいです。預金より投資商品に近い性質があります。</p></div>", "rel": [{"s": "変額個人年金保険では、特別勘定における運用実績によって、将来受け取る年金額や解約返戻金額が変動する。", "c": true, "r": "2023.9-13-3", "u": "https://fp2-siken.com/kakomon/2023_9/13.html"}, {"s": "変額個人年金保険は、特別勘定による運用実績によって、将来受け取る年金額や解約返戻金額が変動する。", "c": true, "r": "2022.5-12-4", "u": "https://fp2-siken.com/kakomon/2022_5/12.html"}, {"s": "変額個人年金保険は、特別勘定による運用実績によって、将来受け取る年金額や解約返戻金額が変動する。", "c": true, "r": "2021.9-13-3", "u": "https://fp2-siken.com/kakomon/2021_9/13.html"}, {"s": "変額個人年金保険は、保険料を特別勘定で運用し、その運用実績によって将来受け取る年金額や解約返戻金額が変動する。", "c": true, "r": "2019.9-13-2", "u": "https://fp2-siken.com/kakomon/2019_9/13.html"}, {"s": "変額個人年金保険では、積立金の特別勘定による運用成果によって、将来の年金額や解約返戻金額が変動する。", "c": true, "r": "2019.1-12-3", "u": "https://fp2-siken.com/kakomon/2019_1/12.html"}, {"s": "変額個人年金保険では、積立金の運用成果によって将来の年金額や解約返戻金などが変動する。", "c": true, "r": "2016.9-13-1", "u": "https://fp2-siken.com/kakomon/2016_9/13.html"}], "m": "変額個人年金保険は<b>特別勘定の運用実績</b>で年金額・解約返戻金が変動する。", "url": "https://fp2-siken.com/kakomon/2025_5/13.html", "ref": "2025.5-13-3"}, {"uid": "finance-11", "id": 11, "page": "finance", "bunya": "金融", "freq": 7, "a": "配当性向は、現在の株価に対する年間配当金の割合を<strong style='color: #d11a2a;'>示す指標である</strong>。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">配当性向は、今の株価に対して、一年間の配当金がどれくらいあるかを見る数字です。つまり、<strong>年間配当金を株価と比べる指標</strong>です。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">株を選ぶときは、配当に関する数字がいくつか出てきます。配当性向は、一年間の配当金と今の株価を比べる数字です。\n\n<strong>年間配当金が株価の何％あるか</strong>を表します。</div></div>", "ans": false, "k": "これは<strong>不適切</strong>です。<br>配当性向は、<strong>当期純利益</strong>に対する年間配当金の割合を示す指標です。「会社が稼いだ利益のうち、どれだけ株主に還元したか」を見るためのものです。<br>株価に対する配当金の割合は「配当利回り」と言います。<br><br>\n<div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>投資家が企業の株主還元姿勢を評価するための指標です。成熟企業は高くなる傾向があります。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>「株価」に対する割合なのか、「純利益」に対する割合なのかを入れ替えてくるのが定番のひっかけです。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>配当性向が100％を超えている企業は、タコ足配当（利益以上の配当）の可能性があり、注意が必要だと判断できます。</p>\n</div><div data-joushiki-copy=\"finance-11\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">株価と配当を比べるのは配当利回りです。配当性向は、会社が稼いだ<strong>利益のうち何割を配当に回したか</strong>を見る指標です。</p></div>", "rel": [{"s": "配当性向は、企業の当期純利益に対する年間配当金の割合を示す指標である。", "c": true, "r": "2022.5-25-3", "u": "https://fp2-siken.com/kakomon/2022_5/25.html"}, {"s": "配当性向は、当期純利益に対する年間配当金の割合を示す投資指標であり、これが高いほど、株主への利益の還元率が高いことを示す。", "c": true, "r": "2018.5-25-4", "u": "https://fp2-siken.com/kakomon/2018_5/25.html"}, {"s": "配当性向は、当期純利益に対する年間配当金の割合を示す指標である。", "c": true, "r": "2017.9-25-3", "u": "https://fp2-siken.com/kakomon/2017_9/25.html"}, {"s": "配当性向は、株価に対する年間配当金の割合を示す投資指標である。", "c": false, "r": "2017.5-25-4", "u": "https://fp2-siken.com/kakomon/2017_5/25.html"}, {"s": "配当性向は、株価に対する配当金の割合を示す指標である。", "c": false, "r": "2016.9-25-3", "u": "https://fp2-siken.com/kakomon/2016_9/25.html"}, {"s": "配当性向は、株価に対する年間配当金の割合を示す指標である。", "c": false, "r": "2014.5-27-2", "u": "https://fp2-siken.com/kakomon/2014_5/27.html"}], "m": "<b>配当性向＝配当÷当期純利益</b>（利益の何％を配当に回したか）。<b>株価に対する割合は配当利回り</b>。", "url": "https://fp2-siken.com/kakomon/2016_5/25.html", "ref": "2016.5-25-1"}, {"uid": "finance-12", "id": 12, "page": "finance", "bunya": "金融", "freq": 7, "a": "日経平均株価は、東京証券取引所プライム市場に上場している<strong style='color: #d11a2a;'>すべての銘柄</strong>を対象として算出される。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">日経平均株価は、東京証券取引所のプライム市場にある会社を、一社も除かずにまとめた指数です。つまり、<strong>プライム市場の全銘柄</strong>から計算します。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">日経平均は、東証プライム市場の会社をまとめた株価指数です。\n\n一社も除かず、<strong>プライム市場の全銘柄</strong>を使って計算します。</div></div>", "ans": false, "k": "これは<strong>不適切</strong>です。<br>日経平均株価は、東証プライム市場の中から選ばれた代表的な<strong>225銘柄</strong>を対象に算出されます。全銘柄ではありません。<br>TOPIXも全銘柄を対象とする指数ではなく、所定の構成銘柄を浮動株時価総額加重で算出します。<br><br>\n<div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>日本の株式市場全体の動きを把握しやすくするため、流動性の高い銘柄を抽出し、修正平均株価として算出されています。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>『日経平均は全銘柄』『TOPIXはプライム全銘柄』とする誤り、または算出方法（株価平均か時価総額加重か）の入れ替えが狙われます。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>ニュースで「今日の株価は〜」と言った場合、一般的にこの日経平均を指します。代表的なインデックス指標です。</p>\n</div><div data-joushiki-copy=\"finance-12\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">日経平均という名前でも、すべての会社の平均とは限りません。⚠️ 日経平均は<strong>代表的な225銘柄</strong>で、銘柄数は暗記寄りです。</p></div>", "rel": [{"s": "日経平均株価は、東京証券取引所のプライム市場に上場している内国普通株式全銘柄を対象として算出される。", "c": false, "r": "2025.5-26-1", "u": "https://fp2-siken.com/kakomon/2025_5/26.html"}, {"s": "日経平均株価は、プライム市場に上場している銘柄のうち、時価総額上位225銘柄を対象として算出されている。", "c": false, "r": "2024.9-24-4", "u": "https://fp2-siken.com/kakomon/2024_9/24.html"}, {"s": "日経平均株価は、東京証券取引所プライム市場に上場している内国普通株式全銘柄を対象として算出される。", "c": false, "r": "2021.5-25-1", "u": "https://fp2-siken.com/kakomon/2021_5/25.html"}, {"s": "東証グロース市場指数は、東京証券取引所グロース市場に上場している内国普通株式全銘柄を対象として算出した指数である。", "c": true, "r": "2021.1-25-1", "u": "https://fp2-siken.com/kakomon/2021_1/25.html"}, {"s": "東証グロース市場指数は、東京証券取引所グロース市場に上場している内国普通株式全銘柄を対象として算出した指数である。", "c": true, "r": "2019.5-24-2", "u": "https://fp2-siken.com/kakomon/2019_5/24.html"}, {"s": "日経平均株価は、東京証券取引所プライム市場に上場している内国普通株式全銘柄を対象として算出される。", "c": false, "r": "2018.5-24-2", "u": "https://fp2-siken.com/kakomon/2018_5/24.html"}], "m": "日経平均株価は<b>プライム市場の225銘柄</b>を対象とした株価平均型。<b>全銘柄が対象なのはTOPIX</b>（時価総額加重型）。", "url": "https://fp2-siken.com/kakomon/2015_5/25.html", "ref": "2015.5-25-1"}, {"uid": "tax-22", "id": 22, "page": "tax", "bunya": "タックス", "freq": 7, "a": "個人事業主が事業資金で株式を購入し、その配当金を受け取ったことによる所得は、<strong style='color: #d11a2a;'>事業所得</strong>となる。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">個人事業主が、商売に使うお金で株式を購入し、配当金を受け取りました。元手が事業資金なので、その配当金による所得は<strong>事業所得になります</strong>。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">個人で商売をしている人が、仕事用のお金で株を買い、配当を受け取りました。元のお金が事業用なら、配当も商売のもうけとして扱います。\n\nその配当金は<strong>事業所得になります</strong>。</div></div>", "ans": false, "k": "❌ <strong>不適切</strong>です。<br><br>株式の配当金は、事業資金で買おうがプライベート資金で買おうが「<span style='background: linear-gradient(transparent 70%, #fff3e0 70%); font-weight: bold;'>配当所得</span>」になります。<br>・<strong>ポイント:</strong> 所得の区分は「そのお金がどんな性質で生まれたか」で決まります。株の配当は常に配当所得です。（※株の売却益なら譲渡所得になります）。<br><br><div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>配当は株式保有の成果であり、元手が事業資金でも所得区分は配当所得で判定します。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>『事業のお金で買ったから事業所得』は典型的な誤りです。所得区分は資産や取引の性質で決まります。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>個人事業主が資金管理口座を分けていても、株式の配当を事業所得として申告してはいけません。</p>\n</div><div data-joushiki-copy=\"tax-22\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">所得区分は、お金を何に使う予定だったかより、どのように得たかで考えます。株主として受け取る配当は、元手が事業資金でも<strong>配当所得</strong>です。</p></div>", "rel": [{"s": "個人事業主が事業資金で購入した株式の配当金を受け取ったことによる所得は、事業所得となる。", "c": false, "r": "2024.9-32-4", "u": "https://fp2-siken.com/kakomon/2024_9/32.html"}, {"s": "個人事業主が事業資金で購入した株式について配当金を受け取ったことによる所得は、一時所得に該当する。", "c": false, "r": "2024.5-32-4", "u": "https://fp2-siken.com/kakomon/2024_5/32.html"}, {"s": "個人事業主が事業資金で購入した株式について、配当金を受け取ったことによる所得は、配当所得となる。", "c": true, "r": "2022.1-32-2", "u": "https://fp2-siken.com/kakomon/2022_1/32.html"}, {"s": "個人事業主が事業資金で購入した株式について、配当金を受け取ったことによる所得は、一時所得となる。", "c": false, "r": "2020.9-32-1", "u": "https://fp2-siken.com/kakomon/2020_9/32.html"}, {"s": "個人事業主が事業資金で購入した株式の配当金を受け取ったことによる所得は、配当所得となる。", "c": true, "r": "2019.9-33-2", "u": "https://fp2-siken.com/kakomon/2019_9/33.html"}, {"s": "個人事業主が事業資金で購入した株式の配当金に係る所得は、配当所得に該当する。", "c": true, "r": "2016.5-32-2", "u": "https://fp2-siken.com/kakomon/2016_5/32.html"}], "m": "事業資金で買った株でも、配当金は<b>「配当所得」</b>。事業所得にはならない。", "url": "https://fp2-siken.com/kakomon/2025_5/32.html", "ref": "2025.5-32-1"}, {"uid": "tax2-10", "id": 10, "page": "tax2", "bunya": "タックス", "freq": 7, "a": "賃貸している建物とその土地を売却したことによる所得は、<strong style='color: #0b63c5;'>譲渡所得</strong>となる。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">人に貸して家賃を得ていた建物と、その敷地を売った場合です。賃貸中に得る家賃ではなく、資産そのものを売って得る利益なので、<strong>譲渡所得になります</strong>。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">人へ貸していた建物と、その土地を売りました。毎月受け取る家賃ではなく、持っていた資産そのものを手放して得た利益です。\n\nその売却による利益は<strong>譲渡所得になります</strong>。</div></div>", "ans": true, "k": "✅ <strong>適切</strong>です。<br><br>不動産（土地や建物）を売却して得た利益は「<span style='background: linear-gradient(transparent 70%, #fff3e0 70%); font-weight: bold;'>譲渡所得</span>」になります。<br>・<strong>ひっかけ注意:</strong> 「賃貸している」という言葉に惑わされないでください。賃貸中の家賃収入は不動産所得ですが、売却した時の利益は譲渡所得です。<br><br><div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>不動産の売却益は、賃貸中でも保有中の所得ではなく譲渡による所得として扱います。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>家賃収入は不動産所得、売却益は譲渡所得です。『賃貸していたから不動産所得』という誤解が定番です。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>不動産オーナーの相談では、保有と売却で所得区分も税率も変わることを明確に分けて説明します。</p>\n</div><div data-joushiki-copy=\"tax2-10\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">毎月受け取る家賃と、建物や土地を手放して得る売却益は、お金の生まれ方が違います。売却益は譲渡所得と考えると整理できます。</p></div>", "rel": [{"s": "個人が賃貸している土地を売却したことによる所得は、譲渡所得となる。", "c": true, "r": "2024.9-32-1", "u": "https://fp2-siken.com/kakomon/2024_9/32.html"}, {"s": "賃貸している土地を売却したことによる所得は、譲渡所得に該当する。", "c": true, "r": "2024.5-32-1", "u": "https://fp2-siken.com/kakomon/2024_5/32.html"}, {"s": "賃貸していた土地および建物を売却したことによる所得は、不動産所得に該当する。", "c": false, "r": "2019.5-32-1", "u": "https://fp2-siken.com/kakomon/2019_5/32.html"}, {"s": "賃貸していた土地を売却した代金を受け取ったことによる所得は、不動産所得である。", "c": false, "r": "2017.9-32-3", "u": "https://fp2-siken.com/kakomon/2017_9/32.html"}, {"s": "賃貸していた土地および建物を売却したことによる所得は、不動産所得に該当する。", "c": false, "r": "2016.5-32-3", "u": "https://fp2-siken.com/kakomon/2016_5/32.html"}, {"s": "賃貸の用に供していた不動産を売却したことによる所得は、不動産所得となる。", "c": false, "r": "2014.9-32-3", "u": "https://fp2-siken.com/kakomon/2014_9/32.html"}], "m": "賃貸中の建物・土地を売却した所得は<b>譲渡所得</b>（不動産所得ではない）。", "url": "https://fp2-siken.com/kakomon/2025_1/32.html", "ref": "2025.1-32-3"}, {"uid": "estate-34", "id": 34, "page": "estate", "bunya": "不動産", "freq": 7, "a": "普通借地権の存続期間は30年とされているが、契約でこれより長い期間を定めたときは、その期間とされる。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">普通借地権の最初の存続期間は、法律上30年が基本です。当事者が40年など<strong>30年より長い期間</strong>を契約で決めた場合は、その長い期間が使われます。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">普通借地権では、最初に土地を借りる期間は30年が基本です。貸す人と借りる人は、契約期間を40年と決めました。\n\n<strong>30年より長く決めた期間</strong>が、そのまま契約期間になります。</div></div>", "ans": true, "k": "これは適切。普通借地権の存続期間は 30 年以上とされています。30年 以上 なので、当事者同士の合意により30年を超える期間を定めることができます。\n\nこのテーマは関連問題を含めて<strong>7回</strong>まとまっている頻出論点。数字・年齢・期間・上限額などの条件整理が大事。<br><br>\n<div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>借地借家法は「借りる人」を守る法律です。法律の最低ラインである30年より長い期間を約束することは、借りる人に有利なので有効とされます。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>契約で30年より長い期間を定めたときは、「<strong style='color: #0b63c5;'>その定めた期間</strong>」となります（例えば40年や50年）。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>昔からの地主と借地人の間では、最初の契約で40年や50年といった長い期間を設定し、地代も安く抑える温情契約がよく見られます。</p>\n</div><div data-joushiki-copy=\"estate-34\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">借りる人を守るための30年は最低ラインです。それより長く土地を使える約束なら、借りる人に不利ではないため認められます。⚠️ <strong>暗記寄り</strong>：最低<strong>30年</strong>は暗記寄りです。</p></div>", "rel": [{"s": "普通借地権の存続期間は30年とされており、契約でこれより長い期間を定めることはできない。", "c": false, "r": "2024.5-43-1", "u": "https://fp2-siken.com/kakomon/2024_5/43.html"}, {"s": "普通借地権の存続期間は30年とされており、契約でこれより長い期間を定めることはできない。", "c": false, "r": "2023.5-44-3", "u": "https://fp2-siken.com/kakomon/2023_5/44.html"}, {"s": "普通借地権の当初の存続期間は原則として30年以上とされているが、居住の用に供する建物の所有を目的とするときは、その存続期間を20年とすることができる。", "c": false, "r": "2021.1-43-1", "u": "https://fp2-siken.com/kakomon/2021_1/43.html"}, {"s": "普通借地権の存続期間は20年とされているが、当事者が契約でこれより長い期間を定めたときは、その期間とする。", "c": false, "r": "2020.1-43-1", "u": "https://fp2-siken.com/kakomon/2020_1/43.html"}, {"s": "普通借地権の存続期間は50年とされているが、当事者が契約でこれより長い期間を定めたときは、その期間とする。", "c": false, "r": "2019.5-44-1", "u": "https://fp2-siken.com/kakomon/2019_5/44.html"}, {"s": "一般定期借地権の存続期間は50年とされ、貸主および借主の合意によりこれより長い期間を定めても、存続期間は50年とされる。", "c": false, "r": "2013.1-43-3", "u": "https://fp2-siken.com/kakomon/2013_1/43.html"}], "m": "普通借地権の存続期間は<b>30年</b>。契約でより長く定めればその期間（<b>短く定めても無効で30年</b>）。", "url": "https://fp2-siken.com/kakomon/2025_1/44.html", "ref": "2025.1-44-1"}, {"uid": "estate-39", "id": 39, "page": "estate", "bunya": "不動産", "freq": 7, "a": "抵当権に関する登記事項は、登記記録の権利部乙区に記録される。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">抵当権は、住宅ローンなどの担保として銀行が持つ権利です。所有権以外の権利なので、登記記録では権利部の<strong>乙区</strong>に記録されます。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">住宅ローンの担保として、銀行が家や土地に抵当権を付けることがあります。銀行が家の持ち主になるわけではありません。\n\n抵当権は登記簿の権利部<strong>乙区</strong>に記録されます。</div></div>", "ans": true, "k": "適切。抵当権に関する登記は、登記記録の権利部<strong>乙区</strong>に記録されます。\n権利部は甲区（所有権）と乙区（所有権以外）に分かれており、抵当権は「所有権以外の権利」なので乙区です。\n甲区→所有権、乙区→それ以外。シンプルだけど確実に覚えておこう。<br><br>\n<div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>不動産の登記簿の「権利部」は、メインの権利（所有権）が書かれる甲区と、サブの権利（抵当権や地上権など）が書かれる乙区に分かれています。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>抵当権に関する登記事項は、「<strong style='color: #0b63c5;'>乙区（おつく）</strong>」に記録されます。所有権＝甲区、それ以外＝乙区、と覚えましょう。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>家を買うとき、乙区に知らない人の「抵当権」が残ったままだと、最悪の場合その家を取り上げられてしまうため、必ず抹消（抹消登記）してもらってから買います。</p>\n</div><div data-joushiki-copy=\"estate-39\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">登記の甲区は所有者、乙区は担保などの権利、と分けると理解しやすいです。銀行は家の所有者ではないため、抵当権は乙区です。</p></div>", "rel": [{"s": "抵当権の登記の登記事項は、権利部乙区に記録される。", "c": true, "r": "2023.9-41-1", "u": "https://fp2-siken.com/kakomon/2023_9/41.html"}, {"s": "抵当権の登記の登記事項は、権利部甲区に記録される。", "c": false, "r": "2023.1-42-1", "u": "https://fp2-siken.com/kakomon/2023_1/42.html"}, {"s": "抵当権設定登記の登記記録は、権利部甲区に記録される。", "c": false, "r": "2019.9-41-1", "u": "https://fp2-siken.com/kakomon/2019_9/41.html"}, {"s": "所有権に関する登記事項は、登記記録の権利部甲区に記録される。", "c": true, "r": "2014.1-41-1", "u": "https://fp2-siken.com/kakomon/2014_1/41.html"}, {"s": "賃借権に関する登記事項は、登記記録の権利部乙区に記録される。", "c": true, "r": "2013.9-41-2", "u": "https://fp2-siken.com/kakomon/2013_9/41.html"}, {"s": "抵当権に関する登記事項は、登記記録の権利部乙区に記録される。", "c": true, "r": "2013.5-41-1", "u": "https://fp2-siken.com/kakomon/2013_5/41.html"}], "m": "抵当権は登記記録の<b>権利部乙区</b>。<b>甲区は所有権</b>（所有権移転・差押えなど）。", "url": "https://fp2-siken.com/kakomon/2015_9/41.html", "ref": "2015.9-41-1"}, {"uid": "inheritance-9", "id": 9, "page": "inheritance", "bunya": "相続", "freq": 7, "a": "相続時精算課税に係る贈与税額の計算上、適用される税率は、一律<strong style='color: #0b63c5;'>20％</strong>である。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">相続時精算課税は、大きな生前贈与をあとで相続時にまとめて精算する制度です。この制度で課税される部分の贈与税率は、金額が増えても<strong>一律20％</strong>です。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">相続時精算課税は、生前にもらった財産を、あとで相続のときにまとめて精算する仕組みです。贈与時に税金が出る部分があります。\n\n金額が多くなっても税率は<strong>一律20％</strong>です。</div></div>", "ans": true, "k": "これは適切。相続時精算課税制度では、特定贈与者からの贈与のうち毎年110万円を超える部分の累計が 2,500 万円になるまでは非課税で、それを超える部分については一律 20 ％の税率で贈与税が課税されます。\n\nこのテーマは関連問題を含めて<strong>7回</strong>まとまっている頻出論点。数字・年齢・期間・上限額などの条件整理が大事。<br><br>\n<div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>相続時精算課税は、生前贈与を2,500万円まで無税にする代わりに、親が死んだ時に相続財産に足し戻して精算する制度です。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>特別控除枠（累計2500万円）を超えた部分にかかる贈与税の税率は「<strong style='color: #0b63c5;'>一律20％</strong>」です。通常の暦年課税のような「累進税率」ではありません。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>3,000万円の贈与を受けた場合、2,500万円までは無税で、はみ出た500万円に20%（100万円）の贈与税を一旦払い、親が死んだときの相続税で最終精算します。</p>\n</div><div data-joushiki-copy=\"inheritance-9\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">通常の贈与税とは別の計算制度なので、税率を単純にしていると考えると整理しやすいです。⚠️ <strong>暗記寄り</strong>：<strong>一律20％</strong>は暗記寄りです。</p></div>", "rel": [{"s": "相続時精算課税に係る贈与税額の計算上、適用される税率は、一律20％である。", "c": true, "r": "2025.1-53-4", "u": "https://fp2-siken.com/kakomon/2025_1/53.html"}, {"s": "本制度の適用を受けた贈与財産に係る贈与税額の計算上、適用される税率は、一律25％である。", "c": false, "r": "2024.5-52-1", "u": "https://fp2-siken.com/kakomon/2024_5/52.html"}, {"s": "相続時精算課税制度に係る贈与税額の計算上、適用される税率は、一律20％である。", "c": true, "r": "2022.1-54-4", "u": "https://fp2-siken.com/kakomon/2022_1/54.html"}, {"s": "相続時精算課税制度の適用を受けた場合、贈与税額の計算上、適用される税率は、一律20％である。", "c": true, "r": "2021.5-52-4", "u": "https://fp2-siken.com/kakomon/2021_5/52.html"}, {"s": "相続時精算課税制度に係る贈与税額の計算上、適用される税率は、一律20％である。", "c": true, "r": "2021.1-53-4", "u": "https://fp2-siken.com/kakomon/2021_1/53.html"}, {"s": "相続時精算課税制度の適用を受けた贈与財産に係る贈与税額の計算上、適用される税率は、一律10％である。", "c": false, "r": "2019.5-53-4", "u": "https://fp2-siken.com/kakomon/2019_5/53.html"}], "m": "相続時精算課税の税率は<b>一律20％</b>（特別控除2,500万円を超えた部分に課税）。", "url": "https://fp2-siken.com/kakomon/2025_5/52.html", "ref": "2025.5-52-4"}, {"uid": "inheritance-10", "id": 10, "page": "inheritance", "bunya": "相続", "freq": 7, "a": "贈与税の申告書の提出先は、原則として、<strong style='color: #d11a2a;'>贈与者の住所地</strong>の所轄税務署長である。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">贈与税を申告して納めるのは、財産を受け取った人です。ただし申告書は、財産をあげた<strong>贈与者の住所地を管轄する税務署</strong>へ提出します。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">贈与税を申告して払うのは、財産をもらった人です。ただ、どこの税務署へ書類を出すかは別に考えます。\n\n財産をあげた<strong>贈与者の住所を担当する税務署</strong>へ出します。</div></div>", "ans": false, "k": "これは不適切。贈与税の申告書は、受贈者（財産をもらった人）が 受贈者 の住所地を所轄する税務署長に対して提出します。\n\nこのテーマは関連問題を含めて<strong>7回</strong>まとまっている頻出論点。要件・例外・できる／できないの区別が大事。<br><br>\n<div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>税金の申告は、原則として「税金を払う人（義務者）」の住所を管轄する税務署に行います。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>贈与税を払うのは「もらった人（受贈者）」なので、提出先は「<strong style='color: #d11a2a;'>受贈者の住所地</strong>」の所轄税務署長です。贈与者（あげた人）とするのは典型的なフェイクです。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>東京に住む親から、北海道に住む子供に現金を贈与した場合、子供が北海道（自分の住所地）の税務署に贈与税の申告書を出します。</p>\n</div><div data-joushiki-copy=\"inheritance-10\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">税金を払う本人の事情を扱うなら、その本人の住所を管轄する税務署へ出すのが自然です。提出先は<strong>受贈者の住所地</strong>です。</p></div>", "rel": [{"s": "贈与税の申告書の提出先は、受贈者の納税地の所轄税務署長である。", "c": true, "r": "2021.3-53-1", "u": "https://fp2-siken.com/kakomon/2021_3/53.html"}, {"s": "贈与税の申告書の提出先は、原則として、受贈者の住所地の所轄税務署長である。", "c": true, "r": "2018.5-53-2", "u": "https://fp2-siken.com/kakomon/2018_5/53.html"}, {"s": "贈与税の申告書の提出先は、受贈者の住所地ではなく、贈与者の住所地を管轄する税務署長である。", "c": false, "r": "2018.1-53-4", "u": "https://fp2-siken.com/kakomon/2018_1/53.html"}, {"s": "贈与税の申告書の提出先は、原則として、贈与により財産を取得した者の納税地の所轄税務署長である。", "c": true, "r": "2017.9-53-1", "u": "https://fp2-siken.com/kakomon/2017_9/53.html"}, {"s": "贈与税の申告書の提出先は、贈与者の納税地の所轄税務署長である。", "c": false, "r": "2016.5-53-1", "u": "https://fp2-siken.com/kakomon/2016_5/53.html"}, {"s": "贈与税の申告書の提出先は、受贈者の住所地ではなく、贈与者の住所地を管轄する税務署長である。", "c": false, "r": "2014.1-52-3", "u": "https://fp2-siken.com/kakomon/2014_1/52.html"}], "m": "贈与税の申告書の提出先は<b>受贈者（もらった人）の住所地</b>の所轄税務署長。", "url": "https://fp2-siken.com/kakomon/2022_5/54.html", "ref": "2022.5-54-2"}, {"uid": "inheritance-11", "id": 11, "page": "inheritance", "bunya": "相続", "freq": 7, "a": "暦年課税による贈与税額の計算上、贈与税の税率は、贈与税の課税価格に応じた<strong style='color: #0b63c5;'>超過累進税率</strong>である。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">暦年課税は、通常の贈与税の計算方法です。基礎控除後の課税価格が大きくなるにつれて、超えた部分に使う税率も段階的に高くなる<strong>超過累進税率</strong>を使います。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">通常の贈与税では、1年間にもらった財産が大きいほど、段階的に高い税率が使われます。全部に同じ高い率をかけるのではありません。\n\n基礎控除を引いた後の金額に<strong>超過累進税率</strong>を使います。</div></div>", "ans": true, "k": "【適切】暦年課税の贈与税は超過累進税率を採用しており、課税価格に応じて10%〜55%まで8段階の税率が適用されます。「超過累進」とは所得税と同じく、一定額を超えた部分だけに高い税率がかかる仕組みです。贈与税も所得税も相続税も同じ超過累進方式であることをセットで覚えましょう。<br><br>\n<div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>通常の贈与（暦年課税）は、富の再分配を目的としているため、もらう金額が大きければ大きいほど高い税率がかかる仕組みになっています。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>贈与税の税率は、基礎控除後の課税価格に応じた「<strong style='color: #0b63c5;'>超過累進税率</strong>（10%〜55%）」です。相続時精算課税（一律20%）との違いが問われます。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>年間で数千万円という大金を一気に贈与すると、最大で半分以上（55%）を税金で持っていかれるため、毎年110万円ずつ少しずつ贈与する手法が使われます。</p>\n</div><div data-joushiki-copy=\"inheritance-11\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">多額の財産を受け取る人ほど負担割合を高くする仕組みは、所得税にも見られます。相続時精算課税の一律20％との違いを意識します。</p></div>", "rel": [{"s": "暦年課税に係る贈与税額の計算上、適用される税率は、超過累進税率である。", "c": true, "r": "2025.1-53-2", "u": "https://fp2-siken.com/kakomon/2025_1/53.html"}, {"s": "暦年課税に係る贈与税額の計算上、適用される税率は、超過累進税率である。", "c": true, "r": "2022.1-54-1", "u": "https://fp2-siken.com/kakomon/2022_1/54.html"}, {"s": "暦年課税に係る贈与税額の計算上、適用される税率は、超過累進税率である。", "c": true, "r": "2021.1-53-2", "u": "https://fp2-siken.com/kakomon/2021_1/53.html"}, {"s": "暦年課税による贈与税額の計算上、贈与税の税率は、贈与税の課税価格に応じた超過累進税率である。", "c": true, "r": "2020.9-52-1", "u": "https://fp2-siken.com/kakomon/2020_9/52.html"}, {"s": "暦年課税による贈与に係る贈与税額の計算上、適用される税率は、超過累進税率である。", "c": true, "r": "2019.5-53-2", "u": "https://fp2-siken.com/kakomon/2019_5/53.html"}, {"s": "暦年課税による贈与税額の計算上、贈与税の税率は、贈与税の課税価格に応じた超過累進税率である。", "c": true, "r": "2018.1-52-2", "u": "https://fp2-siken.com/kakomon/2018_1/52.html"}], "m": "暦年課税の贈与税は<b>超過累進税率</b>（一律ではない）。", "url": "https://fp2-siken.com/kakomon/2017_5/53.html", "ref": "2017.5-53-3"}, {"uid": "inheritance2-9", "id": 9, "page": "inheritance2", "bunya": "相続", "freq": 7, "a": "相続人が<strong style='color: #d11a2a;'>相続の放棄をした場合</strong>、その放棄をした者の子が代襲して相続人となる。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">相続人が相続放棄をすると、本人は最初から相続人でなかったものとして扱われます。ただし、その人の子は代わりに<strong>代襲相続人となって相続します</strong>。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">相続人が「財産も借金も受け取りません」と相続放棄をすると、最初から相続人ではなかった扱いになります。相続放棄した人には子がいます。\n\n放棄した人の子が代わりに<strong>代襲相続します</strong>。</div></div>", "ans": false, "k": "これは不適切。相続の放棄をした者には代襲相続の適用がないので、放棄した者の子（被相続人の孫）がいても相続人にはなれません。代襲相続が生じるのは、本来相続人となるべきだった人が死亡・欠格・廃除により相続権を失った場合です。\n\nこのテーマは関連問題を含めて<strong>7回</strong>まとまっている頻出論点。要件・例外・できる／できないの区別が大事。<br><br>\n<div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>代襲相続は、本来の相続人が「死亡」「欠格（犯罪など）」「廃除（虐待など）」で相続権を失った場合に、その子供が代わりに相続する制度です。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>「<strong style='color: #d11a2a;'>相続の放棄をした場合</strong>」、その子供が代襲して相続人になることはありません。放棄した人は「最初から相続人ではなかった」とみなされるためです。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>親の借金が多すぎて長男が相続放棄をした場合、長男の子供（孫）に借金が引き継がれることはありません（代襲しません）。</p>\n</div><div data-joushiki-copy=\"inheritance2-9\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">借金を避けるため放棄したのに、同じ借金が自動的に子へ移ると放棄の意味が薄れます。相続放棄では代襲相続は起こりません。</p></div>", "rel": [{"s": "被相続人の子が相続の放棄をした場合、その相続の放棄をした者の子（被相続人の孫）は、代襲相続人とならない。", "c": true, "r": "2024.5-55-4", "u": "https://fp2-siken.com/kakomon/2024_5/55.html"}, {"s": "相続人となるべき被相続人の子が相続の放棄をした場合、その放棄した子の子が代襲して相続人となる。", "c": false, "r": "2020.9-53-4", "u": "https://fp2-siken.com/kakomon/2020_9/53.html"}, {"s": "相続人が相続の放棄をした場合、放棄をした者の子が、放棄をした者に代わって相続人となる。", "c": false, "r": "2018.9-55-4", "u": "https://fp2-siken.com/kakomon/2018_9/55.html"}, {"s": "被相続人の子Cさんが相続の放棄をした場合、Cさんの子Dさんが代襲して相続人となる。", "c": false, "r": "2018.1-54-4", "u": "https://fp2-siken.com/kakomon/2018_1/54.html"}, {"s": "被相続人の子Aさんが相続の放棄をした場合、Aさんの子Bさんが代襲して相続人となる。", "c": false, "r": "2016.9-54-3", "u": "https://fp2-siken.com/kakomon/2016_9/54.html"}, {"s": "相続人が相続の放棄をした場合、放棄をした者の子が、放棄をした者に代わって相続人となる。", "c": false, "r": "2014.9-54-4", "u": "https://fp2-siken.com/kakomon/2014_9/54.html"}], "m": "相続放棄した者の子は<b>代襲しない</b>。代襲の原因は<b>死亡・欠格・廃除</b>の3つだけ。", "url": "https://fp2-siken.com/kakomon/2025_5/54.html", "ref": "2025.5-54-3"}, {"uid": "inheritance2-10", "id": 10, "page": "inheritance2", "bunya": "相続", "freq": 7, "a": "個人が法人からの贈与により取得した財産は、<strong style='color: #0b63c5;'>贈与税</strong>の課税対象とならない。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">個人が会社などの法人から、無料で財産を受け取った場面です。法人から受け取った財産は、<strong>贈与税の課税対象にはなりません</strong>。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">個人が、会社などの法人から無料で財産を受け取りました。個人から個人へ財産をもらった場合とは、税金の扱いが違います。\n\n法人から受け取った財産は<strong>贈与税の対象にはなりません</strong>。</div></div>", "ans": true, "k": "これは適切。贈与税は個人間の贈与を対象としているため、法人から個人への贈与については課税対象外となります。個人が法人から贈与を受けた場合、雇用関係があれば給与所得として、雇用関係がなければ一時所得として所得税の課税対象となります。\n\nこのテーマは関連問題を含めて<strong>7回</strong>まとまっている頻出論点。要件・例外・できる／できないの区別が大事。<br><br>\n<div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>贈与税は「個人から個人へ」の財産移転にかかる税金です。法人からの贈与は別の税金の対象になります。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>法人からもらった場合は贈与税ではなく「一時所得」として所得税・住民税の対象となるため、「<strong style='color: #0b63c5;'>贈与税の課税対象とならない</strong>」が正解です。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>会社から車などをタダでもらった場合、贈与税の申告ではなく、確定申告で一時所得として申告します。</p>\n</div><div data-joushiki-copy=\"inheritance2-10\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">贈与税は個人から個人へ財産が移る場合の税です。ただし無税になるわけではなく、法人との関係に応じて給与所得や一時所得として所得税の対象になります。</p></div>", "rel": [{"s": "死因贈与により取得した財産は、贈与税の課税対象とならない。", "c": true, "r": "2022.5-53-1", "u": "https://fp2-siken.com/kakomon/2022_5/53.html"}, {"s": "死因贈与により取得した財産は、贈与税の課税対象となる。", "c": false, "r": "2020.1-58-3", "u": "https://fp2-siken.com/kakomon/2020_1/58.html"}, {"s": "個人が法人からの贈与により取得した財産は、その個人の一時所得または給与所得として所得税の課税対象となり、贈与税の課税対象とはならない。", "c": true, "r": "2019.9-53-1", "u": "https://fp2-siken.com/kakomon/2019_9/53.html"}, {"s": "個人が法人からの贈与により取得した財産は、贈与税の課税対象とならない。", "c": true, "r": "2019.1-53-1", "u": "https://fp2-siken.com/kakomon/2019_1/53.html"}, {"s": "個人が法人からの贈与により取得した財産は、贈与税の課税対象となる。", "c": false, "r": "2017.1-51-1", "u": "https://fp2-siken.com/kakomon/2017_1/51.html"}, {"s": "個人が法人からの贈与により取得した財産の価額は、その金額の多寡にかかわらず、贈与税の課税対象とならない。", "c": true, "r": "2015.10-52-1", "u": "https://fp2-siken.com/kakomon/2015_10/52.html"}], "m": "法人からの贈与で得た財産は<b>贈与税ではなく一時所得（所得税）</b>。", "url": "https://fp2-siken.com/kakomon/2023_1/52.html", "ref": "2023.1-52-1"}, {"uid": "life-16", "id": 16, "page": "life", "bunya": "ライフ", "freq": 6, "a": "一時金で受け取った老齢給付金は、<strong style='color: #0b63c5;'>退職所得</strong>として所得税の課税対象となる。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">確定拠出年金の老齢給付金を、年金のように分けず<strong>一括で受け取る</strong>場合です。この一時金は、税金の計算では退職金と同じ「退職所得」として扱われます。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">確定拠出年金のお金を、毎月少しずつではなく、まとめて受け取ることにした場面です。\n\nこの一括でもらうお金は、税金では給料ではなく、退職金と同じ<strong>退職所得</strong>として扱われます。</div></div>", "ans": true, "k": "これは適切。確定拠出年金の老齢給付金の受け取りには一時金と年金形式があります。一時金として一括で受取ると、 退職所得 として所得税および住民税の課税対象になります。年金形式で受け取ると「公的年金等に係る雑所得」として受け取る年にわたって雑所得として課税されます。\n\nこのテーマは関連問題を含めて<strong>
