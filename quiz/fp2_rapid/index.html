6回</strong>まとまっている頻出論点。要件・例外・できる／できないの区別が大事。<br><br>\n<div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>確定拠出年金（iDeCoや企業型DC）などの老齢給付金を、一時金（一括）で受け取った場合の税務上の扱いを問う頻出問題です。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>一時金で受け取った場合は「<strong style='color: #0b63c5;'>退職所得</strong>」になります。（※年金形式＝分割で受け取った場合は「雑所得（公的年金等）」になります）。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>退職所得は「退職所得控除」という非常に大きな非課税枠が使えるため、iDeCoは全額一時金で受け取った方が税金が安くなるケースが多いです。</p>\n</div><div data-joushiki-copy=\"life-16\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">老後のために積み立てたお金を退職時などにまとめて受け取るので、給料よりも退職金に近い性質です。税金でも退職所得として優遇されます。</p></div>", "rel": [{"s": "一時金で受け取る老齢給付金は、退職所得として所得税の課税対象となる。", "c": true, "r": "2018.9-7-4", "u": "https://fp2-siken.com/kakomon/2018_9/07.html"}, {"s": "一時金で受け取る老齢給付金は、退職所得として所得税の課税対象となる。", "c": true, "r": "2018.5-7-3", "u": "https://fp2-siken.com/kakomon/2018_5/07.html"}, {"s": "一時金で受け取った老齢給付金は、退職所得として所得税の課税対象となる。", "c": true, "r": "2018.1-8-4", "u": "https://fp2-siken.com/kakomon/2018_1/08.html"}, {"s": "一時金で受け取る老齢給付金は、退職所得として所得税の課税対象となる。", "c": true, "r": "2017.1-8-4", "u": "https://fp2-siken.com/kakomon/2017_1/08.html"}, {"s": "一時金として受け取った老齢給付金は、退職所得として所得税の課税対象となる。", "c": true, "r": "2014.5-7-4", "u": "https://fp2-siken.com/kakomon/2014_5/07.html"}], "m": "老齢給付金を<b>一時金</b>で受け取ると<b>退職所得</b>／<b>年金</b>で受け取ると<b>雑所得</b>。", "url": "https://fp2-siken.com/kakomon/2021_5/08.html", "ref": "2021.5-8-3"}, {"uid": "life-20", "id": 20, "page": "life", "bunya": "ライフ", "freq": 6, "a": "中退共の掛金は、事業主と従業員の合意に基づき、<strong style='color: #d11a2a;'>事業主と従業員が折半して</strong>納付することができる。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">中退共は、中小企業が従業員の退職金を準備するための制度です。会社と従業員が話し合って合意すれば、毎月の掛金を<strong>半分ずつ負担</strong>して納められます。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">中小企業が、従業員へ渡す退職金を少しずつ準備する制度の話です。\n\n会社と従業員が話し合って決めれば、毎月の掛金を<strong>半分ずつ出せます</strong>。</div></div>", "ans": false, "k": "不適切。中退共（中小企業退職金共済）の掛金は<strong>事業主が全額負担</strong>します。従業員の負担はありません。\n掛金額は従業員1人につき月額<strong>5,000円〜30,000円</strong>の範囲で設定できます。\nひっかけポイントは「折半」という表現で、労使折半のルールがある社会保険と混同しやすいですが、中退共は会社側のみが全額を支払う制度です。<br><br>\n<div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>中退共（中小企業退職金共済）は、自前で退職金を用意できない中小企業が、国の制度を使って従業員の退職金を積み立てる制度です。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>中退共の掛金は「<strong style='color: #d11a2a;'>全額事業主負担</strong>」です。「事業主と従業員が折半して納付する」というのは健康保険などのルールを用いたフェイクです。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>掛金は全額経費（損金）になり、国から助成金も出るため、従業員の福利厚生として導入する中小企業が非常に多い制度です。</p>\n</div><div data-joushiki-copy=\"life-20\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">中退共は、事業主が従業員の退職金を用意する制度です。そのため掛金は<strong>全額を事業主が負担</strong>し、従業員に負担させることはできません。</p></div>", "rel": [{"s": "中小企業退職金共済の掛金は、事業主と従業員の合意に基づき、事業主と従業員が折半して負担することができる。", "c": false, "r": "2024.9-8-4", "u": "https://fp2-siken.com/kakomon/2024_9/08.html"}, {"s": "中小企業退職金共済の掛金は、事業主と被共済者の合意に基づき、事業主と被共済者が折半して負担することができる。", "c": false, "r": "2023.5-6-3", "u": "https://fp2-siken.com/kakomon/2023_5/06.html"}, {"s": "中小企業退職金共済の掛金は、原則として、事業主と従業員が折半して負担する。", "c": false, "r": "2021.9-7-1", "u": "https://fp2-siken.com/kakomon/2021_9/07.html"}, {"s": "中小企業退職金共済の掛金は、事業主と従業員が折半して負担する。", "c": false, "r": "2013.9-8-2", "u": "https://fp2-siken.com/kakomon/2013_9/08.html"}, {"s": "中小企業退職金共済の掛金は、事業主と従業員が折半して負担する。", "c": false, "r": "2013.5-8-2", "u": "https://fp2-siken.com/kakomon/2013_5/08.html"}], "m": "中退共の掛金は<b>全額を事業主が負担</b>。従業員との折半はできない。", "url": "https://fp2-siken.com/kakomon/2017_1/09.html", "ref": "2017.1-9-2"}, {"uid": "life2-8", "id": 8, "page": "life2", "bunya": "ライフ", "freq": 6, "a": "老齢厚生年金の繰下げ支給による年金の増額率は、繰り下げた月数に<strong style='color: #d11a2a;'>0.5％</strong>を乗じて得た率である。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">老齢厚生年金は、受け取り開始を遅らせるほど、毎月の年金額が増えます。増える割合は、繰り下げた月数に<strong>0.5％</strong>を掛けて計算します。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">会社員の上乗せ年金をすぐにもらわず、何カ月か待ってから受け取り始める場面です。\n\n待った月数が多いほど年金は増えます。1カ月につき<strong>0.5％</strong>ずつ増えます。</div></div>", "ans": false, "k": "不適切。老齢厚生年金の繰下げ支給による増額率は、繰下げた月数に<strong>0.7％</strong>を乗じて得た率です。\n0.5％ではありません。\n75歳まで120カ月繰り下げると、最大84％増額になります。<br><br>\n<div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\"><h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4><p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>繰下げ支給は、受給開始を後ろにずらした代わりに終身で年金額を増やす制度です。長生きリスクに備えたい人にとって、受給額を厚くする選択肢として設けられています。</p><p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>頻出なのは、古い数字や別制度の数字を混ぜる問題です。今の基準では<strong style='color: #0b63c5;'>1カ月あたり0.7％</strong>、<strong style='color: #0b63c5;'>最大84％</strong>で整理してください。</p><p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>退職後も生活費に余裕がある人は、繰下げによって終身年金額を増やす選択を検討します。実務では健康状態、就労収入、配偶者の年金とのバランスまで含めて判断します。</p></div><div data-joushiki-copy=\"life2-8\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">遅らせた月数に応じて増える仕組みまでは理解しやすいですが、率は感覚では決められません。⚠️ <strong>暗記寄り</strong>：1カ月当たり<strong>0.7％</strong>です。</p></div>", "rel": [{"s": "老齢基礎年金の繰下げ支給による年金の増額率は、繰り下げた月数に0.7％を乗じて得た率で、最大84％となる。", "c": true, "r": "2019.9-5-3", "u": "https://fp2-siken.com/kakomon/2019_9/05.html"}, {"s": "老齢厚生年金の繰下げ支給による年金の増額率は、繰り下げた月数に0.5％を乗じて得た率で、最大30％となる。", "c": false, "r": "2018.5-5-4", "u": "https://fp2-siken.com/kakomon/2018_5/05.html"}, {"s": "老齢厚生年金の繰下げ支給による年金の増額率は、繰り下げた月数に0.7％を乗じて得た率で、最大84％となる。", "c": true, "r": "2017.9-6-4", "u": "https://fp2-siken.com/kakomon/2017_9/06.html"}, {"s": "老齢厚生年金の繰下げ支給の増額率は、繰り下げた月数に0.7％を乗じて得た率（最大84％）となる。", "c": true, "r": "2015.1-6-4", "u": "https://fp2-siken.com/kakomon/2015_1/06.html"}, {"s": "老齢厚生年金の繰下げ支給の増額率は、繰り下げた月数に0.7％を乗じて得た率（最大84％）となる。", "c": true, "r": "2014.5-5-4", "u": "https://fp2-siken.com/kakomon/2014_5/05.html"}], "m": "繰下げの増額率は<b>1ヵ月あたり0.7％</b>（最大75歳・84％増）。繰上げの減額率が<b>0.4％</b>。", "url": "https://fp2-siken.com/kakomon/2025_1/04.html", "ref": "2025.1-4-1"}, {"uid": "finance2-8", "id": 8, "page": "finance2", "bunya": "金融", "freq": 6, "a": "ポートフォリオのリスクは、組み入れた各資産のリスクを<strong style='color: #d11a2a;'>組入比率で加重平均</strong>した値よりも大きくなる。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">値動きの異なる資産を組み合わせて、全体のリスクを考えます。その全体のリスクは、各資産のリスクを投資割合で平均した値よりも<strong>大きくなります</strong>。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">値動きが違ういくつかの商品へ、お金を分けて入れました。それぞれの商品の揺れを、入れた割合に合わせて平均した数字と比べます。\n\n組み合わせた全体のリスクは、その平均よりも<strong>大きくなります</strong>。</div></div>", "ans": false, "k": "これは<strong>不適切</strong>です。ポートフォリオのリスクは、相関係数が1でない限り、組み入れた各資産のリスクを組入比率で加重平均した値よりも 小さく なります。これを「ポートフォリオ効果」といいます。\n\nこのテーマは関連問題を含めて<strong>6回</strong>まとまっている頻出論点。要件・例外・できる／できないの区別が大事。<br><br>\n<div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>分散投資の最大の目的は「リスクを減らすこと」です。値動きの異なる資産を組み合わせることで、お互いのマイナスを打ち消し合います。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>ポートフォリオのリスクは、相関係数が+1でない限り、各資産のリスクを加重平均した値よりも「<strong style='color: #d11a2a;'>小さくなります</strong>」。「大きくなる」とするのが頻出のフェイクです。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>「卵は一つのカゴに盛るな」という投資の格言通り、リスクを分散させることで、期待リターンを維持しつつ全体のリスク（変動幅）を抑えることができます。</p>\n</div><div data-joushiki-copy=\"finance2-8\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">一つが下がるときに別の資産が支えれば、組合せ全体の揺れは小さくなります。通常は分散によって、単純な加重平均より<strong>リスクが小さくなる</strong>方向です。</p></div>", "rel": [{"s": "ポートフォリオのリスクは、組み入れた各資産のリスクを組入比率で加重平均した値以下となる。", "c": true, "r": "2024.1-27-2", "u": "https://fp2-siken.com/kakomon/2024_1/27.html"}, {"s": "ポートフォリオのリスクは、組み入れた各資産のリスクを組入比率で加重平均した値以下となる。", "c": true, "r": "2023.9-28-1", "u": "https://fp2-siken.com/kakomon/2023_9/28.html"}, {"s": "ポートフォリオのリスクは、組み入れた各資産のリスクを組入比率で加重平均した値以下となる。", "c": true, "r": "2022.5-28-4", "u": "https://fp2-siken.com/kakomon/2022_5/28.html"}, {"s": "ポートフォリオのリスクは、組み入れた各資産のリスクを組入比率で加重平均した値よりも大きくなる。", "c": false, "r": "2021.1-27-4", "u": "https://fp2-siken.com/kakomon/2021_1/27.html"}, {"s": "ポートフォリオのリスクは、組み入れた各資産のリスクを組入比率で加重平均した値よりも大きくなる。", "c": false, "r": "2020.1-27-3", "u": "https://fp2-siken.com/kakomon/2020_1/27.html"}], "m": "ポートフォリオのリスクは、各資産のリスクを加重平均した値<b>以下</b>になる。これが<b>分散投資の効果</b>。", "url": "https://fp2-siken.com/kakomon/2025_1/28.html", "ref": "2025.1-28-3"}, {"uid": "finance2-11", "id": 11, "page": "finance2", "bunya": "金融", "freq": 6, "a": "一般に、<strong style='color: #0b63c5;'>市場金利が上昇すると債券価格は下落</strong>し、市場金利が低下すると債券価格は上昇する。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">すでに発行されている債券の価格と、世の中の金利は反対に動きます。<strong>市場金利が上がると債券価格は下がり</strong>、市場金利が下がると債券価格は上がります。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">すでに売られている債券の値段は、世の中の金利が動くと一緒に変わります。ただし、二つは同じ方向には動きません。\n\n<strong>金利が上がれば債券は安くなり、金利が下がれば高くなります</strong>。</div></div>", "ans": true, "k": "これは<strong>適切</strong>です。\n固定利付債券の利息（クーポン）は変わらないので、市場金利が上がると「新しい債券の方が利回りがいい」→既存の債券の魅力が下がり、価格が<strong>下落</strong>します。\n逆に市場金利が下がると、「既存の債券のクーポンの方がお得」→価格が<strong>上昇</strong>します。\n覚え方：金利と債券価格は<strong>シーソーの関係</strong>（逆方向に動く）です。これはFP試験の超頻出テーマです。<br><br>\n<div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>市場金利と債券価格は「シーソーの関係」にあります。世の中の金利が上がると、昔に発行された金利の低い債券は魅力がなくなり、価格が下がります。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>「<strong style='color: #0b63c5;'>市場金利が上昇すると債券価格は下落する</strong>」という逆相関の関係は、金融分野で最も重要な基礎知識として必ず出題されます。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>日銀が金利を引き上げると、すでに発行されている国債の価格が下落し、大量に国債を保有している銀行が含み損を抱えることになります。</p>\n</div><div data-joushiki-copy=\"finance2-11\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">新しい債券の金利が高くなれば、古い低金利の債券は値下げしないと買ってもらいにくくなります。反対の動きになる理由をこの場面で考えると覚えやすいです。</p></div>", "rel": [{"s": "市場金利の上昇は債券価格の下落要因となり、市場金利の低下は債券価格の上昇要因となる。", "c": true, "r": "2025.5-24-1", "u": "https://fp2-siken.com/kakomon/2025_5/24.html"}, {"s": "市場金利が上昇すると債券価格は下落し、市場金利が低下すると債券価格は上昇する。", "c": true, "r": "2021.3-23-3", "u": "https://fp2-siken.com/kakomon/2021_3/23.html"}, {"s": "市場金利の上昇は債券価格の上昇要因となり、市場金利の低下は債券価格の下落要因となる。", "c": false, "r": "2019.1-23-2", "u": "https://fp2-siken.com/kakomon/2019_1/23.html"}, {"s": "市場金利の上昇は債券価格の上昇要因となり、市場金利の低下は債券価格の下落要因となる。", "c": false, "r": "2018.5-23-1", "u": "https://fp2-siken.com/kakomon/2018_5/23.html"}, {"s": "一般に、市場金利が上昇すると債券価格は下落し、市場金利が下落すると債券価格は上昇する。", "c": true, "r": "2014.9-25-4", "u": "https://fp2-siken.com/kakomon/2014_9/25.html"}], "m": "<b>金利上昇 → 債券価格は下落</b>／<b>金利低下 → 債券価格は上昇</b>（逆に動く）。", "url": "https://fp2-siken.com/kakomon/2017_1/23.html", "ref": "2017.1-23-1"}, {"uid": "tax-29", "id": 29, "page": "tax", "bunya": "タックス", "freq": 6, "a": "住宅ローン控除の対象となる借入金は、契約による償還期間が<strong style='color: #0b63c5;'>10年以上</strong>のものに限られる。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">住宅ローン控除は、長い期間をかけて返す住宅ローンを対象にしています。控除の対象になる借入れは、契約上の返済期間が<strong>10年以上</strong>のものに限られます。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">家を買うためにお金を借りても、短期間ですぐ返すローンまで住宅ローン控除の対象になるわけではありません。長く返していく契約であることが必要です。\n\n契約上の返済期間が<strong>10年以上</strong>のローンが対象です。</div></div>", "ans": true, "k": "✅ <strong>適切</strong>です。<br><br>住宅ローン控除の対象となるには、ローンの返済期間が「<span style='background: linear-gradient(transparent 70%, #fff3e0 70%); font-weight: bold;'>10年以上</span>」でなければなりません。<br>・<strong>背景:</strong> 短期間でパッと返せるような資金力のある人には、優遇は必要ないという考え方です。<br><br><div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>住宅ローン控除は長期返済を前提とした制度なので、短期借入れは対象外です。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>借入期間は『10年以上』が必要です。8年や9年では使えません。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>繰上返済で残存期間が10年未満になると以後の控除が受けられなくなる点も関連して押さえるべきです。</p>\n</div><div data-joushiki-copy=\"tax-29\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">短期間だけ借りたお金まで、長期の住宅取得支援と同じように優遇しない考え方は自然です。⚠️ <strong>10年以上</strong>という期間は暗記寄りです。</p></div>", "rel": [{"s": "住宅ローン控除の対象となる借入金は、契約による償還期間が15年以上のものに限られる。", "c": false, "r": "2022.5-35-1", "u": "https://fp2-siken.com/kakomon/2022_5/35.html"}, {"s": "住宅ローン控除の対象となる借入金は、契約による償還期間が20年以上のものに限られる。", "c": false, "r": "2020.1-35-1", "u": "https://fp2-siken.com/kakomon/2020_1/35.html"}, {"s": "住宅ローン控除の対象となる借入金等の契約による償還期間は、20年以上でなければならない。", "c": false, "r": "2018.1-35-2", "u": "https://fp2-siken.com/kakomon/2018_1/35.html"}, {"s": "住宅ローン控除の対象となる住宅借入金等については、契約においてその償還期間または賦払期間が10年以上でなければならない。", "c": true, "r": "2016.1-36-2", "u": "https://fp2-siken.com/kakomon/2016_1/36.html"}, {"s": "住宅ローン控除の対象となる住宅借入金等の契約における償還期間は、15年以上でなければならない。", "c": false, "r": "2014.1-36-2", "u": "https://fp2-siken.com/kakomon/2014_1/36.html"}], "m": "住宅ローン控除の対象となる借入金は<b>償還期間10年以上</b>のもの。", "url": "https://fp2-siken.com/kakomon/2024_5/35.html", "ref": "2024.5-35-3"}, {"uid": "tax-30", "id": 30, "page": "tax", "bunya": "タックス", "freq": 6, "a": "給与所得の金額は、原則として、その年中の「<strong style='color: #0b63c5;'>給与等の収入金額－給与所得控除額</strong>」の算式により計算される。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">会社から受け取った額面の給与が、そのまま給与所得になるわけではありません。原則として、一年間の給与収入から、会社員の必要経費に当たる<strong>給与所得控除を引いて</strong>計算します。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">会社員にも、仕事をするための費用がかかります。ただし、使った文房具代などを一つずつ計算するのではなく、決められた額をまとめて引きます。\n\n原則として、一年間の給料から<strong>給与所得控除を引いた残りが給与所得</strong>です。</div></div>", "ans": true, "k": "✅ <strong>適切</strong>です。<br><br>給与所得は、「<span style='background: linear-gradient(transparent 70%, #fff3e0 70%); font-weight: bold;'>給与等の収入金額（額面） − 給与所得控除額（みなし経費）</span>」で計算されます。<br>・<strong>仕組み:</strong> サラリーマンはスーツ代などの経費を細かく計算するのが大変なので、年収に応じて自動的に決まる「給与所得控除額」という概算の経費を引いてもらえます。<br><br><div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>給与所得控除はサラリーマンの概算経費として設けられており、個別の経費計算を簡略化しています。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>給与所得は『収入−給与所得控除』で、ここに1/2は掛けません。退職所得や一時所得と混同しやすいです。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>年収の見積りをするときは、額面収入と課税対象の給与所得を分けて考える必要があります。</p>\n</div><div data-joushiki-copy=\"tax-30\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">会社員にも仕事のための出費はあるため、一人ずつ実費を計算する代わりに、収入に応じた概算額を引く仕組みだと考えると分かりやすいです。</p></div>", "rel": [{"s": "給与所得の金額は、原則として、給与等の収入金額から給与所得控除額を控除して計算される。", "c": true, "r": "2021.3-33-3", "u": "https://fp2-siken.com/kakomon/2021_3/33.html"}, {"s": "給与所得の金額は、「（給与等の収入金額－給与所得控除額）×1／2」の算式により計算される。", "c": false, "r": "2021.1-32-1", "u": "https://fp2-siken.com/kakomon/2021_1/32.html"}, {"s": "給与所得の金額は、原則として、「給与等の収入金額－給与所得控除額」の算式により計算される。", "c": true, "r": "2020.1-32-2", "u": "https://fp2-siken.com/kakomon/2020_1/32.html"}, {"s": "給与所得の金額は、原則として、収入金額からその収入金額に応じて計算される給与所得控除額を控除して計算される。", "c": true, "r": "2019.1-33-1", "u": "https://fp2-siken.com/kakomon/2019_1/33.html"}, {"s": "給与所得の金額は、「（その年中の給与等の収入金額－給与所得控除額）×1／2」の算式により計算される。", "c": false, "r": "2015.10-32-1", "u": "https://fp2-siken.com/kakomon/2015_10/32.html"}], "m": "<b>給与所得 ＝ 給与等の収入金額 − 給与所得控除額</b>", "url": "https://fp2-siken.com/kakomon/2023_1/32.html", "ref": "2023.1-32-2"}, {"uid": "tax2-16", "id": 16, "page": "tax2", "bunya": "タックス", "freq": 6, "a": "損益計算書において、<strong style='color: #0b63c5;'>経常利益</strong>の額は、営業利益の額に営業外損益の額を加減した額である。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">経常利益は、本業の利益に、利息や配当など本業以外の日常的な収益・費用も加えた数字です。<strong>営業利益に営業外損益を足し引きして</strong>計算します。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">会社の本業だけで残った利益が「営業利益」です。そこへ、受取利息や借入金の利息など、ふだん生じる本業以外のお金も入れます。\n\n<strong>営業利益に営業外の収益と費用を足し引きしたものが経常利益</strong>です。</div></div>", "ans": true, "k": "✅ <strong>適切</strong>です。<br><br>経常利益は、営業利益（本業の儲け）に「<span style='background: linear-gradient(transparent 70%, #fff3e0 70%); font-weight: bold;'>営業外収益（受取利息など）と営業外費用（支払利息など）</span>」を加減して計算します。<br>・<strong>利益の階段:</strong> 売上総利益 → 営業利益 → 経常利益（ケイツネ） → 税引前当期純利益 と段階的に計算されます。<br><br><div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>経常利益は、本業の利益に営業外損益を加減した通常活動ベースの利益です。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>営業利益と経常利益の順序を逆にする出題が定番です。特別損益はここに入りません。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>融資判断や企業分析では、経常利益を見ることで本業以外も含めた継続収益力を把握できます。</p>\n</div><div data-joushiki-copy=\"tax2-16\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">本業だけの成績が営業利益で、そこへ借入利息など普段から生じる本業外の損益を含めると経常利益になる、と順番で考えます。</p></div>", "rel": [{"s": "損益計算書の税引前当期純利益の額は、経常利益の額に営業外損益の額を加算・減算した額である。", "c": false, "r": "2023.9-40-2", "u": "https://fp2-siken.com/kakomon/2023_9/40.html"}, {"s": "損益計算書において、経常利益の額は、営業利益の額に特別利益・特別損失の額を加算・減算した額である。", "c": false, "r": "2023.5-40-2", "u": "https://fp2-siken.com/kakomon/2023_5/40.html"}, {"s": "損益計算書の税引前当期純利益の額は、営業利益の額から特別損益の額を加算・減算した額である。", "c": false, "r": "2022.9-40-3", "u": "https://fp2-siken.com/kakomon/2022_9/40.html"}, {"s": "損益計算書の経常利益の額は、営業利益の額に営業外収益・営業外費用の額を加算・減算した額である。", "c": true, "r": "2021.9-40-2", "u": "https://fp2-siken.com/kakomon/2021_9/40.html"}, {"s": "損益計算書において、経常利益の額は、営業利益の額に営業外収益・営業外費用の額を加算・減算した額である。", "c": true, "r": "2020.9-40-1", "u": "https://fp2-siken.com/kakomon/2020_9/40.html"}], "m": "<b>経常利益 ＝ 営業利益 ± 営業外損益</b>", "url": "https://fp2-siken.com/kakomon/2025_1/40.html", "ref": "2025.1-40-4"}, {"uid": "tax2-20", "id": 20, "page": "tax2", "bunya": "タックス", "freq": 6, "a": "不動産所得の金額は、原則として、「<strong style='color: #0b63c5;'>不動産所得に係る総収入金額－必要経費</strong>」の算式により計算される。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">アパートの家賃などによる不動産所得は、受け取った家賃の全額ではありません。原則として、家賃などの総収入から修繕費や減価償却費などの<strong>必要経費を引いて</strong>計算します。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">アパート経営では、家賃を受け取るだけでなく、修理代や建物の価値が減った分などの費用もかかります。受け取った家賃の全額が、そのまま所得になるわけではありません。\n\n原則として、家賃などの収入から<strong>必要な経費を引いた残りが不動産所得</strong>です。</div></div>", "ans": true, "k": "✅ <strong>適切</strong>です。<br><br>不動産所得の金額は「<span style='background: linear-gradient(transparent 70%, #fff3e0 70%); font-weight: bold;'>総収入金額 − 必要経費</span>」で計算されます。<br>・<strong>基礎知識:</strong> 家賃収入の全額に税金がかかるわけではなく、修繕費や固定資産税などの「経費」を引いた残りの利益に対して課税されます。<br><br><div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>不動産所得は、賃料などの総収入から必要経費を引いた利益に課税する仕組みです。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>総収入金額そのものに課税されるわけではありません。減価償却費や固定資産税も必要経費に入ります。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>アパート経営の収支表を作るときは、家賃収入と経費を分けて税引前利益を見ます。</p>\n</div><div data-joushiki-copy=\"tax2-20\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">家賃を得るためには建物の維持費や税金などもかかります。収入から、その収入に必要な費用を引いた残りを所得とするのは自然です。</p></div>", "rel": [{"s": "不動産所得の金額は、原則として、その年中の「不動産所得に係る総収入金額－必要経費」の算式により計算される。", "c": true, "r": "2023.1-32-3", "u": "https://fp2-siken.com/kakomon/2023_1/32.html"}, {"s": "不動産所得の金額は、原則として、「不動産所得に係る総収入金額－必要経費」の算式により計算される。", "c": true, "r": "2022.9-31-1", "u": "https://fp2-siken.com/kakomon/2022_9/31.html"}, {"s": "公的年金等以外のものに係る雑所得の金額は、「（公的年金等以外の雑所得に係る総収入金額－必要経費）×1／2」の算式により計算される。", "c": false, "r": "2021.1-32-3", "u": "https://fp2-siken.com/kakomon/2021_1/32.html"}, {"s": "不動産所得の金額は、原則として、「不動産所得に係る総収入金額－必要経費」の算式により計算される。", "c": true, "r": "2020.1-32-4", "u": "https://fp2-siken.com/kakomon/2020_1/32.html"}, {"s": "不動産所得の金額は、「不動産所得に係る総収入金額－必要経費」の算式により計算される。", "c": true, "r": "2017.5-32-1", "u": "https://fp2-siken.com/kakomon/2017_5/32.html"}], "m": "<b>不動産所得 ＝ 総収入金額 − 必要経費</b>", "url": "https://fp2-siken.com/kakomon/2023_5/32.html", "ref": "2023.5-32-2"}, {"uid": "inheritance-14", "id": 14, "page": "inheritance", "bunya": "相続", "freq": 6, "a": "贈与税の納付について認められる延納期間は、<strong style='color: #d11a2a;'>最長10年</strong>である。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">贈与税は原則一括払いですが、条件を満たすと分割して納める延納を利用できます。その分割払いの期間は、最長<strong>10年</strong>です。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">贈与税はまとめて払うのが基本ですが、条件に合えば何年かに分けて払えます。これを延納といいます。\n\n分けて払える期間は最長<strong>10年</strong>です。</div></div>", "ans": false, "k": "これは不適切。10年ではありません。贈与税は申告期限までの一括納付を原則としますが、納付すべき贈与税額が 10 万円を超え、かつ、金銭で納付することが困難な理由がある場合には最長 5 年の分割納付（延納）ができます。\n\nこのテーマは関連問題を含めて<strong>6回</strong>まとまっている頻出論点。数字・年齢・期間・上限額などの条件整理が大事。<br><br>\n<div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>贈与税は原則として現金一括払いですが、どうしても払えない場合の救済措置として「延納（分割払い）」が認められています。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>贈与税の延納期間は最長で「<strong style='color: #d11a2a;'>5年</strong>」です。相続税の延納期間（最長20年など）と数字を入れ替えたフェイクです。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>不動産などの現金化しづらいものを贈与された場合、一括で税金が払えずに延納を利用することがありますが、利子税（金利）がかかるため注意が必要です。（※贈与税に物納はありません）。</p>\n</div><div data-joushiki-copy=\"inheritance-14\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">支払いを待ってもらえる年数は、制度ごとに決められていて常識では判断できません。⚠️ <strong>暗記寄り</strong>：贈与税の延納は最長<strong>5年</strong>です。</p></div>", "rel": [{"s": "贈与税の納付について認められる延納期間は、最長で5年である。", "c": true, "r": "2022.5-54-4", "u": "https://fp2-siken.com/kakomon/2022_5/54.html"}, {"s": "贈与税の納付について認められる延納期間は、最長で5年である。", "c": true, "r": "2021.3-53-3", "u": "https://fp2-siken.com/kakomon/2021_3/53.html"}, {"s": "贈与税の納付について認められる延納期間は、最長で10年間である。", "c": false, "r": "2018.5-53-3", "u": "https://fp2-siken.com/kakomon/2018_5/53.html"}, {"s": "贈与税の納付について認められる延納期間は、最長で10年である。", "c": false, "r": "2016.5-53-4", "u": "https://fp2-siken.com/kakomon/2016_5/53.html"}, {"s": "贈与税の納付について認められる延納期間は、最長で5年間である。", "c": true, "r": "2015.5-53-3", "u": "https://fp2-siken.com/kakomon/2015_5/53.html"}], "m": "贈与税の延納期間は<b>最長5年</b>。（相続税は原則5年、不動産等の割合により最長20年）", "url": "https://fp2-siken.com/kakomon/2023_9/53.html", "ref": "2023.9-53-4"}, {"uid": "inheritance-15", "id": 15, "page": "inheritance", "bunya": "相続", "freq": 6, "a": "死因贈与とは、贈与者の死亡によって効力が生じる贈与をいい、<strong style='color: #d11a2a;'>贈与者のみの意思表示により成立</strong>する。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">死因贈与は、「自分が亡くなったら、この財産をあげる」と決めておく方法です。財産をあげる人が<strong>一方的に意思を示すだけ</strong>で成立し、受け取る人の同意は必要ありません。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">「自分が亡くなったら、この財産をあなたにあげます」と決めるのが死因贈与です。受け取る予定の人は、まだ了承していません。\n\nあげる人が<strong>一人で決めるだけ</strong>で成立します。</div></div>", "ans": false, "k": "これは不適切。死因贈与は贈与契約の一つなので、贈与の申出に対し、受贈者となる者が承諾することが成立の要件となっています。遺贈のように贈与者の意思表示だけでは効力は生じません。\n\nこのテーマは関連問題を含めて<strong>6回</strong>まとまっている頻出論点。要件・例外・できる／できないの区別が大事。<br><br>\n<div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>死因贈与は「私が死んだらこの財産をあなたにあげます」という約束であり、遺贈と似ていますが法的性質が異なります。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>死因贈与は「契約」であるため、贈与者だけでなく受贈者の「<strong style='color: #d11a2a;'>承諾（合意）</strong>」が必要です。「贈与者のみの意思表示（単独行為）」で成立するのは「遺贈（遺言による贈与）」です。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>「俺が死んだら愛人に家をやる」という書面を残す場合、遺言書（遺贈）なら愛人に内緒で一方的に作れますが、死因贈与契約の場合は愛人のサイン（合意）も必要になります。</p>\n</div><div data-joushiki-copy=\"inheritance-15\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">名前に贈与とある以上、相手が受け取る約束も必要だと考えられます。死因贈与は契約なので双方の合意が必要で、一方的にできる遺贈と区別します。</p></div>", "rel": [{"s": "死因贈与とは、贈与者の死亡によって効力が生じる贈与をいう。", "c": true, "r": "2019.5-51-4", "u": "https://fp2-siken.com/kakomon/2019_5/51.html"}, {"s": "死因贈与契約は、贈与者の死亡によってその効力を生じる。", "c": true, "r": "2018.5-51-3", "u": "https://fp2-siken.com/kakomon/2018_5/51.html"}, {"s": "死因贈与契約は、贈与者の死亡によってその効力を生じる。", "c": true, "r": "2017.5-51-4", "u": "https://fp2-siken.com/kakomon/2017_5/51.html"}, {"s": "死因贈与とは、贈与者の死亡によって効力を生ずる贈与をいう。", "c": true, "r": "2015.1-51-3", "u": "https://fp2-siken.com/kakomon/2015_1/51.html"}, {"s": "死因贈与とは、贈与者の死亡によって効力を生ずる贈与のことをいう。", "c": true, "r": "2013.9-51-1", "u": "https://fp2-siken.com/kakomon/2013_9/51.html"}], "m": "死因贈与は<b>契約</b>なので<b>受贈者の承諾が必要</b>。単独行為で成立するのは<b>遺贈</b>。", "url": "https://fp2-siken.com/kakomon/2023_9/51.html", "ref": "2023.9-51-3"}, {"uid": "inheritance-17", "id": 17, "page": "inheritance", "bunya": "相続", "freq": 6, "a": "公正証書遺言を作成する場合において、遺言者の配偶者は証人として<strong style='color: #0b63c5;'>立ち会うことはできない</strong>。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">公正証書遺言を作るときは、内容や本人の意思を確認する証人が必要です。遺言者の<strong>配偶者は利害関係があるため、証人にはなれません</strong>。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">公正証書遺言を作るときは、本人の意思や手続を見届ける証人が必要です。遺言を残す人の配偶者を、証人にしようとしています。\n\n配偶者は利害関係があるので<strong>証人にはなれません</strong>。</div></div>", "ans": true, "k": "【適切】遺言者の配偶者は推定相続人にあたるため、公正証書遺言の証人にはなれません。未成年者・推定相続人・受遺者・その配偶者・直系血族は全員NGです。Q13とセットで覚えましょう。利害関係者を排除することで遺言の公正さを担保する仕組みです。<br><br>\n<div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>公正証書遺言を作るときには、遺言者の書いた内容が嘘や強要でないことを確認するため、2名以上の「証人」の立ち会いが必要です。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>遺言者の「<strong style='color: #0b63c5;'>配偶者</strong>」や、未成年者、推定相続人（将来遺産をもらう人）などは、利害関係が強すぎるため証人になることはできません。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>実務では、遺言内容の秘密を守るためや利害関係のトラブルを防ぐため、公証役場で手配してもらった見知らぬ第三者や、担当の弁護士・行政書士が証人になるのが一般的です。</p>\n</div><div data-joushiki-copy=\"inheritance-17\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">遺産を受け取る可能性が高い人が証人では、中立性に疑問が出ます。利害関係の強い配偶者を外すのは自然です。</p></div>", "rel": [{"s": "公正証書遺言の作成において、遺言者の配偶者は証人として立ち会うことができない。", "c": true, "r": "2024.5-56-1", "u": "https://fp2-siken.com/kakomon/2024_5/56.html"}, {"s": "公正証書遺言の作成において、遺言者の推定相続人とその配偶者は証人として立ち会うことができない。", "c": true, "r": "2023.9-56-3", "u": "https://fp2-siken.com/kakomon/2023_9/56.html"}, {"s": "公正証書遺言を作成した遺言者は、その遺言を自筆証書遺言によって撤回することができる。", "c": true, "r": "2023.5-54-2", "u": "https://fp2-siken.com/kakomon/2023_5/54.html"}, {"s": "公正証書遺言を作成する場合において、遺言者の推定相続人は、証人として立ち会うことができない。", "c": true, "r": "2022.5-56-4", "u": "https://fp2-siken.com/kakomon/2022_5/56.html"}, {"s": "公正証書遺言の作成時において、遺言者の配偶者が証人として立ち会うことはできない。", "c": true, "r": "2014.1-54-2", "u": "https://fp2-siken.com/kakomon/2014_1/54.html"}], "m": "公正証書遺言の証人になれないのは、未成年者・<b>推定相続人・受遺者およびその配偶者・直系血族</b>・公証人の配偶者等。配偶者は推定相続人なので不可。", "url": "https://fp2-siken.com/kakomon/2020_9/54.html", "ref": "2020.9-54-4"}, {"uid": "life-23", "id": 23, "page": "life", "bunya": "ライフ", "freq": 5, "a": "労働者災害補償保険の適用を受ける労働者には、雇用形態が<strong style='color: #0b63c5;'>アルバイトやパートタイマーである者も含まれる</strong>。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">労災保険は、仕事中や通勤中のけがなどを補償する制度です。正社員だけでなく、<strong>アルバイトやパート</strong>として働く人も補償の対象に含まれます。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">アルバイトやパートでも、仕事中や通勤中にけがをすることはあります。\n\n労災保険は正社員だけのものではありません。<strong>アルバイトやパートも対象です</strong>。</div></div>", "ans": true, "k": "これは適切。労災保険の適用を受ける労働者は、事業主に使用され、賃金の支払いを受ける人全員です。したがって、パートタイマー、アルバイト、在宅労働者、日雇労働者といった雇用形態の違いや労働時間の長短にかかわらず、事業主と雇用関係にあるすべての者に適用されます。\n\nこのテーマは関連問題を含めて<strong>5回</strong>まとまっている頻出論点。要件・例外・できる／できないの区別が大事。<br><br>\n<div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>労働者災害補償保険（労災保険）は、仕事中や通勤途中にケガや病気をした人を守るための保険で、雇われている人全員が対象になります。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>労災保険の対象には「<strong style='color: #0b63c5;'>アルバイトやパートタイマーである者も含まれる</strong>」のが大原則です。「正規雇用のみ」とするフェイクがよく出ます。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>たとえ入社1日目のアルバイトが仕事中にケガをしても、労災保険から治療費が全額出ますし、会社側も保険料を全額負担する義務があります。</p>\n</div><div data-joushiki-copy=\"life-23\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">雇用形態が違っても、仕事が原因でけがをする危険は同じです。勤務先に雇われて働く人を広く守る制度だと考えると判断しやすいです。</p></div>", "rel": [{"s": "労働者災害補償保険の適用を受ける労働者には、雇用形態がアルバイトやパートタイマーである者も含まれる。", "c": true, "r": "2023.5-3-1", "u": "https://fp2-siken.com/kakomon/2023_5/03.html"}, {"s": "労災保険の適用を受ける労働者には、雇用形態がアルバイトやパートタイマーである者は含まれるが、日雇労働者や外国人労働者は含まれない。", "c": false, "r": "2023.1-4-2", "u": "https://fp2-siken.com/kakomon/2023_1/04.html"}, {"s": "労災保険の適用を受ける労働者には、雇用形態がアルバイトやパートタイマーである者は含まれない。", "c": false, "r": "2021.9-3-1", "u": "https://fp2-siken.com/kakomon/2021_9/03.html"}, {"s": "労災保険の適用を受ける労働者には、雇用形態がアルバイトやパートタイマーである者は含まれない。", "c": false, "r": "2016.9-2-1", "u": "https://fp2-siken.com/kakomon/2016_9/02.html"}], "m": "労災は<b>アルバイト・パートを含むすべての労働者</b>が適用対象。", "url": "https://fp2-siken.com/kakomon/2025_5/03.html", "ref": "2025.5-3-1"}, {"uid": "life-29", "id": 29, "page": "life", "bunya": "ライフ", "freq": 5, "a": "第2号被保険者の被扶養配偶者である20歳以上<strong style='color: #d11a2a;'>65歳未満</strong>の者は、第3号被保険者となる。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">会社員などの第2号被保険者に扶養されている配偶者は、国民年金の第3号被保険者になります。その配偶者の年齢は、<strong>20歳以上65歳未満</strong>です。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">会社員などに生活を支えてもらっている配偶者は、年金では「第3号」というグループに入ります。\n\nその配偶者の年齢は<strong>20歳以上65歳未満</strong>です。</div></div>", "ans": false, "k": "これは不適切。第3号被保険者となるのは、第2号被保険者の被扶養配偶者で20歳以上 60 歳未満の者です。第3号被保険者は個別に保険料を納める必要はなく、第2号被保険者である配偶者が加入している厚生年金等で負担されます。\n\nこのテーマは関連問題を含めて<strong>5回</strong>まとまっている頻出論点。数字・年齢・期間・上限額などの条件整理が大事。<br><br>\n<div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>国民年金の被保険者の種類（1号・2号・3号）に関する基本問題です。第2号被保険者（会社員や公務員）に扶養されている配偶者（専業主婦など）が第3号被保険者となります。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>「第2号被保険者の被扶養配偶者である20歳以上<strong style='color: #d11a2a;'>65歳未満</strong>の者」ではなく、「20歳以上<strong style='color: #d11a2a;'>60歳未満</strong>の者」が第3号被保険者となります。年齢要件のフェイクです。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>専業主婦が60歳になった誕生日で、国民年金の第3号被保険者からは自動的に外れ、以後は保険料を払う義務（実質タダで年金加入期間が増えるメリット）が終了します。</p>\n</div><div data-joushiki-copy=\"life-29\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">第3号は、第2号に扶養される配偶者のための区分です。⚠️ <strong>暗記寄り</strong>：年齢は原則<strong>20歳以上60歳未満</strong>で、65歳未満ではありません。</p></div>", "rel": [{"s": "第2号被保険者の被扶養配偶者である19歳の専業主婦は、第3号被保険者である。", "c": false, "r": "2019.1-5-1", "u": "https://fp2-siken.com/kakomon/2019_1/05.html"}, {"s": "第2号被保険者の被扶養配偶者である62歳の妻は、第3号被保険者である。", "c": false, "r": "2016.5-4-1", "u": "https://fp2-siken.com/kakomon/2016_5/04.html"}, {"s": "第3号被保険者は、第2号被保険者の被扶養配偶者で、20歳以上60歳未満の者である。", "c": true, "r": "2015.5-5-3", "u": "https://fp2-siken.com/kakomon/2015_5/05.html"}, {"s": "第3号被保険者は、第2号被保険者の被扶養配偶者で、20歳以上60歳未満の者である。", "c": true, "r": "2013.5-6-2", "u": "https://fp2-siken.com/kakomon/2013_5/06.html"}], "m": "第3号被保険者は、第2号の被扶養配偶者で<b>20歳以上60歳未満</b>の者。65歳未満ではない。", "url": "https://fp2-siken.com/kakomon/2021_3/04.html", "ref": "2021.3-4-2"}, {"uid": "life-32", "id": 32, "page": "life", "bunya": "ライフ", "freq": 5, "a": "基本手当の受給期間は、原則として、離職の日の翌日から起算して<strong style='color: #d11a2a;'>1年6カ月</strong>である。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">雇用保険の基本手当には、決められた給付日数とは別に、受け取りを終えなければならない期限があります。その期限は、原則として退職日の翌日から<strong>1年6カ月</strong>です。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">失業手当には「何日分もらえるか」だけでなく、「いつまでにもらい終えるか」という期限もあります。\n\nその期限は原則、退職日の翌日から<strong>1年6カ月</strong>です。</div></div>", "ans": false, "k": "不適切。基本手当（失業給付）の受給期間は、原則として<strong>離職の日の翌日から1年間</strong>です。1年6カ月ではありません。\n所定給付日数（90日〜360日等）は、この1年の受給期間内で消化することになります。\n「1年6カ月」は傷病手当金の最長受給期間などに登場する数字で混同しやすいため、正確に覚えましょう。<br><br>\n<div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>基本手当（失業手当）は、いつまでもダラダラもらえるわけではなく、もらい切らなければならない期限が決められています。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>原則として離職の日の翌日から起算して「<strong style='color: #d11a2a;'>1年6カ月</strong>」ではなく、「<strong style='color: #d11a2a;'>1年（1年間）</strong>」です。この数字の入れ替えが非常に多いです。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>会社を辞めてから手続きをせずに1年が過ぎてしまうと、まだもらえるはずの日数が残っていても、すべて消滅してしまいます。</p>\n</div><div data-joushiki-copy=\"life-32\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">失業手当を何年もあとから受け取れる制度ではなく、期限があることは想像できます。⚠️ <strong>暗記寄り</strong>：原則の受給期間は<strong>1年間</strong>で、1年6カ月ではありません。</p></div>", "rel": [{"s": "基本手当の受給期間は、原則として、離職の日の翌日から起算して1年である。", "c": true, "r": "2019.9-3-3", "u": "https://fp2-siken.com/kakomon/2019_9/03.html"}, {"s": "基本手当の受給期間は、原則として、離職の日の翌日から起算して2年である。", "c": false, "r": "2018.1-5-2", "u": "https://fp2-siken.com/kakomon/2018_1/05.html"}, {"s": "雇用保険の基本手当の受給期間は、原則として、離職の日の翌日から起算して2年である。", "c": false, "r": "2017.9-5-4", "u": "https://fp2-siken.com/kakomon/2017_9/05.html"}, {"s": "基本手当の受給期間は、原則として、離職の日の翌日から起算して1年間である。", "c": true, "r": "2015.5-4-3", "u": "https://fp2-siken.com/kakomon/2015_5/04.html"}], "m": "基本手当の受給期間は、離職の日の翌日から<b>原則1年</b>。（1年6ヵ月ではない）", "url": "https://fp2-siken.com/kakomon/2015_10/04.html", "ref": "2015.10-4-2"}, {"uid": "life-33", "id": 33, "page": "life", "bunya": "ライフ", "freq": 5, "a": "中小企業退職金共済の掛金月額は、被共済者1人当たり<strong style='color: #d11a2a;'>6万8,000円</strong>が上限となっている。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">中退共では、中小企業が従業員一人ひとりの退職金に向けて、毎月掛金を納めます。従業員1人につき、毎月出せる掛金の上限は<strong>6万8,000円</strong>です。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">中小企業が、従業員ごとに毎月お金を積み立て、将来の退職金を用意する場面です。\n\n従業員1人につき出せる掛金は、月<strong>6万8,000円まで</strong>です。</div></div>", "ans": false, "k": "不適切。中小企業退職金共済（中退共）の掛金月額の上限は、被共済者1人当たり<strong>30,000円（3万円）</strong>です。\n6万8,000円はiDeCoや企業型DCの別の上限額と混同しやすいひっかけ数字です。\n「中退共の掛金は月5,000円〜30,000円」という範囲ごとセットで覚えるのがおすすめです。<br><br>\n<div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>中退共（中小企業退職金共済）は、自前で退職金を用意できない中小企業が従業員のために掛金を出す国の制度です。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>掛金月額の上限は「<strong style='color: #d11a2a;'>6万8,000円</strong>」ではなく「<strong style='color: #d11a2a;'>3万円</strong>」です。6万8,000円というのは「個人型確定拠出年金（iDeCo）」の第1号被保険者などの限度額の数字であり、フェイクとして出題されます。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>掛金は全額会社の経費になるため、上限の3万円（年間36万円）まで掛けて従業員の福利厚生を手厚くする会社が多いです。</p>\n</div><div data-joushiki-copy=\"life-33\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">制度ごとに掛金上限が違うため、日常感覚だけで数字を当てるのは難しいです。⚠️ <strong>暗記寄り</strong>：中退共は月<strong>5,000円から3万円</strong>で、6万8,000円は別制度の数字です。</p></div>", "rel": [{"s": "中小企業退職金共済の掛金は、事業主が全額負担し、掛金月額は被共済者1人当たり3万円が上限となる。", "c": true, "r": "2025.1-6-3", "u": "https://fp2-siken.com/kakomon/2025_1/06.html"}, {"s": "中小企業退職金共済の掛金は、事業主が全額を負担し、掛金月額は、被共済者1人当たり3万円が上限となっている。", "c": true, "r": "2022.1-6-1", "u": "https://fp2-siken.com/kakomon/2022_1/06.html"}, {"s": "中小企業退職金共済の掛金月額は、被共済者1人当たり5万円が上限となっている。", "c": false, "r": "2021.3-8-1", "u": "https://fp2-siken.com/kakomon/2021_3/08.html"}, {"s": "中小企業退職金共済の掛金月額は、被共済者1人当たり7万円が上限となっている。", "c": false, "r": "2016.9-7-1", "u": "https://fp2-siken.com/kakomon/2016_9/07.html"}], "m": "中退共の掛金月額の上限は<b>3万円</b>。6万8,000円はiDeCo（自営業者）・国民年金基金の上限。", "url": "https://fp2-siken.com/kakomon/2015_5/08.html", "ref": "2015.5-8-1"}, {"uid": "risk-40", "id": 40, "page": "risk", "bunya": "リスク", "freq": 5, "a": "<strong style='color: #d11a2a;'>一般の生命保険料控除</strong>、個人年金保険料控除および介護医療保険料控除の控除限度額は、各5万円である。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">生命保険料控除には、一般の生命保険、個人年金保険、介護医療保険の3つの区分があります。所得税では、それぞれの区分で控除できる上限が<strong>5万円ずつ</strong>です。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">生命保険料の税金の控除は、一般の生命保険、個人年金、介護・医療の3グループに分かれています。\n\n所得税では、それぞれのグループで所得から引ける上限は<strong>5万円ずつ</strong>です。</div></div>", "ans": false, "k": "これは不適切。5万円ではありません。各区分ごとの控除限度額は、所得税で 40,000 円、住民税で28,000円です。\n\nこのテーマは関連問題を含めて<strong>5回</strong>まとまっている頻出論点。数字・年齢・期間・上限額などの条件整理が大事。<br><br>\n<div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>2012年以降に契約した保険（新制度）における、所得税と住民税の控除限度額の数字です。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>所得税の控除限度額は、各枠につき「<strong style='color: #d11a2a;'>最高4万円</strong>」（3枠合計で最高12万円）です。各5万円というのは旧制度（2011年以前の契約・2枠合計で最高10万円）の数字です。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>年末調整の紙を書くとき、計算式の最大値が「40,000円」になっているのはこのルールのためです。いくら高額な保険料を払っても、各枠4万円までしか税金計算から引かれません。</p>\n</div><div data-joushiki-copy=\"risk-40\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">控除額は税制改正前後の契約で違うため、感覚では判断できません。⚠️ <strong>暗記寄り</strong>：新契約の所得税の上限は各<strong>4万円</strong>、合計12万円です。</p></div>", "rel": [{"s": "一般の生命保険料控除、個人年金保険料控除および介護医療保険料控除の控除限度額は、所得税では各3万円である。", "c": false, "r": "2022.9-15-2", "u": "https://fp2-siken.com/kakomon/2022_9/15.html"}, {"s": "一般の生命保険料控除、個人年金保険料控除および介護医療保険料控除の控除限度額は、所得税では各5万円である。", "c": false, "r": "2022.5-13-1", "u": "https://fp2-siken.com/kakomon/2022_5/13.html"}, {"s": "2012年1月1日以後に締結した生命保険の保険料に係る「一般の生命保険料控除」「個人年金保険料控除」「介護医療保険料控除」の控除限度額は、所得税では各4万円である。", "c": true, "r": "2021.3-14-4", "u": "https://fp2-siken.com/kakomon/2021_3/14.html"}, {"s": "「一般の生命保険料控除」「個人年金保険料控除」「介護医療保険料控除」のそれぞれの控除額の上限は、所得税では4万円である。", "c": true, "r": "2015.10-14-1", "u": "https://fp2-siken.com/kakomon/2015_10/14.html"}], "m": "新制度の生命保険料控除は<b>各4万円</b>（所得税）・合計12万円まで。<b>5万円は旧制度</b>の一般・個人年金の限度額。", "url": "https://fp2-siken.com/kakomon/2025_5/14.html", "ref": "2025.5-14-3"}, {"uid": "finance-16", "id": 16, "page": "finance", "bunya": "金融", "freq": 5, "a": "証券会社が取り扱っているFX（外国為替証拠金取引）は、<strong style='color: #0b63c5;'>日本投資者保護基金の補償対象外</strong>である。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">証券会社でFXを取引していても、証券会社が破綻したときに日本投資者保護基金が補償する商品には含まれません。つまり、<strong>FXは基金の補償対象外</strong>です。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">証券会社を通してFXをしていたときに、その会社が倒れました。証券会社の商品が、何でも同じ基金に守られるわけではありません。\n\n<strong>FXは日本投資者保護基金の補償対象に入りません</strong>。</div></div>", "ans": true, "k": "これは<strong>適切</strong>です。<br>FX（外国為替証拠金取引）は、日本投資者保護基金による<strong>補償の対象外</strong>です。保護基金が守るのは、主に株や債券に関わる債権です。<br>ただし、FX会社には「信託保全」という別の顧客資産保護義務があります。<br><br>\n<div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>投資者保護基金は証券会社の倒産リスクに備えるものですが、デリバティブ取引などはその補償範囲に含まれていません。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>「FXも有価証券関連取引として保護される」というひっかけが頻出です。FX ＝ 対象外と覚えましょう。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>FX会社を選ぶ際は、基金の補償がない分、「信託保全」がどこまでしっかり行われているかを確認することが重要です。</p>\n</div><div data-joushiki-copy=\"finance-16\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">FXは顧客資産を信託して守る別の仕組みがあり、株などと同じ基金で守るとは限りません。⚠️ <strong>FXは対象外</strong>と暗記しておく部分です。</p></div>", "rel": [{"s": "日本国内の証券会社が保護預かりしている一般顧客の外国株式は、日本投資者保護基金による補償の対象とならない。", "c": false, "r": "2024.1-29-4", "u": "https://fp2-siken.com/kakomon/2024_1/29.html"}, {"s": "国内証券会社が保護預かりしている一般顧客の外国株式は、原則として、日本投資者保護基金による補償の対象となる。", "c": true, "r": "2019.9-28-1", "u": "https://fp2-siken.com/kakomon/2019_9/28.html"}, {"s": "国内証券会社が保護預かりしている一般顧客の外国株式は、日本投資者保護基金による補償の対象とならない。", "c": false, "r": "2019.5-29-3", "u": "https://fp2-siken.com/kakomon/2019_5/29.html"}, {"s": "国内証券会社が保護預かりしている一般顧客の外国株式は、日本投資者保護基金による補償の対象とならない。", "c": false, "r": "2018.9-29-4", "u": "https://fp2-siken.com/kakomon/2018_9/29.html"}], "m": "FX（外国為替証拠金取引）は<b>投資者保護基金の補償対象外</b>。", "url": "https://fp2-siken.com/kakomon/2024_9/29.html", "ref": "2024.9-29-4"}, {"uid": "finance-25", "id": 25, "page": "finance", "bunya": "金融", "freq": 5, "a": "「成長投資枠」を通じて購入することができる限度額（非課税投資枠）は、年間<strong style='color: #d11a2a;'>360万円</strong>である。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">NISAの成長投資枠では、一年間に買える金額が決まっています。その年間の非課税投資枠は<strong>360万円</strong>です。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">NISAの成長投資枠では、一年のうちに好きなだけ商品を買えるわけではありません。税金がかからない枠には上限があります。\n\n成長投資枠の一年分の上限は<strong>360万円</strong>です。</div></div>", "ans": false, "k": "これは<strong>不適切</strong>です。\n成長投資枠の年間非課税投資枠は<strong>240万円</strong>です。360万円ではありません。\n2024年以降の新NISAの年間投資枠は、つみたて投資枠<strong>120万円</strong>＋成長投資枠<strong>240万円</strong>＝合計<strong>360万円</strong>です。\n360万円は「合計」の数字なので、ひっかけに注意しましょう。\n生涯の非課税保有限度額は<strong>1,800万円</strong>（うち成長投資枠は<strong>1,200万円</strong>まで）です。<br><br>\n<div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>2024年から始まった新NISA制度の投資枠に関する問題です。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>年間の非課税投資枠は、成長投資枠が「年間240万円」で、つみたて投資枠が「年間120万円」、合わせて最大「年間360万円」です。成長投資枠単独で360万円ではありません。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>一生のうちに非課税で投資できる総額（生涯非課税限度額）は1,800万円ですが、そのうち成長投資枠で使えるのは最大1,200万円までという制限もあります。</p>\n</div><div data-joushiki-copy=\"finance-25\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">360万円はつみたて投資枠と成長投資枠を合わせた年間上限です。⚠️ 成長投資枠だけなら<strong>年間240万円</strong>で、金額は暗記寄りです。</p></div>", "rel": [{"s": "NISAのつみたて投資枠を利用して1年間のうちに株式投資信託を購入することができる限度額（年間投資枠）は、120万円である。", "c": true, "r": "2025.5-29-4", "u": "https://fp2-siken.com/kakomon/2025_5/29.html"}, {"s": "2026年中に「成長投資枠」を通じて新規購入することができる限度額（非課税枠）は、240万円である。", "c": true, "r": "2021.1-28-2", "u": "https://fp2-siken.com/kakomon/2021_1/28.html"}, {"s": "2026年中に「成長投資枠」を通じて購入することができる限度額（非課税枠）は、240万円である。", "c": true, "r": "2020.1-28-2", "u": "https://fp2-siken.com/kakomon/2020_1/28.html"}, {"s": "「つみたて投資枠」を通じて購入することができる限度額（非課税投資枠）は、年間120万円である。", "c": true, "r": "2019.5-28-3", "u": "https://fp2-siken.com/kakomon/2019_5/28.html"}], "m": "成長投資枠は<b>年間240万円</b>。<b>360万円はつみたて投資枠120万＋成長投資枠240万の合計</b>。生涯限度は1,800万円（うち成長投資枠1,200万円）。", "url": "https://fp2-siken.com/kakomon/2015_1/29.html", "ref": "2015.1-29-1"}, {"uid": "tax-34", "id": 34, "page": "tax", "bunya": "タックス", "freq": 5, "a": "基準期間における課税売上高が<strong style='color: #0b63c5;'>1,000万円</strong>を超える法人は、消費税の免税事業者となることができない。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">法人が消費税を免除されるかは、原則として基準となる期間の売上で判断します。その期間の課税売上高が<strong>1,000万円を超える</strong>法人は、免税事業者になれません。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">会社が消費税を納める立場かどうかは、原則として少し前の期間の売上を見て決めます。消費税の対象になる売上が大きい会社は、免除されません。\n\n基準となる期間の課税売上高が<strong>1,000万円を超える</strong>と、免税事業者になれません。</div></div>", "ans": true, "k": "✅ <strong>適切</strong>です。<br><br>基準期間（前々年・前々事業年度）の課税売上高が「<span style='background: linear-gradient(transparent 70%, #fff3e0 70%); font-weight: bold;'>1,000万円</span>」を超える事業者は、消費税を納める義務が発生し、免税事業者にはなれません。<br>・これが世に言う「消費税の1,000万円の壁」です。<br><br><div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>消費税は一定規模以上の事業者に申告納税を求めるため、免税点制度があります。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>基準期間の課税売上高『1,000万円超』が課税事業者判定の基本です。5,000万円は簡易課税の判定です。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>売上急増直後はまだ免税のこともあり、いつから課税事業者になるかを期単位で確認します。</p>\n</div><div data-joushiki-copy=\"tax-34\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">売上が一定規模を超えた事業者には、消費者から預かった消費税を納めてもらうという考え方です。⚠️ <strong>1,000万円超</strong>という境目は暗記寄りです。</p></div>", "rel": [{"s": "消費税の課税期間に係る基準期間における課税売上高が1,000万円を超える法人は、その課税期間は消費税の課税事業者となる。", "c": true, "r": "2023.9-38-2", "u": "https://fp2-siken.com/kakomon/2023_9/38.html"}, {"s": "基準期間における課税売上高が1,000万円を超える法人は、消費税の免税事業者となることができない。", "c": true, "r": "2023.1-38-1", "u": "https://fp2-siken.com/kakomon/2023_1/38.html"}, {"s": "消費税の課税期間に係る基準期間における課税売上高が1,000万円超の法人は、消費税の免税事業者となることができない。", "c": true, "r": "2021.9-39-2", "u": "https://fp2-siken.com/kakomon/2021_9/39.html"}, {"s": "基準期間における課税売上高が1,000万円を超える法人は、消費税の免税事業者となることができない。", "c": true, "r": "2021.5-39-1", "u": "https://fp2-siken.com/kakomon/2021_5/39.html"}], "m": "基準期間の課税売上高が<b>1,000万円超</b>なら課税事業者（免税事業者になれない）。", "url": "https://fp2-siken.com/kakomon/2025_5/39.html", "ref": "2025.5-39-2"}, {"uid": "tax-40", "id": 40, "page": "tax", "bunya": "タックス", "freq": 5, "a": "相続税では、納税者が申告をした後に、税務署長が納付すべき税額を決定する<strong style='color: #d11a2a;'>賦課課税方式</strong>を採用している。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">相続税では、相続人が財産の内容を申告したあとに税額が決まります。納める金額を計算して決定するのは<strong>税務署長で、賦課課税方式</strong>が使われています。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">遺産を受け取った人は、その財産の内容を税務署へ申告します。その申告をもとに、税務署が相続税の額を決めます。\n\n相続税には、税務署長が税額を決定する<strong>賦課課税方式</strong>が使われています。</div></div>", "ans": false, "k": "❌ <strong>不適切</strong>です。<br><br>相続税は、税務署が決定する賦課課税方式ではなく「<span style='background: linear-gradient(transparent 70%, #fff3e0 70%); font-weight: bold;'>申告納税方式</span>」です。<br>・<strong>ルール:</strong> 親が亡くなったとき、国が「あなたの遺産はこれだから税金〇〇円ね」と教えてくれることはありません。自分で財産を探して計算し、10ヵ月以内に申告しなければなりません。<br><br><div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>相続税は原則として相続人等が自ら財産と税額を計算して申告する税目です。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>『税務署長が税額を決定する賦課課税方式』は誤りで、正しくは申告納税方式です。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>相続開始後10か月以内に申告納付するので、財産調査と申告準備を早く始める必要があります。</p>\n</div><div data-joushiki-copy=\"tax-40\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">相続した財産や債務を詳しく知るのは相続人なので、本人が財産と税額を計算する方が現実的です。相続税は<strong>申告納税方式</strong>です。</p></div>", "rel": [{"s": "相続税では、納税者が申告書に記載した被相続人の資産等の内容に基づき、税務署長が納付すべき税額を決定する賦課課税方式が採用されている。", "c": false, "r": "2025.5-31-2", "u": "https://fp2-siken.com/kakomon/2025_5/31.html"}, {"s": "贈与税では、納税者が申告書に記載した財産の内容に基づき、税務署長が納付すべき税額を決定する賦課課税方式が採用されている。", "c": false, "r": "2024.9-31-2", "u": "https://fp2-siken.com/kakomon/2024_9/31.html"}, {"s": "相続税では、納税者が申告書に記載した被相続人の資産等の内容に基づき、税務署長が納付すべき税額を決定する賦課課税方式を採用している。", "c": false, "r": "2023.5-31-2", "u": "https://fp2-siken.com/kakomon/2023_5/31.html"}, {"s": "贈与税では、納税者が贈与を受けた財産を申告した後に、税務署長が納付すべき税額を決定する賦課課税方式を採用している。", "c": false, "r": "2022.1-31-2", "u": "https://fp2-siken.com/kakomon/2022_1/31.html"}], "m": "相続税は<b>申告納税方式</b>。賦課課税方式なのは固定資産税・不動産取得税・自動車税など。", "url": "https://fp2-siken.com/kakomon/2019_9/31.html", "ref": "2019.9-31-2"}, {"uid": "tax2-23", "id": 23, "page": "tax2", "bunya": "タックス", "freq": 5, "a": "損益計算書における<strong style='color: #0b63c5;'>売上総利益</strong>の額は、売上高の額から売上原価の額を差し引いた額である。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">売上総利益は、商品やサービスを売って直接どれだけ利益が残ったかを見る数字です。<strong>売上高から売上原価を引いて</strong>計算します。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">商品を100円で売って、その商品の仕入れに60円かかったとします。給料や家賃などを引く前に、まず40円が残ります。\n\nこのように<strong>売上から商品の原価を引いたものが売上総利益</strong>です。</div></div>", "ans": true, "k": "✅ <strong>適切</strong>です。<br><br>売上総利益は、売上高から「<span style='background: linear-gradient(transparent 70%, #fff3e0 70%); font-weight: bold;'>売上原価（仕入代や材料費）</span>」を差し引いたものです。<br>・<strong>基礎知識:</strong> 一般的に「粗利（あらり）」と呼ばれるものです。ここからさらに人件費や家賃などを引くと営業利益になります。<br><br><div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>売上総利益は粗利とも呼ばれ、商品やサービスそのものの採算を見る基本指標です。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>売上高−売上原価で求めます。販管費を引くと営業利益になる点と混同しやすいです。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>粗利率の把握は価格設定や原価管理の改善に直結します。</p>\n</div><div data-joushiki-copy=\"tax2-23\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">商品を100円で売って仕入れに60円かかったなら、まず残る40円が粗い利益です。人件費などを引く前の段階だと考えます。</p></div>", "rel": [{"s": "損益計算書の売上総利益の額は、売上高の額から売上原価の額を差し引いた額である。", "c": true, "r": "2022.9-40-1", "u": "https://fp2-siken.com/kakomon/2022_9/40.html"}, {"s": "損益計算書における売上総利益の額は、売上高の額から売上原価の額を差し引いた額である。", "c": true, "r": "2022.1-40-3", "u": "https://fp2-siken.com/kakomon/2022_1/40.html"}, {"s": "損益計算書の売上総利益の額は、売上高の額から販売費及び一般管理費の額を差し引いた額である。", "c": false, "r": "2021.9-40-1", "u": "https://fp2-siken.com/kakomon/2021_9/40.html"}, {"s": "損益計算書の売上総利益は、売上高から売上原価を差し引いて算出する。", "c": true, "r": "2021.1-40-3", "u": "https://fp2-siken.com/kakomon/2021_1/40.html"}], "m": "<b>売上総利益 ＝ 売上高 − 売上原価</b>", "url": "https://fp2-siken.com/kakomon/2025_5/40.html", "ref": "2025.5-40-1"}, {"uid": "tax2-25", "id": 25, "page": "tax2", "bunya": "タックス", "freq": 5, "a": "法人税の納税地は、原則として、その<strong style='color: #d11a2a;'>法人の代表者の住所地または居所地</strong>である。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">法人税をどこの税務署へ申告するかを決める納税地についてです。原則として、会社の本店ではなく、<strong>代表者個人の住所や居所</strong>が法人の納税地になります。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">会社の法人税を、どこの税務署へ申告するかを決める住所があります。会社の本店がある場所を使うのではありません。\n\n原則として、<strong>社長など代表者が住んでいる場所</strong>が会社の納税地になります。</div></div>", "ans": false, "k": "❌ <strong>不適切</strong>です。<br><br>法人税の納税地は、原則として「<span style='background: linear-gradient(transparent 70%, #fff3e0 70%); font-weight: bold;'>その法人の本店または主たる事務所の所在地</span>」です。<br>・<strong>ポイント:</strong> 代表者の個人の住所ではありません。会社そのものの住所（登記されている本店所在地）になります。<br><br><div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>法人税の納税地は、会社という法人自身の所在地を基準に考えます。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>代表者の住所地ではなく、『本店または主たる事務所の所在地』が原則です。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>バーチャルオフィスや本店移転を伴う設立では、納税地の扱いを誤ると届出漏れが起きます。</p>\n</div><div data-joushiki-copy=\"tax2-25\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">会社と代表者個人は法律上別の存在なので、会社の税金を代表者の自宅で管理するのは不自然です。法人税の納税地は原則として<strong>本店または主たる事務所の所在地</strong>です。</p></div>", "rel": [{"s": "法人税の納税地は、その法人の代表者の住所または居所の所在地である。", "c": false, "r": "2024.9-36-1", "u": "https://fp2-siken.com/kakomon/2024_9/36.html"}, {"s": "法人税の納税地は、原則として、その法人の代表者の住所または居所の所在地である。", "c": false, "r": "2023.5-36-1", "u": "https://fp2-siken.com/kakomon/2023_5/36.html"}, {"s": "法人税の納税地は、原則として、その法人の代表者の住所または居所の所在地である。", "c": false, "r": "2022.9-36-1", "u": "https://fp2-siken.com/kakomon/2022_9/36.html"}, {"s": "法人税の納税地は、原則として、その法人の本店または主たる事務所の所在地である。", "c": true, "r": "2019.1-37-1", "u": "https://fp2-siken.com/kakomon/2019_1/37.html"}], "m": "法人税の納税地は<b>本店または主たる事務所の所在地</b>。代表者の住所地ではない。", "url": "https://fp2-siken.com/kakomon/2025_5/37.html", "ref": "2025.5-37-1"}, {"uid": "tax2-26", "id": 26, "page": "tax2", "bunya": "タックス", "freq": 5, "a": "税金には国税と地方税があるが、法人税は<strong style='color: #0b63c5;'>国税</strong>に該当し、不動産取得税は<strong style='color: #0b63c5;'>地方税</strong>に該当する。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">税金は、国へ納める国税と、都道府県や市町村へ納める地方税に分かれます。<strong>法人税は国税</strong>で、土地や建物を取得したときの<strong>不動産取得税は地方税</strong>です。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">税金には、国へ納めるものと、都道府県や市町村へ納めるものがあります。名前が似ていても、納める先は同じとは限りません。\n\n<strong>法人税は国税</strong>で、土地や建物を買ったときの<strong>不動産取得税は地方税</strong>です。</div></div>", "ans": true, "k": "✅ <strong>適切</strong>です。<br><br>税金には国に納める国税と、地方自治体に納める地方税があり、法人税は国税、不動産取得税は地方税（都道府県税）に該当します。<br>・<strong>ひっかけ注意:</strong> 所得税、法人税、相続税などは国税。住民税、事業税、固定資産税、不動産取得税などは地方税です。<br><br><div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>国税と地方税の区分は、どの行政主体に納める税かで整理します。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>法人税は国税、不動産取得税は地方税です。固定資産税や住民税も地方税としてまとめて覚えると整理しやすいです。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>税金の納付先を案内する実務では、税目ごとの所轄自治体か国かを明確に伝える必要があります。</p>\n</div><div data-joushiki-copy=\"tax2-26\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">「法人税」と「法人住民税」は名前が似ていますが別の税です。⚠️ どの税が国税・地方税かという分類は<strong>暗記寄り</strong>です。</p></div>", "rel": [{"s": "税金には国税と地方税があるが、不動産取得税は国税に該当し、固定資産税は地方税に該当する。", "c": false, "r": "2022.1-31-4", "u": "https://fp2-siken.com/kakomon/2022_1/31.html"}, {"s": "税金には、国税と地方税があるが、相続税は国税に該当し、登録免許税は地方税に該当する。", "c": false, "r": "2021.9-31-3", "u": "https://fp2-siken.com/kakomon/2021_9/31.html"}, {"s": "税金には国税と地方税があるが、固定資産税は国税に該当し、不動産取得税は地方税に該当する。", "c": false, "r": "2021.3-31-4", "u": "https://fp2-siken.com/kakomon/2021_3/31.html"}, {"s": "税金には、国税と地方税とがあるが、法人税は国税に該当し、事業税は地方税に該当する。", "c": true, "r": "2019.9-31-4", "u": "https://fp2-siken.com/kakomon/2019_9/31.html"}], "m": "法人税は<b>国税</b>／不動産取得税・固定資産税は<b>地方税</b>。", "url": "https://fp2-siken.com/kakomon/2025_5/31.html", "ref": "2025.5-31-4"}, {"uid": "tax2-27", "id": 27, "page": "tax2", "bunya": "タックス", "freq": 5, "a": "税金を負担する者と税金を納める者が異なる税金を<strong style='color: #0b63c5;'>間接税</strong>といい、消費税は間接税に該当する。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">税金を実際に負担する人と、国などへ納める人が別になる税を間接税といいます。消費者が負担し、店がまとめて納める<strong>消費税は間接税</strong>です。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">買い物では、客が消費税を含む代金を払います。でも、客がその税を一件ずつ国へ送るわけではなく、お店がまとめて納めます。\n\n負担する人と納める人が違う<strong>消費税は、間接税</strong>です。</div></div>", "ans": true, "k": "✅ <strong>適切</strong>です。<br><br>税金を負担する人（消費者）と、税務署に納める人（お店）が異なる税金を「<span style='background: linear-gradient(transparent 70%, #fff3e0 70%); font-weight: bold;'>間接税</span>」といい、消費税はその代表例です。<br>・<strong>間接税:</strong> 負担する人と納める人が違う（消費税、酒税など）。<br><br><div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>消費税のように負担者と納付者が異なる税は、価格転嫁を通じて徴収する間接税です。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>直接税との違いは『負担者と納付者が同じか』です。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>消費税改定時には価格表示や転嫁の説明が顧客対応で重要になります。</p>\n</div><div data-joushiki-copy=\"tax2-27\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">買物では消費者が税を含む代金を払い、店が申告して納めます。負担する人と納付手続をする人が違うことを思い出せば判断できます。</p></div>", "rel": [{"s": "税金を負担する者と税金を納める者が異なる税金を間接税といい、相続税は間接税に該当する。", "c": false, "r": "2022.1-31-3", "u": "https://fp2-siken.com/kakomon/2022_1/31.html"}, {"s": "税金を負担する者と税金を納める者が異なる税金を間接税といい、固定資産税は間接税に該当する。", "c": false, "r": "2021.9-31-4", "u": "https://fp2-siken.com/kakomon/2021_9/31.html"}, {"s": "税金を負担する者と税金を納める者が異なる税金を間接税といい、贈与税は間接税に該当する。", "c": false, "r": "2021.3-31-3", "u": "https://fp2-siken.com/kakomon/2021_3/31.html"}, {"s": "税金を負担する者と税金を納める者が異なる税金を間接税といい、消費税は間接税に該当する。", "c": true, "r": "2019.9-31-3", "u": "https://fp2-siken.com/kakomon/2019_9/31.html"}], "m": "負担する人と納める人が違う税＝<b>間接税</b>（消費税・酒税など）。", "url": "https://fp2-siken.com/kakomon/2025_5/31.html", "ref": "2025.5-31-3"}, {"uid": "tax2-28", "id": 28, "page": "tax2", "bunya": "タックス", "freq": 5, "a": "貸借対照表において、資産の部の合計額は、負債の部および純資産の部の合計額と<strong style='color: #0b63c5;'>一致する</strong>。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">貸借対照表の資産は、会社が集めたお金を何に使っているかを表します。その資金の出どころである負債と純資産を合わせた額は、必ず<strong>資産の合計額と一致します</strong>。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">会社は、借りたお金や自分で用意したお金を、現金、建物、商品などの形で持っています。お金の出どころと、その使い道を左右に並べたものが貸借対照表です。\n\n<strong>負債と純資産の合計は、資産の合計と同じ</strong>になります。</div></div>", "ans": true, "k": "✅ <strong>適切</strong>です。<br><br>貸借対照表（バランスシート）では、左側の「資産の部」の合計と、右側の「負債の部＋純資産の部」の合計は<span style='background: linear-gradient(transparent 70%, #fff3e0 70%); font-weight: bold;'>必ず一致</span>します。<br>・<strong>ルール:</strong> お金をどうやって集めてきたか（負債と純資産）と、それをどんな形で持っているか（資産）を表すため、左右の合計はピタリと合います。<br><br><div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>貸借対照表は、企業の資金の調達源泉と運用形態が必ず一致するという考え方で作られます。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>資産＝負債＋純資産のバランスが崩れることはありません。損益計算書と混同しやすいです。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>金融機関や投資家は、この一致関係を前提に安全性分析を行います。</p>\n</div><div data-joushiki-copy=\"tax2-28\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">借りたお金と自分で用意したお金の合計が、現金や建物などの形になっています。資金の出どころと使い道は同額になる、と考えれば分かりやすいです。</p></div>", "rel": [{"s": "貸借対照表において、資産の部の合計額と、負債の部および純資産の部の合計額は一致する。", "c": true, "r": "2023.5-40-3", "u": "https://fp2-siken.com/kakomon/2023_5/40.html"}, {"s": "貸借対照表における資産の部の合計額は、負債の部および純資産の部の合計額と一致する。", "c": true, "r": "2022.1-40-2", "u": "https://fp2-siken.com/kakomon/2022_1/40.html"}, {"s": "貸借対照表の資産の部の合計額は、負債の部および純資産の部の合計額と一致する。", "c": true, "r": "2021.1-40-2", "u": "https://fp2-siken.com/kakomon/2021_1/40.html"}, {"s": "貸借対照表において、資産の部の合計額と、負債の部および純資産の部の合計額は一致する。", "c": true, "r": "2020.9-40-4", "u": "https://fp2-siken.com/kakomon/2020_9/40.html"}], "m": "<b>資産の部 ＝ 負債の部 ＋ 純資産の部</b>（貸借が一致する）", "url": "https://fp2-siken.com/kakomon/2025_1/40.html", "ref": "2025.1-40-2"}, {"uid": "tax2-30", "id": 30, "page": "tax2", "bunya": "タックス", "freq": 5, "a": "<strong style='color: #0b63c5;'>キャッシュフロー計算書</strong>は、一会計期間における企業の資金の増減を示したものである。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">キャッシュフロー計算書は、帳簿上の利益ではなく、会社の現金や現金に近い資金の動きを見る資料です。一つの会計期間に、<strong>資金がどれだけ増えたり減ったりしたか</strong>を示します。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">帳簿では利益が出ていても、売上代金をまだ受け取っていなければ、手元のお金は少ないままです。そこで、利益とは別に現金の動きを見る資料を使います。\n\nキャッシュフロー計算書は、一定期間に<strong>現金などがどれだけ増減したか</strong>を示します。</div></div>", "ans": true, "k": "✅ <strong>適切</strong>です。<br><br>キャッシュフロー計算書は、会社の「<span style='background: linear-gradient(transparent 70%, #fff3e0 70%); font-weight: bold;'>現金（資金）の増減</span>」を示した財務諸表です。<br>・<strong>種類:</strong> 営業活動（本業での現金増減）、投資活動（設備投資など）、財務活動（借入や返済など）の3つの区分で現金の動きを表します。<br><br><div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>キャッシュフロー計算書は、利益ではなく現金の増減に着目して企業活動を把握するための資料です。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>損益計算書との違いは『現金主義で動きを見る』点です。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>黒字倒産のリスク把握には、利益よりもキャッシュフローを見ることが有効です。</p>\n</div><div data-joushiki-copy=\"tax2-30\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">利益が出ていても代金をまだ回収していなければ、手元のお金は不足することがあります。利益と現金を分けて確認する資料が必要だと考えられます。</p></div>", "rel": [{"s": "キャッシュフロー計算書は、一会計期間における企業の資金の増減を示したものである。", "c": true, "r": "2022.5-40-3", "u": "https://fp2-siken.com/kakomon/2022_5/40.html"}, {"s": "キャッシュフロー計算書は、将来における企業の資金収支の予測を示したものである。", "c": false, "r": "2020.1-40-3", "u": "https://fp2-siken.com/kakomon/2020_1/40.html"}, {"s": "キャッシュフロー計算書は、一会計期間における企業の資金の増減を示したものである。", "c": true, "r": "2018.1-40-4", "u": "https://fp2-siken.com/kakomon/2018_1/40.html"}, {"s": "キャッシュ・フロー計算書は、来期における企業の資金収支の予測を示している。", "c": false, "r": "2014.5-40-3", "u": "https://fp2-siken.com/kakomon/2014_5/40.html"}], "m": "キャッシュフロー計算書＝<b>一会計期間の資金（現金）の増減</b>を示す財務諸表。", "url": "https://fp2-siken.com/kakomon/2023_5/40.html", "ref": "2023.5-40-4"}, {"uid": "inheritance-30", "id": 30, "page": "inheritance", "bunya": "相続", "freq": 5, "a": "<strong style='color: #0b63c5; background-color: #eaf4ff; padding: 0 3px; border-bottom: 2px solid #90caf9;'>贈与税</strong>の納付は、金銭による一括納付が原則であるが、所定の要件を満たせば<strong style='color: #0b63c5; background-color: #eaf4ff; padding: 0 3px; border-bottom: 2px solid #90caf9;'>物納</strong>が認められる。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">贈与税は現金で一括して納めるのが基本です。ただし、一括払いが難しいなど所定の条件を満たせば、土地や有価証券などを渡す<strong>物納も利用できます</strong>。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">贈与税は現金でまとめて払うのが基本です。現金で一度に払えないため、持っている土地や株を税金の代わりに渡そうとしています。\n\n決められた条件に合えば、財産を渡す<strong>物納も使えます</strong>。</div></div>", "ans": false, "k": "これは不適切。贈与税では延納の制度はありますが、物納はできません。延納によっても納付が困難である金額を限度として物納を申請できるのは 相続税 です。\n\nこのテーマは関連問題を含めて<strong>5回</strong>まとまっている頻出論点。要件・例外・できる／できないの区別が大事。<br><br>\n<div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\"><h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4><p style=\"margin: 0 0 10px
