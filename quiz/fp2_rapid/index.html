<script>
const ITEMS = [{"uid": "risk-2", "id": 2, "page": "risk", "bunya": "リスク", "freq": 21, "a": "被保険者が役員、死亡保険金受取人が法人である終身保険の保険料は、その<strong style='color: #0b63c5;'>全額を資産に計上</strong>する。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">会社が役員を被保険者にして終身保険へ入り、役員が亡くなったときの保険金を会社が受け取る契約です。会社が支払う保険料は、<strong>全額を資産</strong>として記録します。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">会社が役員に一生涯の死亡保険をかけ、役員が亡くなったら会社がお金を受け取る契約です。\n\n会社が払う保険料は、その<strong>全額を資産として記録します</strong>。</div></div>", "ans": true, "k": "適切。\n法人が受取人の終身保険は<strong>全額資産計上</strong>です。\nQ0、Q62と同じルールで、FP2級では最頻出テーマの一つです。\n「損金」と書き換えるひっかけに要注意。\n<em>終身保険＝貯蓄性あり＝法人受取なら全額資産</em>を徹底暗記！<br><br>\n<div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>終身保険は必ずいつか死亡保険金が支払われる（掛け捨てではない）ため、養老保険と同じく「貯蓄」としての性質を持ちます。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>「全額を損金に算入する」というフェイクが出ます。貯蓄性がある保険は資産計上が原則です。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>役員が亡くなった際の事業保障資金や、死亡退職金の原資として法人が加入します。</p>\n</div><div data-joushiki-copy=\"risk-2\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">終身保険は解約返戻金がたまり、死亡時には会社が保険金を受け取ります。会社に価値が残るため、支払時に全額を費用にせず資産として扱います。</p></div>", "rel": [{"s": "被保険者を役員、死亡保険金受取人を法人とする終身保険の支払保険料は、その全額を資産に計上する。", "c": true, "r": "2025.5-15-2", "u": "https://fp2-siken.com/kakomon/2025_5/15.html"}, {"s": "被保険者が特定の役員、死亡保険金受取人が法人である終身保険の支払保険料は、その全額を損金の額に算入することができる。", "c": false, "r": "2025.1-16-1", "u": "https://fp2-siken.com/kakomon/2025_1/16.html"}, {"s": "被保険者が役員、死亡保険金受取人が法人である終身保険を解約して法人が受け取った解約返戻金は、その全額を益金の額に算入する。", "c": false, "r": "2024.9-15-1", "u": "https://fp2-siken.com/kakomon/2024_9/15.html"}, {"s": "被保険者が役員、死亡保険金受取人が法人である終身保険の支払保険料は、その全額を資産に計上する。", "c": true, "r": "2024.5-15-2", "u": "https://fp2-siken.com/kakomon/2024_5/15.html"}, {"s": "被保険者が役員、死亡保険金受取人が法人である終身保険の支払保険料は、その全額を資産に計上する。", "c": true, "r": "2024.1-15-1", "u": "https://fp2-siken.com/kakomon/2024_1/15.html"}, {"s": "被保険者が役員、死亡保険金受取人が法人である終身保険の支払保険料は、その全額を損金の額に算入することができる。", "c": false, "r": "2023.5-15-2", "u": "https://fp2-siken.com/kakomon/2023_5/15.html"}, {"s": "被保険者が役員、死亡保険金受取人が法人である終身保険の支払保険料は、その全額を資産に計上する。", "c": true, "r": "2022.9-16-1", "u": "https://fp2-siken.com/kakomon/2022_9/16.html"}, {"s": "死亡保険金受取人が法人である終身保険の支払保険料は、その全額を資産に計上する。", "c": true, "r": "2022.5-14-2", "u": "https://fp2-siken.com/kakomon/2022_5/14.html"}, {"s": "被保険者が役員、死亡保険金受取人が法人である終身保険の支払保険料は、その全額を損金の額に算入することができる。", "c": false, "r": "2022.1-15-2", "u": "https://fp2-siken.com/kakomon/2022_1/15.html"}, {"s": "被保険者が役員、死亡保険金受取人が法人である終身保険を法人が解約して受け取った解約返戻金は、その全額を益金の額に算入する。", "c": false, "r": "2021.9-15-2", "u": "https://fp2-siken.com/kakomon/2021_9/15.html"}, {"s": "死亡保険金受取人が法人である終身保険の支払保険料は、その全額を資産に計上する。", "c": true, "r": "2021.1-15-2", "u": "https://fp2-siken.com/kakomon/2021_1/15.html"}, {"s": "被保険者が役員、死亡保険金受取人が法人である終身保険の支払保険料は、その全額を資産に計上する。", "c": true, "r": "2020.9-15-2", "u": "https://fp2-siken.com/kakomon/2020_9/15.html"}, {"s": "被保険者が役員、死亡保険金受取人が法人である終身保険の保険料は、その全額を資産に計上する。", "c": true, "r": "2018.5-14-3", "u": "https://fp2-siken.com/kakomon/2018_5/14.html"}, {"s": "被保険者が役員、保険金受取人が法人である終身保険の保険料は、その全額を資産に計上する。", "c": true, "r": "2017.5-16-1", "u": "https://fp2-siken.com/kakomon/2017_5/16.html"}, {"s": "満期保険金受取人および死亡保険金受取人がいずれも法人である養老保険の保険料は、その全額を資産に計上する。", "c": true, "r": "2017.1-15-1", "u": "https://fp2-siken.com/kakomon/2017_1/15.html"}, {"s": "死亡保険金受取人が法人である終身保険の保険料は、支払保険料の全額を資産に計上する。", "c": true, "r": "2015.10-15-1", "u": "https://fp2-siken.com/kakomon/2015_10/15.html"}, {"s": "被保険者が特定の役員、死亡保険金受取人が法人である終身保険の保険料は、全額を資産に計上する。", "c": true, "r": "2014.5-14-2", "u": "https://fp2-siken.com/kakomon/2014_5/14.html"}, {"s": "被保険者が役員、死亡保険金受取人が法人である終身保険の保険料は、全額を損金に算入する。", "c": false, "r": "2014.1-15-1", "u": "https://fp2-siken.com/kakomon/2014_1/15.html"}, {"s": "死亡保険金受取人が法人である終身保険の保険料は、全期間を通じて、全額を資産に計上する。", "c": true, "r": "2013.9-15-1", "u": "https://fp2-siken.com/kakomon/2013_9/15.html"}, {"s": "死亡保険金受取人が法人である終身保険の保険料は、支払保険料の全額を資産に計上する。", "c": true, "r": "2013.1-14-4", "u": "https://fp2-siken.com/kakomon/2013_1/14.html"}], "m": "死亡保険金受取人が法人の<b>終身保険</b>の保険料は<b>全額を資産計上</b>（保険積立金）。", "url": "https://fp2-siken.com/kakomon/2018_1/15.html", "ref": "2018.1-15-3"}, {"uid": "estate-3", "id": 3, "page": "estate", "bunya": "不動産", "freq": 15, "a": "地価公示の公示価格は、毎年1月1日を価格判定の基準日としている。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">地価公示は、国が土地の標準的な価格を示す仕組みです。毎年発表される公示価格は、<strong>1月1日時点</strong>の土地価格をもとに決めます。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">土地の値段は場所によって違うので、国が毎年、目安になる価格を発表しています。これが地価公示です。\n\nその価格を決める基準日は、毎年<strong>1月1日</strong>です。</div></div>", "ans": true, "k": "適切。地価公示法に基づく公示価格は、毎年<strong>1月1日</strong>を価格判定の基準日としています。\n似た制度の都道府県地価調査は7月1日が基準日なので混同に注意。\n覚え方：「公示価格は年の初め（1月1日）、地価調査は年の半ば（7月1日）」。<br><br>\n<div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>全国の標準地について、正常な価格を一般に公開し、土地取引の目安とするための制度（地価公示法）です。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>国交省が発表する「地価公示」、国税庁の「路線価」、市町村の「固定資産税評価額」はすべて<strong style='color: #0b63c5;'>1月1日</strong>が基準です。都道府県の「基準地価（都道府県地価調査）」だけが7月1日なので、混同しないようにしましょう。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>毎年3月下旬にニュースで「今年の地価公示が発表されました」と報じられるのは、この1月1日時点の価格のことです。</p>\n</div><div data-joushiki-copy=\"estate-3\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">年ごとの土地価格を比べるには、毎年同じ日を基準にするのが自然です。⚠️ <strong>暗記寄り</strong>：<strong>地価公示は1月1日、都道府県地価調査は7月1日</strong>という日付は暗記寄りです。</p></div>", "rel": [{"s": "地価公示の公示価格は、毎年4月1日を標準地の価格判定の基準日としている。", "c": false, "r": "2024.1-41-1", "u": "https://fp2-siken.com/kakomon/2024_1/41.html"}, {"s": "地価公示法による公示価格は、毎年4月1日を標準地の価格判定の基準日としている。", "c": false, "r": "2023.1-41-1", "u": "https://fp2-siken.com/kakomon/2023_1/41.html"}, {"s": "地価公示法による公示価格は、毎年1月1日を標準地の価格判定の基準日としている。", "c": true, "r": "2022.5-42-1", "u": "https://fp2-siken.com/kakomon/2022_5/42.html"}, {"s": "地価公示法による公示価格は、毎年1月1日を標準地の価格判定の基準日としている。", "c": true, "r": "2021.1-42-1", "u": "https://fp2-siken.com/kakomon/2021_1/42.html"}, {"s": "地価公示の公示価格は、毎年1月1日を価格判定の基準日としている。", "c": true, "r": "2020.1-42-1", "u": "https://fp2-siken.com/kakomon/2020_1/42.html"}, {"s": "地価公示の公示価格は、毎年1月1日を価格判定の基準日としている。", "c": true, "r": "2019.9-42-1", "u": "https://fp2-siken.com/kakomon/2019_9/42.html"}, {"s": "地価公示の公示価格は、毎年1月1日を価格判定の基準日としている。", "c": true, "r": "2019.5-41-3", "u": "https://fp2-siken.com/kakomon/2019_5/41.html"}, {"s": "地価公示の公示価格の価格判定の基準日は、毎年7月1日である。", "c": false, "r": "2018.9-41-1", "u": "https://fp2-siken.com/kakomon/2018_9/41.html"}, {"s": "地価公示の公示価格は、毎年1月1日を価格判定の基準日としている。", "c": true, "r": "2018.1-41-1", "u": "https://fp2-siken.com/kakomon/2018_1/41.html"}, {"s": "地価公示の公示価格は、毎年7月1日を価格判定の基準日としている。", "c": false, "r": "2017.9-41-1", "u": "https://fp2-siken.com/kakomon/2017_9/41.html"}, {"s": "地価公示の公示価格は、毎年4月1日を価格判定の基準日としている。", "c": false, "r": "2017.5-41-1", "u": "https://fp2-siken.com/kakomon/2017_5/41.html"}, {"s": "地価公示の公示価格は、毎年1月1日を価格判定の基準日としている。", "c": true, "r": "2017.1-42-1", "u": "https://fp2-siken.com/kakomon/2017_1/42.html"}, {"s": "地価公示の公示価格は、毎年1月1日を価格判定の基準日としている。", "c": true, "r": "2016.1-42-1", "u": "https://fp2-siken.com/kakomon/2016_1/42.html"}, {"s": "地価公示の公示価格は、毎年4月1日を価格判定の基準日としている。", "c": false, "r": "2014.9-41-1", "u": "https://fp2-siken.com/kakomon/2014_9/41.html"}], "m": "地価公示の<b>公示価格</b>＝基準日は毎年<b>1月1日</b>（国土交通省）。", "url": "https://fp2-siken.com/kakomon/2015_5/41.html", "ref": "2015.5-41-1"}, {"uid": "estate-4", "id": 4, "page": "estate", "bunya": "不動産", "freq": 14, "a": "土地を譲渡する際に支出した仲介手数料は、譲渡所得の金額の計算上、譲渡費用に含まれる。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">土地を売るために不動産会社へ払った仲介手数料は、売却に直接かかった費用です。土地を売った利益を計算するとき、<strong>譲渡費用として差し引けます</strong>。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">土地を売るとき、不動産会社に仲介を頼めば手数料がかかります。これは、その土地を売るために直接かかったお金です。\n\nその仲介手数料を<strong>売却益から差し引ける費用</strong>として扱います。</div></div>", "ans": true, "k": "これは適切。土地・建物を譲渡する際に直接要した仲介手数料、印紙税、立退料、解体費などは、譲渡所得の金額の計算上、譲渡費用に含まれます。なお、取得する際に支払った仲介手数料は取得費に含めることになります。\n\nこのテーマは関連問題を含めて<strong>14回</strong>まとまっている頻出論点。要件・例外・できる／できないの区別が大事。<br><br>\n<div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>譲渡所得の計算上、売却のために直接かかった費用（仲介手数料、印紙代、測量費など）は「譲渡費用」として売上から差し引くことができます。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>土地を「買ったとき」の仲介手数料は、譲渡費用ではなく「取得費」に含まれます。売った時の手数料は譲渡費用です。どちらも利益から引ける点では同じですが、区分の違いを問われます。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>不動産を売って利益が出たとき、仲介業者に払った高額な手数料を譲渡費用として計上することで、税金を大きく減らすことができます。</p>\n</div><div data-joushiki-copy=\"estate-4\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">売るために必要だった手数料を、売却のもうけから引くのは自然です。買ったときの仲介手数料は譲渡費用ではなく取得費になる、と分けて考えます。</p></div>", "rel": [{"s": "土地を譲渡する際に支出した仲介手数料は、譲渡所得の金額の計算上、譲渡費用に含まれる。", "c": true, "r": "2024.9-48-4", "u": "https://fp2-siken.com/kakomon/2024_9/48.html"}, {"s": "土地を譲渡する際に支出した仲介手数料は、譲渡所得の金額の計算上、譲渡費用に含まれる。", "c": true, "r": "2024.1-48-4", "u": "https://fp2-siken.com/kakomon/2024_1/48.html"}, {"s": "土地を譲渡する際に支出した仲介手数料は、譲渡所得の金額の計算上、譲渡費用に含まれる。", "c": true, "r": "2023.5-48-4", "u": "https://fp2-siken.com/kakomon/2023_5/48.html"}, {"s": "土地を譲渡する際に支出した仲介手数料は、譲渡所得の金額の計算上、譲渡費用に含まれる。", "c": true, "r": "2022.9-49-4", "u": "https://fp2-siken.com/kakomon/2022_9/49.html"}, {"s": "土地を譲渡する際に支出した仲介手数料は、譲渡所得の金額の計算上、譲渡費用に含まれる。", "c": true, "r": "2022.1-48-3", "u": "https://fp2-siken.com/kakomon/2022_1/48.html"}, {"s": "譲渡するために直接要した仲介手数料は、譲渡所得の金額の計算上、譲渡費用に含まれる。", "c": true, "r": "2021.5-48-4", "u": "https://fp2-siken.com/kakomon/2021_5/48.html"}, {"s": "土地を譲渡する際に直接要した仲介手数料は、譲渡所得の金額の計算上、譲渡費用に含まれる。", "c": true, "r": "2021.1-49-3", "u": "https://fp2-siken.com/kakomon/2021_1/49.html"}, {"s": "譲渡するために直接要した仲介手数料は、譲渡所得の金額の計算上、譲渡費用に含まれる。", "c": true, "r": "2020.9-49-3", "u": "https://fp2-siken.com/kakomon/2020_9/49.html"}, {"s": "土地を譲渡する際に直接要した仲介手数料は、譲渡所得の金額の計算上、譲渡費用に含まれる。", "c": true, "r": "2019.1-49-2", "u": "https://fp2-siken.com/kakomon/2019_1/49.html"}, {"s": "土地を譲渡する際に不動産業者に支払った仲介手数料は、譲渡所得の金額の計算上、その土地の譲渡費用に含まれる。", "c": true, "r": "2017.9-48-3", "u": "https://fp2-siken.com/kakomon/2017_9/48.html"}, {"s": "土地を譲渡する際に直接要した仲介手数料は、譲渡所得の金額の計算上、譲渡費用に含まれる。", "c": true, "r": "2016.1-49-2", "u": "https://fp2-siken.com/kakomon/2016_1/49.html"}, {"s": "土地を譲渡する際に直接要した仲介手数料は、譲渡所得の金額の計算上、譲渡費用に含まれる。", "c": true, "r": "2015.10-49-3", "u": "https://fp2-siken.com/kakomon/2015_10/49.html"}, {"s": "土地を譲渡する際に直接要した仲介手数料は、譲渡所得の金額の計算上、譲渡費用に含まれる。", "c": true, "r": "2014.5-48-3", "u": "https://fp2-siken.com/kakomon/2014_5/48.html"}], "m": "売却時の<b>仲介手数料</b>は譲渡所得の計算上<b>譲渡費用</b>に含まれる。", "url": "https://fp2-siken.com/kakomon/2025_5/49.html", "ref": "2025.5-49-4"}, {"uid": "estate-5", "id": 5, "page": "estate", "bunya": "不動産", "freq": 14, "a": "相続税路線価は、地価公示の公示価格の70％を価格水準の目安としている。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">相続税路線価は、土地の相続税や贈与税を計算するための基準価格です。その金額は、公示価格の<strong>70％ほど</strong>を目安に決められます。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">相続や贈与で土地を受け取るときは、税金を計算するための目安となる土地価格を使います。これが相続税路線価です。\n\n路線価は公示価格のおよそ<strong>70％</strong>を目安に決めます。</div></div>", "ans": false, "k": "これは不適切。70％ではありません。相続税路線価は、相続税や贈与税の基準となる評価額で、公示価格の 80 ％を目安として設定されます。\n\nこのテーマは関連問題を含めて<strong>14回</strong>まとまっている頻出論点。数字・年齢・期間・上限額などの条件整理が大事。<br><br>\n<div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>相続税路線価は、相続税や贈与税を計算する際の基準となる土地の評価額です。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>「70％」ではなく「<strong style='color: #d11a2a;'>80％</strong>」が正解です。「路線価は80％、固定資産税評価額は70％」となります。「ハチ公（8＝路線価、公＝公示価格）」の語呂合わせで暗記しましょう。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>実際の取引相場（公示価格）よりも少し安く評価される（80%になる）ため、現金のまま持っているより不動産に換えたほうが相続税が安くなるという「不動産節税」の根拠となっています。</p>\n</div><div data-joushiki-copy=\"estate-5\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">税金を計算する価格が実際の取引目安より少し低め、という方向は理解できます。⚠️ <strong>暗記寄り</strong>：<strong>路線価は公示価格の80％、固定資産税評価額は70％</strong>が暗記ポイントです。</p></div>", "rel": [{"s": "相続税路線価は、地価公示法による公示価格の80％を価格水準の目安としている。", "c": true, "r": "2023.1-41-3", "u": "https://fp2-siken.com/kakomon/2023_1/41.html"}, {"s": "相続税路線価は、地価公示法による公示価格の70％を価格水準の目安としている。", "c": false, "r": "2022.5-42-3", "u": "https://fp2-siken.com/kakomon/2022_5/42.html"}, {"s": "相続税路線価は、地価公示の公示価格の70％を価格水準の目安として設定されている。", "c": false, "r": "2020.1-42-3", "u": "https://fp2-siken.com/kakomon/2020_1/42.html"}, {"s": "相続税路線価は、地価公示の公示価格の80％を価格水準の目安として設定されている。", "c": true, "r": "2019.9-42-3", "u": "https://fp2-siken.com/kakomon/2019_9/42.html"}, {"s": "相続税路線価は、地価公示の公示価格の70％を価格水準の目安として設定されている。", "c": false, "r": "2019.5-41-1", "u": "https://fp2-siken.com/kakomon/2019_5/41.html"}, {"s": "相続税路線価は、地価公示の公示価格の80％を価格水準の目安として設定されている。", "c": true, "r": "2018.9-41-3", "u": "https://fp2-siken.com/kakomon/2018_9/41.html"}, {"s": "相続税路線価は、地価公示の公示価格の90％を価格水準の目安として設定されている。", "c": false, "r": "2018.1-41-2", "u": "https://fp2-siken.com/kakomon/2018_1/41.html"}, {"s": "相続税路線価は、地価公示の公示価格の70％を価格水準の目安として設定されている。", "c": false, "r": "2017.9-41-3", "u": "https://fp2-siken.com/kakomon/2017_9/41.html"}, {"s": "相続税路線価は、地価公示の公示価格の80％を価格水準の目安として設定されている。", "c": true, "r": "2017.5-41-3", "u": "https://fp2-siken.com/kakomon/2017_5/41.html"}, {"s": "相続税路線価は、地価公示の公示価格の70％を価格水準の目安として設定されている。", "c": false, "r": "2017.1-42-3", "u": "https://fp2-siken.com/kakomon/2017_1/42.html"}, {"s": "相続税路線価は、地価公示の公示価格の80％程度の価格水準とされている。", "c": true, "r": "2016.1-42-3", "u": "https://fp2-siken.com/kakomon/2016_1/42.html"}, {"s": "相続税路線価は、地価公示の公示価格の90％を価格水準の目安として設定されている。", "c": false, "r": "2015.5-41-2", "u": "https://fp2-siken.com/kakomon/2015_5/41.html"}, {"s": "相続税路線価は、地価公示の公示価格の70％を価格水準の目安として設定されている。", "c": false, "r": "2014.9-41-3", "u": "https://fp2-siken.com/kakomon/2014_9/41.html"}], "m": "<b>相続税路線価＝公示価格の80％</b>が目安。<b>70％は固定資産税評価額</b>——ここが入れ替えの定番。", "url": "https://fp2-siken.com/kakomon/2024_1/41.html", "ref": "2024.1-41-3"}, {"uid": "estate-6", "id": 6, "page": "estate", "bunya": "不動産", "freq": 14, "a": "都道府県地価調査の標準価格は、毎年7月1日を基準地の価格判定の基準日としている。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">都道府県地価調査は、都道府県が地域の土地価格を調べて公表する仕組みです。基準地の価格は、毎年<strong>7月1日時点</strong>で判定します。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">都道府県も、地域ごとの土地価格を毎年調べて発表しています。年の途中で、土地の値段がどのくらいかを見る調査です。\n\n価格を見る基準日は毎年<strong>7月1日</strong>です。</div></div>", "ans": true, "k": "これは適切。都道府県地価調査の標準価格は、国土利用計画法に基づき、都道府県知事が毎年 7月1日 における基準地の標準価格を判定するものです。\n\nこのテーマは関連問題を含めて<strong>14回</strong>まとまっている頻出論点。数字・年齢・期間・上限額などの条件整理が大事。<br><br>\n<div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>都道府県地価調査（基準地価）は、1月1日基準の地価公示を補完し、半年後の地価動向を示す役割を持ちます。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>「基準地価＝<strong style='color: #0b63c5;'>7月1日</strong>」は頻出の数字です。地価公示（1月1日）と入れ替えられることが多いので注意してください。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>1月と7月の両方のデータを見ることで、その年の地価の上がり下がりのトレンドを正確に把握することができます。</p>\n</div><div data-joushiki-copy=\"estate-6\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">1月の地価公示を、年の半ばの調査で補うと考えると役割をつかみやすいです。⚠️ <strong>暗記寄り</strong>：<strong>7月1日</strong>という基準日は暗記寄りです。</p></div>", "rel": [{"s": "都道府県地価調査の標準価格は、毎年1月1日を基準地の価格判定の基準日としている。", "c": false, "r": "2023.1-41-2", "u": "https://fp2-siken.com/kakomon/2023_1/41.html"}, {"s": "都道府県地価調査の標準価格は、毎年7月1日を基準地の価格判定の基準日としている。", "c": true, "r": "2022.5-42-2", "u": "https://fp2-siken.com/kakomon/2022_5/42.html"}, {"s": "都道府県地価調査の基準地の標準価格は、毎年7月1日を価格判定の基準日としている。", "c": true, "r": "2021.1-42-2", "u": "https://fp2-siken.com/kakomon/2021_1/42.html"}, {"s": "都道府県地価調査の基準地の標準価格は、毎年7月1日を価格判定の基準日としている。", "c": true, "r": "2020.1-42-2", "u": "https://fp2-siken.com/kakomon/2020_1/42.html"}, {"s": "都道府県地価調査の基準地は、地価公示の標準地と同じ地点に設定されることもある。", "c": true, "r": "2019.9-42-2", "u": "https://fp2-siken.com/kakomon/2019_9/42.html"}, {"s": "都道府県地価調査の基準地の標準価格は、毎年7月1日を価格判定の基準日としている。", "c": true, "r": "2019.5-41-4", "u": "https://fp2-siken.com/kakomon/2019_5/41.html"}, {"s": "都道府県地価調査の基準地は、地価公示の標準地と同じ地点に設定されることはない。", "c": false, "r": "2018.9-41-2", "u": "https://fp2-siken.com/kakomon/2018_9/41.html"}, {"s": "都道府県地価調査の基準地の標準価格は、各都道府県に設置された土地鑑定委員会が判定する。", "c": false, "r": "2017.9-41-2", "u": "https://fp2-siken.com/kakomon/2017_9/41.html"}, {"s": "都道府県地価調査の基準地の標準価格は、毎年1月1日を価格判定の基準日としている。", "c": false, "r": "2017.5-41-2", "u": "https://fp2-siken.com/kakomon/2017_5/41.html"}, {"s": "都道府県地価調査の基準地の標準価格は、毎年7月1日を価格判定の基準日としている。", "c": true, "r": "2017.1-42-2", "u": "https://fp2-siken.com/kakomon/2017_1/42.html"}, {"s": "都道府県地価調査の基準地は、地価公示の標準地と同じ地点に設定されることはない。", "c": false, "r": "2016.1-42-2", "u": "https://fp2-siken.com/kakomon/2016_1/42.html"}, {"s": "都道府県地価調査の基準地の標準価格は、毎年10月1日を価格判定の基準日としている。", "c": false, "r": "2014.9-41-2", "u": "https://fp2-siken.com/kakomon/2014_9/41.html"}, {"s": "都道府県地価調査の基準値の標準価格は、毎年7月1日を価格判定の基準日としている。", "c": true, "r": "2014.1-42-2", "u": "https://fp2-siken.com/kakomon/2014_1/42.html"}], "m": "都道府県地価調査の<b>基準地標準価格</b>＝基準日は毎年<b>7月1日</b>（都道府県）。", "url": "https://fp2-siken.com/kakomon/2024_1/41.html", "ref": "2024.1-41-2"}, {"uid": "risk-5", "id": 5, "page": "risk", "bunya": "リスク", "freq": 13, "a": "養老保険の満期保険金は、死亡保険金、高度障害保険金と<strong style='color: #0b63c5;'>同額である</strong>。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">養老保険は、保険期間中に亡くなったときは死亡保険金を、満期まで生存したときは満期保険金を受け取る保険です。死亡保険金・高度障害保険金・満期保険金は、<strong>同じ金額</strong>です。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">養老保険では、途中で亡くなったときにも、元気に満期を迎えたときにも、まとまったお金が出ます。\n\n死亡・重い障害・満期のどの場合も、受け取る額は<strong>同じ</strong>です。</div></div>", "ans": true, "k": "適切。\n養老保険は「生死混合保険」と呼ばれ、保険期間内に死亡・高度障害になれば保険金が支払われ、満了まで生存すれば<strong>同額の満期保険金</strong>が支払われます。\nどちらに転んでも同じ額がもらえるのが養老保険の特徴です。\n「満期＝死亡＝同額」とシンプルに覚えておこう！<br><br>\n<div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>養老保険は、「生きているうちに満期を迎えても」「途中で死んでしまっても（または高度障害になっても）」、必ず同じ額のお金がもらえる保険です。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>満期保険金と、死亡・高度障害保険金が「<strong style='color: #0b63c5;'>同額である</strong>」というのが養老保険の最大の特徴であり定義です。「異なる」とするフェイクに注意です。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>いつかは必ず保険金がもらえるため、掛け捨ての定期保険と違って保険料がかなり高額になりますが、貯蓄として確実に資金を準備したい人に向いています。</p>\n</div><div data-joushiki-copy=\"risk-5\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">「亡くなっても、生きて満期を迎えても同額」を受け取れるのが、養老保険の基本的な形です。保障と貯蓄を組み合わせた保険だと捉えると分かりやすいです。</p></div>", "rel": [{"s": "養老保険では、保険金の支払事由が発生せずに保険期間満了となった場合、死亡・高度障害保険金と同額の満期保険金を受け取ることができる。", "c": true, "r": "2023.9-12-1", "u": "https://fp2-siken.com/kakomon/2023_9/12.html"}, {"s": "養老保険では、保険金の支払事由に該当せずに保険期間満了となった場合、死亡・高度障害保険金と同額の満期保険金を受け取ることができる。", "c": true, "r": "2023.1-13-4", "u": "https://fp2-siken.com/kakomon/2023_1/13.html"}, {"s": "養老保険では、保険金の支払事由に該当せずに保険期間満了となった場合、死亡・高度障害保険金と同額の満期保険金を受け取ることができる。", "c": true, "r": "2021.5-12-2", "u": "https://fp2-siken.com/kakomon/2021_5/12.html"}, {"s": "養老保険の満期保険金は、死亡保険金、高度障害保険金と同額である。", "c": true, "r": "2021.3-13-2", "u": "https://fp2-siken.com/kakomon/2021_3/13.html"}, {"s": "養老保険は、保険金の支払事由に該当せずに保険期間満了となった場合、死亡・高度障害保険金と同額の満期保険金を受け取ることができる。", "c": true, "r": "2019.9-12-2", "u": "https://fp2-siken.com/kakomon/2019_9/12.html"}, {"s": "養老保険は、保険金の支払事由に該当せずに保険期間満了となった場合、死亡保険金と同額の満期保険金を受け取ることができる。", "c": true, "r": "2019.1-11-2", "u": "https://fp2-siken.com/kakomon/2019_1/11.html"}, {"s": "養老保険は、保険金の支払事由に該当せずに保険期間満了を迎えた場合、死亡保険金と同額の満期保険金を受け取ることができる。", "c": true, "r": "2017.9-12-1", "u": "https://fp2-siken.com/kakomon/2017_9/12.html"}, {"s": "養老保険では、被保険者が保険期間満了時まで生存している場合、死亡保険金と同額の満期保険金を受け取ることができる。", "c": true, "r": "2017.5-12-4", "u": "https://fp2-siken.com/kakomon/2017_5/12.html"}, {"s": "養老保険の被保険者が保険期間満了まで生存した場合、死亡・高度障害保険金と同額の満期保険金が支払われる。", "c": true, "r": "2016.9-12-2", "u": "https://fp2-siken.com/kakomon/2016_9/12.html"}, {"s": "養老保険は、被保険者が保険期間満了まで生存した場合、死亡・高度障害保険金と同額の満期保険金が支払われる。", "c": true, "r": "2014.9-13-4", "u": "https://fp2-siken.com/kakomon/2014_9/13.html"}, {"s": "養老保険の被保険者が保険期間満了まで生存した場合、死亡・高度障害保険金の80％相当額が満期保険金として支払われる。", "c": false, "r": "2014.1-12-4", "u": "https://fp2-siken.com/kakomon/2014_1/12.html"}, {"s": "養老保険では、保険期間満了まで生存した場合に支払われる満期保険金は、死亡・高度障害保険金と同額である。", "c": true, "r": "2013.5-11-2", "u": "https://fp2-siken.com/kakomon/2013_5/11.html"}], "m": "養老保険は<b>満期保険金＝死亡保険金＝高度障害保険金</b>で同額。", "url": "https://fp2-siken.com/kakomon/2016_5/13.html", "ref": "2016.5-13-1"}, {"uid": "estate-9", "id": 9, "page": "estate", "bunya": "不動産", "freq": 13, "a": "普通借地権の設定契約は、公正証書によってしなければならない。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">普通借地権は、建物を持つために土地を長く借りる一般的な権利です。この契約は、必ず公証人が作る<strong>公正証書</strong>で結ばなければなりません。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">人の土地を借りて、その上に自分の家を建てる契約があります。ここでいう普通借地権は、その一般的なタイプです。\n\nこの契約は必ず、公証人が作る正式な文書である<strong>公正証書</strong>で結ばなければなりません。</div></div>", "ans": false, "k": "これは不適切。普通借地権の契約については、借地借家法上、契約の形式に特段の定めはありません。したがって、公正証書はもちろん、私文書による書面契約や口頭での合意によっても法律上は有効に成立します。\n\nこのテーマは関連問題を含めて<strong>13回</strong>まとまっている頻出論点。要件・例外・できる／できないの区別が大事。<br><br>\n<div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>普通借地権は、契約期間が満了しても正当事由がない限り更新される、借り手に有利な契約です。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>普通借地権は「<strong style='color: #d11a2a;'>口頭でも有効</strong>」です（必ずしも公正証書等の書面は必要ありません）。必ず書面が必要なのは「一般定期借地権」や「事業用定期借地権」などです。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>昔からの地主と借地人の間では、契約書が存在せず「口約束」だけで長年土地を借りているケースが多々ありますが、これも法的には有効な普通借地権として扱われます。</p>\n</div><div data-joushiki-copy=\"estate-9\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">普通借地権は昔から口約束で続く例もあるため、形式を一つに限るとは考えにくいです。書面が必要な定期借地権と区別します。</p></div>", "rel": [{"s": "定期借家契約は、公正証書によってしなければならない。", "c": false, "r": "2025.1-45-1", "u": "https://fp2-siken.com/kakomon/2025_1/45.html"}, {"s": "もっぱら事業の用に供する建物の所有を目的として一般定期借地権を設定する場合、その契約は公正証書によってしなければならない。", "c": false, "r": "2024.9-43-4", "u": "https://fp2-siken.com/kakomon/2024_9/43.html"}, {"s": "一般定期借地権の設定契約は、公正証書による等書面（電磁的記録による場合を含む）によってしなければならない。", "c": true, "r": "2023.9-44-4", "u": "https://fp2-siken.com/kakomon/2023_9/44.html"}, {"s": "普通借地権の設定契約は、公正証書による等書面（電磁的記録による場合を含む）によってしなければならない。", "c": false, "r": "2021.9-43-1", "u": "https://fp2-siken.com/kakomon/2021_9/43.html"}, {"s": "定期借家契約は、公正証書によって締結しなければならない。", "c": false, "r": "2021.1-44-4", "u": "https://fp2-siken.com/kakomon/2021_1/44.html"}, {"s": "事業用定期借地権等の設定を目的とする契約は、書面によってしなければならないが、その書面が公正証書である必要はない。", "c": false, "r": "2020.9-44-4", "u": "https://fp2-siken.com/kakomon/2020_9/44.html"}, {"s": "事業用定期借地権等の設定を目的とする契約は、公正証書によってしなければならない。", "c": true, "r": "2019.5-44-4", "u": "https://fp2-siken.com/kakomon/2019_5/44.html"}, {"s": "定期借家契約は、公正証書によって締結しなければならない。", "c": false, "r": "2018.9-44-1", "u": "https://fp2-siken.com/kakomon/2018_9/44.html"}, {"s": "事業用定期借地権等の設定を目的とする契約は、公正証書によって締結しなければならない。", "c": true, "r": "2018.5-44-3", "u": "https://fp2-siken.com/kakomon/2018_5/44.html"}, {"s": "定期借家契約は、公正証書によって締結しなければ無効となる。", "c": false, "r": "2016.1-44-2", "u": "https://fp2-siken.com/kakomon/2016_1/44.html"}, {"s": "事業用定期借地権等の設定を目的とする契約は、公正証書によって締結しなければならない。", "c": true, "r": "2015.1-43-3", "u": "https://fp2-siken.com/kakomon/2015_1/43.html"}, {"s": "建物譲渡特約付借地権の設定契約において、建物譲渡特約は公正証書によって定めなければならない。", "c": false, "r": "2014.5-42-4", "u": "https://fp2-siken.com/kakomon/2014_5/42.html"}], "m": "普通借地権の設定契約に<b>方式の定めはない</b>（口頭でも成立）。<b>公正証書が必須なのは事業用定期借地権だけ</b>。一般定期借地権・定期借家は「書面」でよい。", "url": "https://fp2-siken.com/kakomon/2025_5/43.html", "ref": "2025.5-43-4"}, {"uid": "estate2-7", "id": 7, "page": "estate2", "bunya": "不動産", "freq": 12, "a": "不動産の登記事項証明書の交付を受けることができるのは、その不動産の<strong style='color: #d11a2a;'>所有者に限られる</strong>。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">登記事項証明書には、不動産の所有者や抵当権などが記録されています。この証明書を請求できるのは、<strong>その不動産の所有者本人だけ</strong>です。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">家や土地の登記事項証明書を見ると、持ち主や抵当権などを確認できます。売買の前に、買主が他人名義の物件の証明書を取ろうとしています。\n\n請求できるのは<strong>その物件の所有者本人だけ</strong>です。</div></div>", "ans": false, "k": "不適切。不動産の登記事項証明書は、所有者に限らず<strong>誰でも</strong>交付を受けることができます。\n不動産登記制度は取引の安全を守るための公示制度なので、広く公開されているのがポイント。\n手数料を払えば法務局で誰でも取得可能。これは不動産取引の透明性を確保するための大切な仕組みだよ。<br><br>\n<div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>不動産登記は、世の中の誰でもその土地や建物の権利関係を確認できるようにするための公開制度（公示制度）です。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>不動産の登記事項証明書は、「<strong style='color: #d11a2a;'>所有者に限らず誰でも</strong>」手数料を払えば交付を受けることができます。プライバシー保護を理由に所有者に限定されるというフェイクがよく出ます。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>気になる空き家を見つけたら、法務局で登記簿をとって持ち主を調べ、直接「家を売りませんか？」と手紙を出す業者がたくさんいます。</p>\n</div><div data-joushiki-copy=\"estate2-7\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">不動産を買う人が権利関係を確認できなければ、安全に取引できません。そのため、手数料を払えば<strong>所有者以外でも請求できます</strong>。</p></div>", "rel": [{"s": "不動産の登記事項証明書の交付を請求することができるのは、当該不動産の利害関係者に限られる。", "c": false, "r": "2025.5-41-4", "u": "https://fp2-siken.com/kakomon/2025_5/41.html"}, {"s": "不動産の登記事項証明書の交付を請求することができるのは、当該不動産に利害関係を有する者に限られる。", "c": false, "r": "2023.1-42-2", "u": "https://fp2-siken.com/kakomon/2023_1/42.html"}, {"s": "不動産の登記事項証明書の交付を請求することができるのは、当該不動産の利害関係者に限られる。", "c": false, "r": "2022.9-41-4", "u": "https://fp2-siken.com/kakomon/2022_9/41.html"}, {"s": "不動産の登記事項証明書の交付を請求することができるのは、当該不動産に利害関係を有する者に限られる。", "c": false, "r": "2022.5-41-2", "u": "https://fp2-siken.com/kakomon/2022_5/41.html"}, {"s": "不動産の登記事項証明書の交付を請求することができるのは、当該不動産に利害関係を有する者に限られる。", "c": false, "r": "2021.9-41-2", "u": "https://fp2-siken.com/kakomon/2021_9/41.html"}, {"s": "不動産の登記事項証明書の交付を受けることができるのは、その不動産の所有者に限られる。", "c": false, "r": "2021.3-41-1", "u": "https://fp2-siken.com/kakomon/2021_3/41.html"}, {"s": "不動産の登記事項証明書の交付を請求することができるのは、当該不動産に利害関係を有する者に限られる。", "c": false, "r": "2021.1-41-2", "u": "https://fp2-siken.com/kakomon/2021_1/41.html"}, {"s": "不動産の登記事項証明書の交付を請求することができるのは、当該不動産に利害関係を有する者に限られる。", "c": false, "r": "2020.1-41-2", "u": "https://fp2-siken.com/kakomon/2020_1/41.html"}, {"s": "不動産の登記事項証明書の交付を請求することができるのは、当該不動産に利害関係を有する者に限られる。", "c": false, "r": "2018.5-41-3", "u": "https://fp2-siken.com/kakomon/2018_5/41.html"}, {"s": "不動産の登記事項証明書の交付を受けることができる者は、原則として、その不動産の所有者に限られる。", "c": false, "r": "2016.1-41-3", "u": "https://fp2-siken.com/kakomon/2016_1/41.html"}, {"s": "不動産の登記事項証明書の交付を受けることができるのは、当該不動産の利害関係者に限られる。", "c": false, "r": "2013.9-41-3", "u": "https://fp2-siken.com/kakomon/2013_9/41.html"}], "m": "登記事項証明書は<b>誰でも</b>交付を請求できる（手数料を払えば所有者以外も可）。登記は公示制度だから。", "url": "https://fp2-siken.com/kakomon/2015_1/41.html", "ref": "2015.1-41-3"}, {"uid": "finance-2", "id": 2, "page": "finance", "bunya": "金融", "freq": 11, "a": "期日指定定期預金は、<strong style='color: #0b63c5;'>据置期間</strong>経過後から最長預入期日までの任意の日を満期日として指定することができる。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">期日指定定期預金は、最初から満期日を一日に固定せず、あとで受取日を決められる定期預金です。<strong>決められた据置期間が過ぎたあと</strong>なら、最長の預入期限までの好きな日を満期日にできます。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">定期預金でも、「この日に必ず受け取る」と最初から決めなくてよいものがあります。しばらく預けておけば、あとで都合のよい受取日を選べます。\n\n<strong>決められた待ち期間のあと</strong>なら、最長の預入期限までの好きな日を満期日にできます。</div></div>", "ans": true, "k": "これは<strong>適切</strong>です。<br>期日指定定期預金は、預入後<strong>1年間</strong>の据置期間を経過した後、最長預入期日（3年）までの間で自由に満期日を指定できます。<br>「後から満期を決められる」のが最大の特徴です。<br>ひっかけポイント：「金融機関が指定する」という選択肢が出たら×。指定するのはあくまで預金者本人です。<br><br>\n<div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>将来の資金需要がはっきりしない場合でも、1年経てば自由に解約日を決められる利便性を提供するために作られました。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>据置期間（1年）と最長預入期日（3年）の数字、および「預金者が指定する」のかが問われます。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>3年以内に使う予定がある教育資金や引っ越し費用の保管場所として非常に使い勝手が良い商品です。</p>\n</div><div data-joushiki-copy=\"finance-2\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">すぐには引き出せない代わりに、一定期間を過ぎれば預金者の予定に合わせられる商品だと考えると自然です。⚠️ <strong>据置期間や最長期間は暗記寄り</strong>です。</p></div>", "rel": [{"s": "期日指定定期預金は、据置期間経過後から最長預入期日までの間で、金融機関が指定した日が満期日となる。", "c": false, "r": "2024.5-22-3", "u": "https://fp2-siken.com/kakomon/2024_5/22.html"}, {"s": "期日指定定期預金は、据置期間経過後から最長預入期日までの間で、任意の日を満期日として指定することができる。", "c": true, "r": "2023.1-21-3", "u": "https://fp2-siken.com/kakomon/2023_1/21.html"}, {"s": "期日指定定期預金は、据置期間経過後から最長預入期日までの間で、金融機関が指定した日が満期日となる。", "c": false, "r": "2022.1-21-1", "u": "https://fp2-siken.com/kakomon/2022_1/21.html"}, {"s": "期日指定定期預金は、据置期間経過後から最長預入期日までの任意の日を満期日として指定することができる。", "c": true, "r": "2021.5-22-3", "u": "https://fp2-siken.com/kakomon/2021_5/22.html"}, {"s": "期日指定定期預金は、据置期間経過後から最長預入期日までの任意の日を満期日として指定することができる。", "c": true, "r": "2021.3-21-3", "u": "https://fp2-siken.com/kakomon/2021_3/21.html"}, {"s": "期日指定定期預金は、据置期間経過後から最長預入期日までの間で、預金者が指定した日を満期日とすることができる。", "c": true, "r": "2021.1-22-1", "u": "https://fp2-siken.com/kakomon/2021_1/22.html"}, {"s": "期日指定定期預金は、据置期間経過後から最長預入期日までの間で、預金者が指定した日を満期日とすることができる。", "c": true, "r": "2019.5-21-1", "u": "https://fp2-siken.com/kakomon/2019_5/21.html"}, {"s": "期日指定定期預金は、据置期間経過後は最長預入期日までの任意の日を満期日として指定することができる。", "c": true, "r": "2016.9-22-1", "u": "https://fp2-siken.com/kakomon/2016_9/22.html"}, {"s": "期日指定定期預金は、据置期間経過後から最長預入期日までの任意の日を満期日として指定することができる。", "c": true, "r": "2014.9-22-3", "u": "https://fp2-siken.com/kakomon/2014_9/22.html"}, {"s": "期日指定定期預金は、据置期間経過後から最長預入期日までの任意の日を満期日として指定することができる。", "c": true, "r": "2014.1-21-3", "u": "https://fp2-siken.com/kakomon/2014_1/21.html"}], "m": "期日指定定期預金は、据置期間（1年）経過後から最長預入期日までの<b>任意の日</b>を満期日に指定できる。", "url": "https://fp2-siken.com/kakomon/2016_1/22.html", "ref": "2016.1-22-2"}, {"uid": "estate-19", "id": 19, "page": "estate", "bunya": "不動産", "freq": 11, "a": "3,000万円特別控除は、居住用財産を配偶者に譲渡した場合には適用を受けることができない。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">マイホームを売った利益から3,000万円まで差し引ける特例があります。ただし、売る相手が<strong>配偶者</strong>なら、この特例は使えません。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">マイホームを売った利益には、3,000万円まで差し引ける制度があります。ただし、身近な人への売却には制限があります。\n\n売る相手が<strong>配偶者</strong>なら、その制度は使えません。</div></div>", "ans": true, "k": "これは適切。3,000万円特別控除は、譲渡先が配偶者、直系血族、生計を一にする親族などの特別の関係がある人の場合には適用を受けることができません。\n\nこのテーマは関連問題を含めて<strong>11回</strong>まとまっている頻出論点。数字・年齢・期間・上限額などの条件整理が大事。<br><br>\n<div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>マイホームの3,000万円特別控除は、無税枠を不正に利用（租税回避）するのを防ぐため、夫婦間や親子間など「特別な関係者」への譲渡には適用されません。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>売った相手が配偶者、直系血族、生計を一にする親族、同族会社等である場合は「<strong style='color: #0b63c5;'>適用を受けることができない</strong>」という点が重要です。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>「名義を妻に移して3,000万控除を使う」といった裏技は税務署はお見通しで、法律でしっかり禁止されています。</p>\n</div><div data-joushiki-copy=\"estate-19\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">夫婦間の売買でも使えると、名義を動かすだけで税金を避けやすくなります。身近な関係者への売却は対象外、と考えると自然です。</p></div>", "rel": [{"s": "3,000万円特別控除は、居住用財産を配偶者に譲渡した場合には適用を受けることができない。", "c": true, "r": "2023.1-49-1", "u": "https://fp2-siken.com/kakomon/2023_1/49.html"}, {"s": "3,000万円特別控除は、居住用財産を配偶者に譲渡した場合には適用を受けることができない。", "c": true, "r": "2022.1-49-1", "u": "https://fp2-siken.com/kakomon/2022_1/49.html"}, {"s": "3,000万円特別控除は、居住用財産を配偶者に譲渡した場合には適用を受けることができない。", "c": true, "r": "2021.9-49-1", "u": "https://fp2-siken.com/kakomon/2021_9/49.html"}, {"s": "3,000万円特別控除は、居住用財産を配偶者に譲渡した場合には適用を受けることができない。", "c": true, "r": "2021.5-49-2", "u": "https://fp2-siken.com/kakomon/2021_5/49.html"}, {"s": "3,000万円特別控除は、居住用財産を配偶者に対して譲渡した場合には適用を受けることができない。", "c": true, "r": "2021.3-48-1", "u": "https://fp2-siken.com/kakomon/2021_3/48.html"}, {"s": "3,000万円特別控除は、居住用財産を配偶者に譲渡した場合には適用を受けることができない。", "c": true, "r": "2020.1-49-1", "u": "https://fp2-siken.com/kakomon/2020_1/49.html"}, {"s": "3,000万円特別控除は、居住用財産を配偶者に譲渡した場合でも、適用を受けることができる。", "c": false, "r": "2019.5-49-2", "u": "https://fp2-siken.com/kakomon/2019_5/49.html"}, {"s": "3,000万円特別控除は、子に居住用財産を譲渡した場合には適用を受けることができない。", "c": true, "r": "2018.5-48-2", "u": "https://fp2-siken.com/kakomon/2018_5/48.html"}, {"s": "居住用財産を譲渡した場合の3,000万円の特別控除は、配偶者に対して譲渡した場合には適用を受けることができない。", "c": true, "r": "2018.1-49-3", "u": "https://fp2-siken.com/kakomon/2018_1/49.html"}, {"s": "3,000万円特別控除は、居住用財産を配偶者に譲渡した場合であっても適用を受けることができる。", "c": false, "r": "2017.5-49-2", "u": "https://fp2-siken.com/kakomon/2017_5/49.html"}], "m": "3,000万円特別控除は<b>配偶者・直系血族など特別関係者への譲渡には適用不可</b>。", "url": "https://fp2-siken.com/kakomon/2024_5/48.html", "ref": "2024.5-48-1"}, {"uid": "estate2-10", "id": 10, "page": "estate2", "bunya": "不動産", "freq": 11, "a": "都市計画区域には、都市計画に区域区分（市街化区域・<strong style='color: #0b63c5;'>市街化調整区域</strong>）が定められていない区域がある。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">都市計画区域は、すべてが市街化区域と市街化調整区域の二つに分けられているわけではありません。どちらにも区分されていない<strong>非線引きの区域</strong>もあります。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">都市計画区域の中には、街を広げる区域と、開発を抑える区域があります。ただし、すべての地域が必ずその二つに分かれているとは限りません。\n\nどちらにも分けていない<strong>非線引きの区域</strong>もあります。</div></div>", "ans": true, "k": "適切。都市計画区域には、市街化区域・市街化調整区域の区域区分が<strong>定められていない区域</strong>（非線引き区域）が存在します。\nすべての都市計画区域で線引き（区域区分）が行われているわけではないんだね。\n非線引き区域では用途地域が定められていないことも多く、比較的自由に開発できる地域もあるよ。<br><br>\n<div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>都市計画区域には、「市街化区域」「市街化調整区域」に線引きされる区域と、どちらにも線引きされない区域があります。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>この線引きされていない区域を「<strong style='color: #0b63c5;'>非線引区域</strong>（非線引都市計画区域）」と呼びます。すべての都市計画区域が必ずどちらかに分けられるわけではありません。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>非線引区域は、地方の中小都市などに多く見られ、開発の規制が市街化区域と市街化調整区域の中間くらいの緩さになっています。</p>\n</div><div data-joushiki-copy=\"estate2-10\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">都市の規模や地域事情はさまざまなので、全国すべてを同じ二分類にするとは限りません。線引きをしていない都市計画区域もあります。</p></div>", "rel": [{"s": "都市計画区域として指定された区域では、計画的な市街化を図るため、都市計画に市街化区域と市街化調整区域との区分を定めなければならない。", "c": false, "r": "2025.5-45-1", "u": "https://fp2-siken.com/kakomon/2025_5/45.html"}, {"s": "すべての都市計画区域において、都市計画に市街化区域と市街化調整区域の区域区分を定めなければならない。", "c": false, "r": "2024.9-44-1", "u": "https://fp2-siken.com/kakomon/2024_9/44.html"}, {"s": "すべての都市計画区域について、都市計画に市街化区域と市街化調整区域の区域区分を定めなければならない。", "c": false, "r": "2024.1-44-1", "u": "https://fp2-siken.com/kakomon/2024_1/44.html"}, {"s": "すべての都市計画区域において、都市計画に市街化区域と市街化調整区域の区分（区域区分）を定めなければならない。", "c": false, "r": "2023.5-45-1", "u": "https://fp2-siken.com/kakomon/2023_5/45.html"}, {"s": "すべての都市計画区域において、都市計画に市街化区域と市街化調整区域との区分（区域区分）を定めるものとされている。", "c": false, "r": "2022.9-45-1", "u": "https://fp2-siken.com/kakomon/2022_9/45.html"}, {"s": "すべての都市計画区域内において、都市計画に市街化区域と市街化調整区域の区分（区域区分）を定めなければならない。", "c": false, "r": "2021.9-45-1", "u": "https://fp2-siken.com/kakomon/2021_9/45.html"}, {"s": "都道府県は、すべての都市計画区域において、市街化区域と市街化調整区域との区分（区域区分）を定めなければならないとされている。", "c": false, "r": "2021.5-44-1", "u": "https://fp2-siken.com/kakomon/2021_5/44.html"}, {"s": "三大都市圏の一定の区域や一定の大都市の都市計画区域においては、都市計画に市街化区域と市街化調整区域との区分を定めるものとされている。", "c": true, "r": "2021.1-45-4", "u": "https://fp2-siken.com/kakomon/2021_1/45.html"}, {"s": "すべての都市計画区域において、都市計画に市街化区域と市街化調整区域の区分を定めなければならない。", "c": false, "r": "2019.5-45-1", "u": "https://fp2-siken.com/kakomon/2019_5/45.html"}, {"s": "すべての都市計画区域について、都市計画に市街化区域と市街化調整区域の区域区分を定めなければならないとされている。", "c": false, "r": "2014.5-44-1", "u": "https://fp2-siken.com/kakomon/2014_5/44.html"}], "m": "区域区分（線引き）は<b>任意</b>なので、<b>非線引き都市計画区域</b>が存在する。", "url": "https://fp2-siken.com/kakomon/2015_5/45.html", "ref": "2015.5-45-1"}, {"uid": "risk-8", "id": 8, "page": "risk", "bunya": "リスク", "freq": 10, "a": "終身保険に付加された傷害特約の保険料は、<strong style='color: #0b63c5;'>生命保険料控除の対象とならない</strong>。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">終身保険に、事故によるけがや死亡などを保障する傷害特約を付けた場合です。その<strong>傷害特約の保険料</strong>は、生命保険料控除の対象にはなりません。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">一生涯の死亡保険に、事故によるけがなどをカバーする追加の保障を付けた場面です。\n\nその追加部分に払った<strong>傷害特約の保険料は、生命保険料控除には使えません</strong>。</div></div>", "ans": true, "k": "これは適切。2012年1月1日以後に締結した災害割増特約・傷害特約の保険料は、生命保険料控除の対象外となります。生死により保険金が支払われるもの、傷病の医療費支払を事由として保険金が支払われるもののどちらにも該当しないからです。\n\nこのテーマは関連問題を含めて<strong>10回</strong>まとまっている頻出論点。要件・例外・できる／できないの区別が大事。<br><br>\n<div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>生命保険（死亡保障）に、ケガでの入院・手術を補償する「傷害特約」を上乗せした場合の税金の扱いです。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>傷害特約の保険料部分は、死亡を保障するものではないため「<strong style='color: #0b63c5;'>生命保険料控除の対象となりません</strong>」。（※介護・医療を保障する特約であれば介護医療保険料控除の対象になります）。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>保険会社から送られてくる「控除証明書」には、対象とならない特約分の保険料があらかじめ差し引かれた金額が記載されているため、その数字をそのまま年末調整の書類に書けば大丈夫です。</p>\n</div><div data-joushiki-copy=\"risk-8\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">生命保険に付けた特約でも、すべての保険料が税の優遇を受けるとは限りません。傷害だけを保障する部分は生命保険料控除の対象外です。</p></div>", "rel": [{"s": "2012年1月1日以後に締結した生命保険契約に付加された傷害特約の保険料は、生命保険料控除の対象となる。", "c": false, "r": "2023.9-15-1", "u": "https://fp2-siken.com/kakomon/2023_9/15.html"}, {"s": "終身保険に付加された傷害特約の保険料は、介護医療保険料控除の対象とならない。", "c": true, "r": "2023.5-14-4", "u": "https://fp2-siken.com/kakomon/2023_5/14.html"}, {"s": "生命保険契約に付加された傷害特約の保険料は、介護医療保険料控除の対象となる。", "c": false, "r": "2022.5-13-2", "u": "https://fp2-siken.com/kakomon/2022_5/13.html"}, {"s": "2025年4月に締結した生命保険契約に付加された災害割増特約の保険料は、一般の生命保険料控除の対象となる。", "c": false, "r": "2021.1-13-3", "u": "https://fp2-siken.com/kakomon/2021_1/13.html"}, {"s": "2012年1月1日以後に締結した生命保険契約に付加された傷害特約の保険料は、一般の生命保険料控除の対象となる。", "c": false, "r": "2020.1-13-3", "u": "https://fp2-siken.com/kakomon/2020_1/13.html"}, {"s": "2012年1月1日以後に締結した生命保険契約に付加された傷害特約の保険料は、介護医療保険料控除の対象となる。", "c": false, "r": "2019.5-14-3", "u": "https://fp2-siken.com/kakomon/2019_5/14.html"}, {"s": "2012年1月1日以後に締結した生命保険契約に付加された傷害特約の保険料は、一般の生命保険料控除の対象となる。", "c": false, "r": "2019.1-14-2", "u": "https://fp2-siken.com/kakomon/2019_1/14.html"}, {"s": "2012年1月1日以後に締結した生命保険契約に付加された傷害特約の保険料は、「一般の生命保険料控除」の対象となる。", "c": false, "r": "2018.9-13-2", "u": "https://fp2-siken.com/kakomon/2018_9/13.html"}, {"s": "2012年1月1日以後に締結した生命保険契約に付加された傷害特約の保険料は、「介護医療保険料控除」の対象となる。", "c": false, "r": "2017.9-13-4", "u": "https://fp2-siken.com/kakomon/2017_9/13.html"}], "m": "<b>傷害特約・災害割増特約</b>の保険料は<b>生命保険料控除の対象外</b>（身体の傷害のみを対象とする特約のため）。", "url": "https://fp2-siken.com/kakomon/2025_1/14.html", "ref": "2025.1-14-2"}, {"uid": "risk-9", "id": 9, "page": "risk", "bunya": "リスク", "freq": 10, "a": "国内旅行傷害保険では、国内旅行中の<strong style='color: #0b63c5;'>細菌性食中毒</strong>も補償の対象となる。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">国内旅行傷害保険は、日本国内を旅行中の事故やけがに備える保険です。旅行先で食べた物が原因の<strong>細菌性食中毒</strong>も、補償の対象になります。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">国内旅行中に、旅先で食べた料理が原因で食中毒になった場面です。\n\n国内旅行の保険では、転んだけがなどに加え、細菌による<strong>食中毒も補償されます</strong>。</div></div>", "ans": true, "k": "適切。\n国内旅行傷害保険では、<strong>細菌性食中毒</strong>が基本契約で補償されます。\n普通の傷害保険では食中毒は対象外ですが、旅行保険は特別にカバーしてくれます。\n海外旅行保険も同様に食中毒は補償対象です。\n覚え方：旅行保険＝食中毒OK（旅先で当たっても安心！）<br><br>\n<div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>旅行保険における食中毒の取扱いの違いです。国内旅行傷害保険は、旅行中の事故によるケガなどを広く補償します。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>国内旅行傷害保険では「<strong style='color: #0b63c5;'>細菌性食中毒</strong>」も補償の対象となります。これが「普通傷害保険」だと対象外になる（※特約が必要）という違いが頻出です。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>旅行先の旅館で出た料理にあたって食中毒になり、病院で治療を受けた場合、国内旅行傷害保険に入っていればその治療費が補償されます。</p>\n</div><div data-joushiki-copy=\"risk-9\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">旅行では、転倒や交通事故だけでなく、旅先の食事による食中毒も代表的な危険です。国内旅行保険では、その旅行特有の危険も補償に含めています。</p></div>", "rel": [{"s": "国内旅行傷害保険では、被保険者が旅行中の飲食により細菌性食中毒を発症した場合、補償の対象となる。", "c": true, "r": "2024.9-17-4", "u": "https://fp2-siken.com/kakomon/2024_9/17.html"}, {"s": "国内旅行傷害保険では、被保険者が旅行中の飲食により細菌性食中毒を発症した場合、補償の対象となる。", "c": true, "r": "2022.9-18-3", "u": "https://fp2-siken.com/kakomon/2022_9/18.html"}, {"s": "国内旅行傷害保険では、国内旅行中にかかった細菌性食中毒は補償の対象となる。", "c": true, "r": "2021.5-16-3", "u": "https://fp2-siken.com/kakomon/2021_5/16.html"}, {"s": "国内旅行傷害保険では、国内旅行中の飲食による細菌性食中毒は補償の対象とならない。", "c": false, "r": "2021.1-16-4", "u": "https://fp2-siken.com/kakomon/2021_1/16.html"}, {"s": "国内旅行傷害保険では、国内旅行中にかかった細菌性食中毒は補償の対象とならない。", "c": false, "r": "2019.9-16-2", "u": "https://fp2-siken.com/kakomon/2019_9/16.html"}, {"s": "国内旅行傷害保険は、旅行中の食事を原因とする細菌性食中毒も補償の対象となる。", "c": true, "r": "2017.1-17-4", "u": "https://fp2-siken.com/kakomon/2017_1/17.html"}, {"s": "国内旅行傷害保険では、旅行中の食事による細菌性食中毒は補償の対象となる。", "c": true, "r": "2016.1-16-3", "u": "https://fp2-siken.com/kakomon/2016_1/16.html"}, {"s": "国内旅行傷害保険では、国内旅行中にかかった細菌性食中毒は補償の対象とならない。", "c": false, "r": "2015.9-16-4", "u": "https://fp2-siken.com/kakomon/2015_9/16.html"}, {"s": "国内旅行傷害保険では、国内旅行中にかかった細菌性食中毒も補償の対象となる。", "c": true, "r": "2014.5-16-4", "u": "https://fp2-siken.com/kakomon/2014_5/16.html"}], "m": "国内旅行傷害保険は<b>細菌性食中毒を補償する</b>。※<b>普通傷害保険は対象外</b>——ここが対比。", "url": "https://fp2-siken.com/kakomon/2015_10/18.html", "ref": "2015.10-18-2"}, {"uid": "tax-11", "id": 11, "page": "tax", "bunya": "タックス", "freq": 10, "a": "先物取引に係る雑所得の金額の計算上生じた損失の金額は、不動産所得の金額と<strong style='color: #d11a2a;'>損益通算することができる</strong>。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">先物取引で損失が出た場合、その損を別の所得から差し引いて税金を計算します。この先物取引の損失は、家賃収入などの<strong>不動産所得と損益通算できます</strong>。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">先物取引で損をした一方で、アパートの家賃などでは利益が出ていた場面です。二つを相殺できれば、税金をかける所得は小さくなります。\n\n先物取引の損失は、家賃による<strong>不動産所得から差し引けます</strong>。</div></div>", "ans": false, "k": "❌ <strong>不適切</strong>です。<br><br>先物取引に係る雑所得の損失は、他の所得（不動産所得など）と「<span style='background: linear-gradient(transparent 70%, #fff3e0 70%); font-weight: bold;'>損益通算できません</span>」。<br><br>\n<div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>先物取引やFXなどで生じた損益は「申告分離課税」となるため、給与所得や不動産所得などの総合課税の所得とは切り離して計算します。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>先物取引に係る雑所得の損失は、不動産所得などの他の所得と「<strong style='color: #d11a2a;'>損益通算することができる</strong>」というのは誤りです。通算できません。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>FXで大損しても、アパート経営の利益と相殺して税金を減らすことはできません。ただし、先物取引同士での内部通算や、翌年以降への3年間の繰越控除は可能です。</p>\n</div><div data-joushiki-copy=\"tax-11\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">先物取引はほかの所得と分けて税金を計算するため、家賃収入とは同じグループではありません。損失は一定の先物取引の利益とは通算できますが、<strong>不動産所得とは通算できません</strong>。</p></div>", "rel": [{"s": "先物取引に係る雑所得の金額の計算上生じた損失の金額は、不動産所得の金額と損益通算することができる。", "c": false, "r": "2024.1-33-1", "u": "https://fp2-siken.com/kakomon/2024_1/33.html"}, {"s": "先物取引に係る雑所得の金額の計算上生じた損失の金額は、上場株式等に係る譲渡所得の金額と損益通算することができる。", "c": false, "r": "2023.9-33-2", "u": "https://fp2-siken.com/kakomon/2023_9/33.html"}, {"s": "先物取引に係る雑所得の金額の計算上生じた損失の金額は、不動産所得の金額と損益通算することができる。", "c": false, "r": "2023.5-33-2", "u": "https://fp2-siken.com/kakomon/2023_5/33.html"}, {"s": "公的年金等以外の雑所得の金額の計算上生じた損失の金額は、不動産所得の金額と損益通算することができる。", "c": false, "r": "2021.5-32-1", "u": "https://fp2-siken.com/kakomon/2021_5/32.html"}, {"s": "別荘を譲渡したことによる譲渡所得の金額の計算上生じた損失の金額は、他の各種所得の金額と損益通算することができない。", "c": true, "r": "2020.9-33-4", "u": "https://fp2-siken.com/kakomon/2020_9/33.html"}, {"s": "一時所得の金額の計算上生じた損失の金額は、他の各種所得の金額と損益通算することができない。", "c": true, "r": "2017.5-33-2", "u": "https://fp2-siken.com/kakomon/2017_5/33.html"}, {"s": "別荘を譲渡したことによる譲渡所得の金額の計算上生じた損失の金額は、他の各種所得の金額と損益通算することができない。", "c": true, "r": "2014.9-33-1", "u": "https://fp2-siken.com/kakomon/2014_9/33.html"}, {"s": "原稿料を受け取ったことによる雑所得の金額の計算上生じた損失の金額は、他の各種所得の金額と損益通算することができる。", "c": false, "r": "2014.1-32-3", "u": "https://fp2-siken.com/kakomon/2014_1/32.html"}, {"s": "業務用車両の譲渡に係る譲渡所得の金額の計算上生じた損失の金額は、他の所得の金額と損益通算することができる。", "c": true, "r": "2013.9-34-4", "u": "https://fp2-siken.com/kakomon/2013_9/34.html"}], "m": "先物取引の雑所得の損失は<b>損益通算できない</b>。通算できるのは<b>不・事・山・譲</b>の損失だけ。（先物取引は申告分離課税の中で3年繰越可）", "url": "https://fp2-siken.com/kakomon/2025_5/33.html", "ref": "2025.5-33-2"}, {"uid": "tax-14", "id": 14, "page": "tax", "bunya": "タックス", "freq": 10, "a": "不動産の貸付けが事業的規模である場合、その貸付けによる所得は<strong style='color: #d11a2a;'>事業所得となる</strong>。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">アパートなどの貸付けが、ある程度大きな事業の規模で行われている場合です。規模が大きければ、その家賃などによる所得は<strong>事業所得になります</strong>。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">アパートを何棟も持つなど、大きな規模で不動産を貸している場面です。規模が大きいなら、普通の商売と同じ所得の種類になります。\n\n事業らしい規模で貸している場合、家賃の利益は<strong>事業所得になります</strong>。</div></div>", "ans": false, "k": "❌ <strong>不適切</strong>です。<br><br>不動産の貸付けで得た所得は、事業的規模（5棟10室以上など）であっても「<span style='background: linear-gradient(transparent 70%, #fff3e0 70%); font-weight: bold;'>不動産所得</span>」のままです。<br><br>\n<div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>アパートやマンションの貸付けによる所得の区分の問題です。不動産の貸付けは、いくら規模が大きくなっても「不動産所得」のままです。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>事業的規模（5棟10室基準など）である場合、その所得は「<strong style='color: #d11a2a;'>事業所得となる</strong>」というのは典型的なフェイクです。事業所得に昇格（？）することはありません。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>事業的規模になると「青色申告特別控除が最大65万円になる」「家族への給料が全額経費にできる」といった特典はありますが、所得の箱は不動産所得のままです。</p>\n</div><div data-joushiki-copy=\"tax-14\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">事業のような規模でも、お金の生まれ方は不動産の貸付けです。そのため所得区分は<strong>不動産所得のまま</strong>で、規模は控除などの扱いに影響します。</p></div>", "rel": [{"s": "個人による不動産の貸付が事業的規模で行われている場合、その賃貸収入による所得は、事業所得となる。", "c": false, "r": "2025.5-32-3", "u": "https://fp2-siken.com/kakomon/2025_5/32.html"}, {"s": "不動産の貸付けを事業的規模で行ったことにより生じた賃貸収入に係る所得は、事業所得となる。", "c": false, "r": "2025.1-32-2", "u": "https://fp2-siken.com/kakomon/2025_1/32.html"}, {"s": "個人が不動産の貸付けを事業的規模で行った場合における賃貸収入による所得は、不動産所得となる。", "c": true, "r": "2024.9-32-2", "u": "https://fp2-siken.com/kakomon/2024_9/32.html"}, {"s": "不動産の貸付けを事業的規模で行ったことにより生じた賃料収入に係る所得は、不動産所得に該当する。", "c": true, "r": "2024.5-32-2", "u": "https://fp2-siken.com/kakomon/2024_5/32.html"}, {"s": "不動産の貸付けを事業的規模で行ったことにより生じた賃料収入に係る所得は、不動産所得となる。", "c": true, "r": "2023.9-32-1", "u": "https://fp2-siken.com/kakomon/2023_9/32.html"}, {"s": "個人による不動産の貸付けが事業的規模である場合、その賃貸収入による所得は、事業所得に該当する。", "c": false, "r": "2022.9-31-3", "u": "https://fp2-siken.com/kakomon/2022_9/31.html"}, {"s": "不動産の貸付けを事業的規模で行ったことにより生じた賃貸収入による所得は、事業所得となる。", "c": false, "r": "2022.1-32-3", "u": "https://fp2-siken.com/kakomon/2022_1/32.html"}, {"s": "個人による不動産の貸付けが事業的規模である場合、その賃貸収入による所得は、事業所得となる。", "c": false, "r": "2020.9-32-2", "u": "https://fp2-siken.com/kakomon/2020_9/32.html"}, {"s": "貸付けが事業的規模で行われているアパート経営の賃貸収入に係る所得は、事業所得に該当する。", "c": false, "r": "2019.5-32-2", "u": "https://fp2-siken.com/kakomon/2019_5/32.html"}], "m": "不動産の貸付けは<b>事業的規模でも「不動産所得」</b>。事業所得にはならない。規模で変わるのは<b>青色申告特別控除の額</b>（事業的規模なら最大65万円、そうでなければ10万円）。", "url": "https://fp2-siken.com/kakomon/2018_9/32.html", "ref": "2018.9-32-2"}, {"uid": "estate-21", "id": 21, "page": "estate", "bunya": "不動産", "freq": 10, "a": "市街化調整区域は、おおむね10年以内に優先的かつ計画的に市街化を図るべき区域とされている。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">市街化調整区域は、都市の中で今後計画的に開発していく場所です。おおむね<strong>10年以内</strong>に、優先して市街地にしていく区域として定められます。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">都市の中には、これから優先して街を広げていく場所があります。その場所を、市街化調整区域と呼びます。\n\n市街化調整区域は、おおむね<strong>10年以内</strong>に市街地にしていく区域です。</div></div>", "ans": false, "k": "これは不適切。本肢は市街化区域の説明です。市街化調整区域は「市街化を抑制すべき区域」とされ、市街化区域と比較して開発行為や建築物の建築等が厳しく制限されています。\n\nこのテーマは関連問題を含めて<strong>10回</strong>まとまっている頻出論点。数字・年齢・期間・上限額などの条件整理が大事。<br><br>\n<div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>市街化区域は「おおむね10年以内に優先的かつ計画的に市街化を図るべき区域」であり、都市計画の基本となるエリアです。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>「<strong style='color: #d11a2a;'>市街化調整区域</strong>」は、逆に「市街化を抑制すべき区域（原則として建物を建ててはいけない区域）」です。名前が似ているので入れ替え問題が頻出です。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>市街化調整区域にある土地は、開発の許可が下りない限り家を建てられないため、非常に安く取引されますが、将来売却するときに困る「負動産」になるリスクがあります。</p>\n</div><div data-joushiki-copy=\"estate-21\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">名称の「調整」は、むやみな開発を抑える区域だと連想できます。10年以内に市街化するのは<strong>市街化区域</strong>の説明です。⚠️ <strong>暗記寄り</strong>：<strong>おおむね10年以内</strong>は暗記寄りです。</p></div>", "rel": [{"s": "都市計画区域のうち、市街化調整区域は、おおむね10年以内に優先的かつ計画的に市街化を図るべき区域である。", "c": false, "r": "2024.1-44-2", "u": "https://fp2-siken.com/kakomon/2024_1/44.html"}, {"s": "市街化区域は、すでに市街地を形成している区域およびおおむね10年以内に優先的かつ計画的に市街化を図るべき区域とされている。", "c": true, "r": "2022.1-45-1", "u": "https://fp2-siken.com/kakomon/2022_1/45.html"}, {"s": "都市計画区域のうち、市街化調整区域は、おおむね10年以内に優先的かつ計画的に市街化を図るべき区域とされている。", "c": false, "r": "2021.5-44-2", "u": "https://fp2-siken.com/kakomon/2021_5/44.html"}, {"s": "市街化区域は、すでに市街地を形成している区域およびおおむね10年以内に優先的かつ計画的に市街化を図るべき区域とされている。", "c": true, "r": "2021.1-45-3", "u": "https://fp2-siken.com/kakomon/2021_1/45.html"}, {"s": "市街化区域は、すでに市街地を形成している区域およびおおむね10年以内に優先的かつ計画的に市街化を図るべき区域とされている。", "c": true, "r": "2019.1-44-1", "u": "https://fp2-siken.com/kakomon/2019_1/44.html"}, {"s": "都市計画法の規定によれば、市街化調整区域は、おおむね10年以内に優先的かつ計画的に市街化を図るべき区域とされている。", "c": false, "r": "2018.9-45-2", "u": "https://fp2-siken.com/kakomon/2018_9/45.html"}, {"s": "準都市計画区域は、都市計画区域内において、おおむね10年以内に優先的かつ計画的に市街化を図るべき区域として指定された区域である。", "c": false, "r": "2015.5-45-4", "u": "https://fp2-siken.com/kakomon/2015_5/45.html"}, {"s": "都市計画区域のうち、市街化調整区域は、おおむね10年以内に優先的かつ計画的に市街化を図るべき区域とされている。", "c": false, "r": "2014.5-44-2", "u": "https://fp2-siken.com/kakomon/2014_5/44.html"}, {"s": "都市計画区域のうち、市街化区域は、すでに市街地を形成している区域およびおおむね10年以内に優先的かつ計画的に市街化を図るべき区域とされている。", "c": true, "r": "2013.5-44-1", "u": "https://fp2-siken.com/kakomon/2013_5/44.html"}], "m": "おおむね10年以内に優先的・計画的に市街化を図るのは<b>市街化区域</b>。<b>市街化調整区域は市街化を抑制すべき区域</b>。", "url": "https://fp2-siken.com/kakomon/2024_9/44.html", "ref": "2024.9-44-2"}, {"uid": "estate-24", "id": 24, "page": "estate", "bunya": "不動産", "freq": 10, "a": "固定資産税評価額は、原則として、3年ごとの基準年度において評価替えが行われる。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">固定資産税評価額は、土地や建物の固定資産税を計算する基準になる価格です。原則として毎年ではなく、<strong>3年ごと</strong>の基準年度に見直します。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">土地や建物の固定資産税は、役所が決めた評価額をもとに計算します。その評価額は、毎年一から決め直すものではありません。\n\n原則として<strong>3年ごと</strong>の基準年度に見直します。</div></div>", "ans": true, "k": "これは適切。固定資産税評価額は、固定資産税や都市計画税の基準となる評価額で、原則として 3 年ごとの基準年度において評価替えが行われます。\n\nこのテーマは関連問題を含めて<strong>10回</strong>まとまっている頻出論点。数字・年齢・期間・上限額などの条件整理が大事。<br><br>\n<div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>固定資産税の基準となる評価額は、全国すべての土地を毎年評価し直すのは市町村の負担が大きすぎるため、一定期間ごとに見直されます。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>地価公示や路線価などは「毎年」更新されますが、固定資産税評価額だけは原則として「<strong style='color: #0b63c5;'>3年ごと</strong>」の評価替えとなっています。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>評価替えの年（基準年度）に地価が大きく下がったのに、税金が急に下がらないことがあるのは、急激な税負担の変化を避けるための「負担調整措置」が働くためです。</p>\n</div><div data-joushiki-copy=\"estate-24\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">全国の土地や建物を毎年すべて評価し直すのは大きな負担です。⚠️ <strong>暗記寄り</strong>：原則<strong>3年ごと</strong>という周期は暗記寄りです。</p></div>", "rel": [{"s": "固定資産税評価額は、原則として、3年ごとの基準年度において評価替えが行われる。", "c": true, "r": "2020.1-42-4", "u": "https://fp2-siken.com/kakomon/2020_1/42.html"}, {"s": "固定資産税評価額は、原則として、3年ごとの基準年度において評価替えが行われる。", "c": true, "r": "2019.5-41-2", "u": "https://fp2-siken.com/kakomon/2019_5/41.html"}, {"s": "固定資産税評価額は、原則として、3年ごとの基準年度において評価替えが行われる。", "c": true, "r": "2018.1-41-3", "u": "https://fp2-siken.com/kakomon/2018_1/41.html"}, {"s": "固定資産税評価額は、原則として4年ごとの基準年度において評価替えが行われる。", "c": false, "r": "2017.5-41-4", "u": "https://fp2-siken.com/kakomon/2017_5/41.html"}, {"s": "固定資産税評価額は、原則として、3年ごとの基準年度に評価替えが行われる。", "c": true, "r": "2017.1-42-4", "u": "https://fp2-siken.com/kakomon/2017_1/42.html"}, {"s": "固定資産税評価額は、原則として3年ごとの基準年度において評価替えが行われる。", "c": true, "r": "2016.1-42-4", "u": "https://fp2-siken.com/kakomon/2016_1/42.html"}, {"s": "固定資産税評価額は、原則として、3年ごとの基準年度において評価替えが行われる。", "c": true, "r": "2015.5-41-3", "u": "https://fp2-siken.com/kakomon/2015_5/41.html"}, {"s": "固定資産税評価額は、原則として、3年ごとの基準年度において評価替えが行われる。", "c": true, "r": "2014.9-41-4", "u": "https://fp2-siken.com/kakomon/2014_9/41.html"}, {"s": "固定資産税評価額は、原則として、3年ごとの基準年度において評価替えが行われる。", "c": true, "r": "2014.1-42-4", "u": "https://fp2-siken.com/kakomon/2014_1/42.html"}], "m": "固定資産税評価額は<b>3年ごと</b>の基準年度に評価替え。", "url": "https://fp2-siken.com/kakomon/2022_5/42.html", "ref": "2022.5-42-4"}, {"uid": "inheritance2-4", "id": 4, "page": "inheritance2", "bunya": "相続", "freq": 10, "a": "養子縁組（特別養子縁組ではない）が成立した場合、養子と実方の父母との親族関係は<strong style='color: #d11a2a;'>終了する</strong>。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">普通養子縁組では、子と養親との間に新しい親子関係ができます。同時に、養子と実の父母との<strong>法律上の親族関係は終了します</strong>。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">普通養子縁組をすると、養親と養子の間に新しい親子関係ができます。養親との新しい親子関係ができた直後です。\n\n実の父母との<strong>法律上の親族関係は終わります</strong>。</div></div>", "ans": false, "k": "【不適切】普通養子縁組では、養親との親子関係が新たに生まれますが、実親との親族関係はそのまま続きます。つまり「親が増える」イメージです。一方、特別養子縁組は実親との関係が完全に切れます。覚え方は「普通＝追加、特別＝入れ替え」。試験では「普通」と「特別」を入れ替えるひっかけが頻出です。<br><br>\n<div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>普通養子縁組は、実の親との関係を保ったまま、育ての親（養親）とも親子関係を結ぶ制度です（親が2組になるイメージです）。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>普通養子縁組が成立しても、実方の父母との親族関係は「<strong style='color: #d11a2a;'>終了する</strong>」というのはフェイクです。終了するのは「特別養子縁組（原則6歳未満）」の場合のみです。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>普通養子になった子供は、育ての親（養親）が亡くなったときの相続人になるだけでなく、実の親が亡くなったときにも相続人になれるという「二重取り」が可能です。</p>\n</div><div data-joushiki-copy=\"inheritance2-4\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">普通養子は「親が追加される」、特別養子は「親が入れ替わる」と考えると分かりやすいです。実親との関係が終わるのは特別養子縁組です。</p></div>", "rel": [{"s": "養子縁組（特別養子縁組ではない）が成立した場合であっても、養子と実方の父母との親族関係は終了しない。", "c": true, "r": "2022.1-52-2", "u": "https://fp2-siken.com/kakomon/2022_1/52.html"}, {"s": "特別養子縁組が成立しても、養子と実方の父母との親族関係は終了しない。", "c": false, "r": "2021.9-52-1", "u": "https://fp2-siken.com/kakomon/2021_9/52.html"}, {"s": "養子縁組（特別養子縁組ではない）が成立した場合、養子と実方の父母との親族関係は終了する。", "c": false, "r": "2021.3-51-4", "u": "https://fp2-siken.com/kakomon/2021_3/51.html"}, {"s": "養子縁組（特別養子縁組ではない）が成立した場合、養子と実方の父母との親族関係は終了する。", "c": false, "r": "2019.1-52-1", "u": "https://fp2-siken.com/kakomon/2019_1/52.html"}, {"s": "特別養子縁組が成立した場合、原則として養子と実方の父母との親族関係は終了する。", "c": true, "r": "2018.9-51-2", "u": "https://fp2-siken.com/kakomon/2018_9/51.html"}, {"s": "特別養子縁組が成立した場合、原則として養子と実方の父母との親族関係は終了する。", "c": true, "r": "2017.9-51-2", "u": "https://fp2-siken.com/kakomon/2017_9/51.html"}, {"s": "養子縁組（特別養子縁組ではない）が成立した場合、養子と実方の父母との親族関係は終了しない。", "c": true, "r": "2017.5-52-4", "u": "https://fp2-siken.com/kakomon/2017_5/52.html"}, {"s": "特別養子縁組が成立した場合、原則として養子と実方の父母との親族関係は終了する。", "c": true, "r": "2016.5-51-2", "u": "https://fp2-siken.com/kakomon/2016_5/51.html"}, {"s": "養子縁組（特別養子縁組ではない）が成立した場合、養子と実方の父母との親族関係は終了する。", "c": false, "r": "2014.5-52-1", "u": "https://fp2-siken.com/kakomon/2014_5/52.html"}], "m": "<b>普通養子は実方の父母との親族関係が継続</b>する（実親からも養親からも相続できる＝二重の相続権）。関係が終了するのは<b>特別養子</b>。", "url": "https://fp2-siken.com/kakomon/2016_1/52.html", "ref": "2016.1-52-4"}, {"uid": "life2-3", "id": 3, "page": "life2", "bunya": "ライフ", "freq": 9, "a": "老齢厚生年金の繰下げ支給を申し出る場合、老齢基礎年金の繰下げ支給と<strong style='color: #d11a2a;'>同時に申し出なければならない</strong>。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">老齢基礎年金と老齢厚生年金は、どちらも受け取りを遅らせて金額を増やせます。老齢厚生年金を繰り下げるときは、<strong>老齢基礎年金も同じ時期に</strong>繰り下げなければなりません。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">65歳ですぐ年金をもらわず、受け取りを遅らせて毎月の額を増やしたい人の話です。\n\n会社員の上乗せ年金を遅らせるなら、国民年金の部分も<strong>同じ時期まで一緒に遅らせる</strong>必要があります。</div></div>", "ans": false, "k": "不適切。老齢基礎年金と老齢厚生年金の繰下げ支給は、それぞれ別個に選択できます。\n一方だけ繰下げることも可能で、申出のタイミングも同時である必要はありません。\n繰上げ支給は同時請求が必要ですが、繰下げ支給は別々に選べる点が定番のひっかけです。<br><br>\n<div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\"><h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4><p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>繰下げ制度は、働き方や生活資金の状況に応じて受給開始時期を柔軟に選べるようにするための仕組みです。基礎年金と厚生年金は性質が異なるため、繰下げも独立して選択できる設計になっています。</p><p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>頻出なのは、<strong style='color: #d11a2a;'>繰上げと繰下げのルールを逆にする</strong>問題です。<strong style='color: #0b63c5;'>繰上げは同時</strong>、<strong style='color: #0b63c5;'>繰下げは別々でも可</strong>で対比して覚えると崩れません。</p><p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>年金相談では、『基礎年金だけ先にもらい、厚生年金だけ後ろにずらしたい』というニーズがあります。実務では、生活費や就労収入に応じて別々に試算する場面があります。</p></div><div data-joushiki-copy=\"life2-3\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">基礎年金と厚生年金は別の年金なので、老後の資金計画に合わせて別々に選べるほうが柔軟です。繰下げは<strong>それぞれ別に</strong>申し出られます。</p></div>", "rel": [{"s": "老齢厚生年金の受給権者が、老齢厚生年金の繰下げ支給の申出をする場合、老齢基礎年金の繰下げ支給の申出を同時に行わなければならない。", "c": false, "r": "2025.1-4-3", "u": "https://fp2-siken.com/kakomon/2025_1/04.html"}, {"s": "老齢厚生年金の受給権者が老齢厚生年金の繰下げ支給の申出をする場合、老齢基礎年金の繰下げ支給の申出を同時に行わなければならない。", "c": false, "r": "2024.5-6-3", "u": "https://fp2-siken.com/kakomon/2024_5/06.html"}, {"s": "老齢厚生年金の受給権者が老齢厚生年金の繰下げ支給の申出をする場合、老齢基礎年金の繰下げ支給の申出を同時に行わなければならない。", "c": false, "r": "2022.5-5-2", "u": "https://fp2-siken.com/kakomon/2022_5/05.html"}, {"s": "老齢厚生年金の受給権者が老齢厚生年金の繰下げ支給の申出をする場合、老齢基礎年金の繰下げ支給の申出を同時に行わなければならない。", "c": false, "r": "2021.5-7-2", "u": "https://fp2-siken.com/kakomon/2021_5/07.html"}, {"s": "老齢厚生年金の繰下げ支給を申し出る場合、老齢基礎年金の繰下げ支給と同時に申し出なければならない。", "c": false, "r": "2020.9-7-3", "u": "https://fp2-siken.com/kakomon/2020_9/07.html"}, {"s": "老齢厚生年金の受給権者は、原則として66歳到達以降に老齢厚生年金の繰下げ支給の申出ができるが、当該申出は、老齢基礎年金の繰下げ支給の申出と同時に行わなければならない。", "c": false, "r": "2019.5-6-4", "u": "https://fp2-siken.com/kakomon/2019_5/06.html"}, {"s": "老齢厚生年金の繰下げ支給の申出は、老齢基礎年金の繰下げ支給の申出とは別に行うことができる。", "c": true, "r": "2018.5-5-3", "u": "https://fp2-siken.com/kakomon/2018_5/05.html"}, {"s": "老齢厚生年金の支給繰下げの申出をする場合、その申出は老齢基礎年金の支給繰下げの申出と同時に行わなければならない。", "c": false, "r": "2013.1-5-3", "u": "https://fp2-siken.com/kakomon/2013_1/05.html"}], "m": "<b>繰下げは老齢基礎・老齢厚生を別々に申し出できる</b>。同時でなくてよい。※<b>繰上げは同時が必須</b>——ここが逆。", "url": "https://fp2-siken.com/kakomon/2017_9/06.html", "ref": "2017.9-6-3"}, {"uid": "tax-19", "id": 19, "page": "tax", "bunya": "タックス", "freq": 9, "a": "損益計算書の営業利益の額は、売上総利益の額から<strong style='color: #0b63c5;'>販売費及び一般管理費</strong>の合計額を差し引いて算出する。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">営業利益は、会社が本業でどれだけ利益を出したかを見る数字です。売上から仕入れなどを引いた売上総利益から、給料や広告費などの<strong>販売費・一般管理費を引いて</strong>計算します。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">商品を売った額から仕入れ代を引くと、まず大まかな利益が出ます。そこから、社員の給料や広告代など、本業を動かす費用も引きます。\n\nこうして残った<strong>本業の利益が営業利益</strong>です。</div></div>", "ans": true, "k": "✅ <strong>適切</strong>です。<br><br>営業利益は、「売上総利益」から「<span style='background: linear-gradient(transparent 70%, #fff3e0 70%); font-weight: bold;'>販売費及び一般管理費（販管費）</span>」を引いて計算します。<br>・販管費とは、社員の給料や家賃、広告宣伝費などのことです。<br><br>\n<div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-bottom: 5px;\">✨ 【FP2級合格用】深掘り解説</h4>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #28a745;\">■</span> 制度の背景・理由：</strong><br>損益計算書（P/L）の利益の計算に関する問題です。営業利益は「本業の営業活動で稼いだ利益」を示します。</p>\n  <p style=\"margin: 0 0 10px 0;\"><strong><span style=\"color: #dc3545;\">■</span> 試験のひっかけポイント：</strong><br>「売上総利益（粗利）」から、給料や家賃などの「<strong style='color: #0b63c5;'>販売費及び一般管理費</strong>」を引いたものが営業利益になります。利益の段階（売上総→営業→経常→純）をしっかり覚えましょう。</p>\n  <p style=\"margin: 0;\"><strong><span style=\"color: #ffc107;\">■</span> 実務での活用例：</strong><br>商品がいっぱい売れて粗利が出ても、広告費や人件費（販管費）をかけすぎると営業利益が赤字になってしまうため、会社の実力を測る重要な指標になります。</p>\n</div><div data-joushiki-copy=\"tax-19\" style=\"background-color: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px;\"><h4 style=\"margin: 0 0 10px 0; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;\">⑤ 常識力</h4><p style=\"margin: 0;\">商品を売って得た粗い利益から、営業活動にかかった人件費や事務費を引けば、本業で残った利益になると考えられます。</p></div>", "rel": [{"s": "損益計算書における営業利益の額は、経常利益の額から販売費及び一般管理費の額を差し引いた額である。", "c": false, "r": "2025.5-40-2", "u": "https://fp2-siken.com/kakomon/2025_5/40.html"}, {"s": "損益計算書において、営業利益の額は、売上総利益の額から販売費及び一般管理費の額を差し引いた額である。", "c": true, "r": "2025.1-40-3", "u": "https://fp2-siken.com/kakomon/2025_1/40.html"}, {"s": "損益計算書の営業利益は、売上総利益金額から販売費及び一般管理費の合計額を控除した金額を表示している。", "c": true, "r": "2024.1-40-3", "u": "https://fp2-siken.com/kakomon/2024_1/40.html"}, {"s": "損益計算書の営業利益の額は、売上総利益の額から販売費及び一般管理費の額を差し引いた額である。", "c": true, "r": "2023.9-40-1", "u": "https://fp2-siken.com/kakomon/2023_9/40.html"}, {"s": "損益計算書において、営業利益の額は、売上総利益の額から販売費及び一般管理費の額を差し引いた額である。", "c": true, "r": "2023.5-40-1", "u": "https://fp2-siken.com/kakomon/2023_5/40.html"}, {"s": "損益計算書の営業利益の額は、経常利益の額から販売費及び一般管理費の額を差し引いた額である。", "c": false, "r": "2022.9-40-2", "u": "https://fp2-siken.com/kakomon/2022_9/40.html"}, {"s": "損益計算書における経常利益の額は、売上総利益の額から販売費及び一般管理費の額を差し引いた額である。", "c": false, "r": "2022.1-40-4", "u": "https://fp2-siken.com/kakomon/2022_1/40.html"}, {"s": "損益計算書において、営業利益の額は、売上総利益の額から販売費及び一般管理費の額を差し引いた額である。", "c": true, "r": "2020.9-40-2", "u": "https://fp2-siken.com/kakomon/2020_9/40.html"}], "m": "<b>営業利益 ＝ 売上総利益 − 販売費及び一般管理費</b>", "url": "https://fp2-siken.com/kakomon/2018_5/40.html", "ref": "2018.5-40-3"}, {"uid": "estate-27", "id": 27, "page": "estate", "bunya": "不動産", "freq": 9, "a": "3,000万円特別控除と軽減税率の特例は、重複して適用を受けることができる。", "b": "<div class=\"variant-b-section variant-b-detailed\" data-b-copy=\"detailed\"><span class=\"variant-b-section-label\">くわしい言い換え</span><div class=\"variant-b-copy\">マイホームの売却益から3,000万円を引く特例と、長期所有した自宅の税率を下げる特例があります。それぞれの条件を満たせば、<strong>二つを一緒に使えます</strong>。</div></div><hr class=\"variant-b-divider\"><div class=\"variant-b-section variant-b-casual\" data-b-copy=\"casual\"><span class=\"variant-b-section-label\">もっとやさしく</span><div class=\"variant-b-copy\">マイホームを売ったときには、利益から3,000万円を引く制度と、残った利益の税率を軽くする制度があります。二つとも条件を満たしています。\n\nその二つを<strong>一緒に使えます</strong>。</div></div>", "ans": true, "k": "これは適切。軽減税率の特例と3,000万円特別控除は、それぞれの要件を満たしていれば重複して適用を受けることができます。\n\nこのテーマは関連問題を含めて<strong>9回</strong>まとまっている頻出論点。数字・年齢・期間・上限額などの条件整理が大事。<br><br>\n<div style=\"background-color: #fdfcf9; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);\">\n  <h4 style=\"color: #0056b3; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #cce5ff; padding-
